name: Build Android APK

on:
  push:
    branches: [ "claude/android-finnish-speech-to-text-uCSbn", "main" ]
    paths:
      - 'android-stt-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x android-stt-app/gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: android-stt-app

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: puheentunnistus-debug
          path: android-stt-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
