<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hahmo -> sprite sheet</title>
<style>
  html,body{height:100%;margin:0;background:#2b3648;font-family:monospace;color:#eee}
  #ui{position:fixed;left:12px;top:12px;z-index:5;background:#0008;padding:10px;border-radius:6px;max-width:340px}
  #ui label{display:block;margin:6px 0 2px}
  #ui input,#ui select{width:100%;box-sizing:border-box}
  #ui button{margin-top:8px;padding:6px 10px;cursor:pointer;width:100%}
  #status{position:fixed;left:12px;bottom:12px;z-index:5;color:#8f8;font-size:12px;white-space:pre;max-width:600px}
  canvas.main{display:block}
  #sheetWrap{position:fixed;right:12px;top:12px;z-index:5;background:#0008;padding:8px;border-radius:6px}
  #sheetWrap canvas{border:1px solid #555;image-rendering:pixelated;max-width:400px}
  #dl{margin-top:6px;display:block}
</style>
</head>
<body>
<div id="ui">
  <label>GLB-tiedosto</label>
  <select id="malli">
    <option value="assets/hahmot/trex-exported-model.glb">trex-exported-model.glb</option>
    <option value="assets/hahmot/horse-exported-model.glb">horse-exported-model.glb</option>
    <option value="assets/hahmot/rabbit-exported-model.glb">rabbit-exported-model.glb</option>
  </select>
  <button id="lataaNappi">Lataa malli</button>

  <label>Klippi (jos animoitu)</label>
  <select id="klippi"></select>

  <label>Kehyksiä</label>
  <input id="framet" type="number" value="8" min="1" max="16">

  <label>Kehyksen koko (px)</label>
  <input id="koko" type="number" value="220" min="64" max="600">

  <label><input id="siluetti" type="checkbox" checked> Siluetti (tasainen sävy, ei valaistusta)</label>
  <label>Sävy (silmukoitu materiaali)</label>
  <input id="vari" type="color" value="#2b3648">

  <button id="kaappaaNappi">Kaappaa kehykset -> sprite sheet</button>
  <a id="dl" href="#" download>lataa PNG</a>
  <div id="status">valitse malli ja lataa</div>
</div>

<div id="sheetWrap"><canvas id="sheet"></canvas></div>

<script type="importmap">
{ "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/addons/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const status = document.getElementById('status');
const malliSel = document.getElementById('malli');
const klippiSel = document.getElementById('klippi');
const frametInput = document.getElementById('framet');
const kokoInput = document.getElementById('koko');
const siluettiChk = document.getElementById('siluetti');
const variInput = document.getElementById('vari');
const sheetCanvas = document.getElementById('sheet');
const dl = document.getElementById('dl');

// --- pää-scene, jossa mallia katsotaan / orbitoidaan valinnan avuksi ---
const naytaScene = new THREE.Scene();
naytaScene.background = new THREE.Color(0x2b3648);
const naytaCam = new THREE.PerspectiveCamera(35, innerWidth/innerHeight, 0.05, 100);
naytaCam.position.set(3, 2, 5);
const naytaRenderer = new THREE.WebGLRenderer({ antialias: true });
naytaRenderer.setPixelRatio(Math.min(devicePixelRatio, 2));
naytaRenderer.setSize(innerWidth, innerHeight);
naytaRenderer.domElement.className = 'main';
document.body.appendChild(naytaRenderer.domElement);
const controls = new OrbitControls(naytaCam, naytaRenderer.domElement);
controls.target.set(0, 1, 0);
naytaScene.add(new THREE.HemisphereLight(0xffffff, 0x333344, 1.4));
const naytaSuora = new THREE.DirectionalLight(0xffffff, 1.6);
naytaSuora.position.set(2, 4, 3);
naytaScene.add(naytaSuora);
const naytaGrid = new THREE.GridHelper(6, 12, 0x556, 0x334);
naytaScene.add(naytaGrid);

// --- kaappausrenderöijä: ortografinen, läpinäkyvä tausta ---
const kaappausRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
kaappausRenderer.setPixelRatio(1);

let malli = null, mixer = null, klipit = [], nykyinenKlippi = null;
let bbox = null, keskiY = 0, korkeusYks = 1;
const loader = new GLTFLoader();
const clock = new THREE.Clock();

function tyhjennaScene() {
  if (malli) { naytaScene.remove(malli); malli = null; }
  mixer = null; klipit = []; klippiSel.innerHTML = '';
}

function paivitaBbox() {
  bbox = new THREE.Box3().setFromObject(malli);
  const koko = bbox.getSize(new THREE.Vector3());
  korkeusYks = koko.y || 1;
  keskiY = (bbox.min.y + bbox.max.y) / 2;
  const keskiX = (bbox.min.x + bbox.max.x) / 2;
  const keskiZ = (bbox.min.z + bbox.max.z) / 2;
  controls.target.set(keskiX, keskiY, keskiZ);
  naytaCam.position.set(keskiX + korkeusYks*1.4, keskiY + korkeusYks*0.5, keskiZ + korkeusYks*1.8);
}

document.getElementById('lataaNappi').addEventListener('click', () => {
  tyhjennaScene();
  status.textContent = 'ladataan ' + malliSel.value + ' ...';
  loader.load(malliSel.value, gltf => {
    malli = gltf.scene;
    naytaScene.add(malli);
    paivitaBbox();
    if (gltf.animations && gltf.animations.length) {
      mixer = new THREE.AnimationMixer(malli);
      klipit = gltf.animations;
      klipit.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.name; opt.textContent = c.name + ' (' + c.duration.toFixed(2) + 's)';
        klippiSel.appendChild(opt);
      });
      const staattinenOpt = document.createElement('option');
      staattinenOpt.value = '__staattinen__';
      staattinenOpt.textContent = '(staattinen poosi, ei animaatiota)';
      klippiSel.appendChild(staattinenOpt);
    } else {
      const opt = document.createElement('option');
      opt.value = '__staattinen__'; opt.textContent = '(staattinen, ei klippejä)';
      klippiSel.appendChild(opt);
    }
    status.textContent = 'ladattu. korkeus (native yks.): ' + korkeusYks.toFixed(3);
  }, undefined, err => {
    status.textContent = 'VIRHE: ' + err.message;
  });
});

function asetaMateriaali(siluetti, vari) {
  if (siluetti) {
    // skinning:true PAKOLLINEN - muuten luurangolliset (animoidut) mallit
    // kuten fox.glb renderöityvät rikki (vain jäykät osat näkyvät, loput
    // luukkeen mukana liikkuvat kärjet katoavat/menevät väärään kohtaan)
    naytaScene.overrideMaterial = new THREE.MeshBasicMaterial({ color: vari, skinning: true, side: THREE.DoubleSide });
  } else {
    naytaScene.overrideMaterial = null;
  }
}

// TÄRKEÄ BUGIKORJAUS (Jarno: "fox tail is missing peace", 31.8.2026):
// THREE.Box3().setFromObject(malli) oletuksena (precise:false) käyttää
// SkinnedMeshin OMAA cachettua geometry-tason laatikkoa, joka edustaa
// LEPOPOOSIA (bind pose) - ei nykyistä animoitua asentoa! Luuranko-
// deformaatio tapahtuu GPU:lla vertex shaderissa, geometrian omat
// bounding-box-tiedot eivät päivity animaation mukana ellei precise:true
// ole annettu (silloin Three.js käy oikeasti läpi jokaisen kärjen
// nykyisen, luiden vääntämän maailma-asennon). Kun laatikko lasketaan
// väärin (aina samana, lepoasennon mukaan) mutta esim. Walk/Run/Bark
// heiluttaa häntää lepoasentoa kauemmas, häntä piirtyy kaappauskehyksen
// ULKOPUOLELLE eli leikkautuu pois - näytti "hännästä puuttuu pala".
//
// Korjaus kahdessa osassa:
// 1. Kaikki bbox-laskenta käyttää nyt precise:true (oikeat, animaation
//    mukaiset kärkipisteet, ei cachettua lepoasento-laatikkoa).
// 2. laskeKlipinBbox() näytteistää KOKO klipin (ei vain yhtä poosia) ja
//    ottaa kaikkien näytteiden UNIONIN - näin yksi ainoa, koko animaation
//    kattava kehysrajaus käytetään KAIKILLE saman klipin kaapatuille
//    kehyksille. Tämä sekä estää leikkautumisen (mikä tahansa poosi koko
//    klipin aikana mahtuu kehykseen) että pitää hahmon koon/sijainnin
//    VAKIONA kehyksestä toiseen (ei "hyppimistä" spritesheetissä, mikä
//    olisi seurannut jos jokainen kehys olisi saanut oman zoomin).

function laskeKlipinBbox(klippi, naytteita) {
  naytteita = naytteita || 24;
  if (!mixer || !klippi) return new THREE.Box3().setFromObject(malli, true);
  const action = mixer.clipAction(klippi);
  action.play();
  action.paused = true;
  const yhdistetty = new THREE.Box3();
  for (let i = 0; i < naytteita; i++) {
    const t = (klippi.duration * i) / Math.max(1, naytteita - 1);
    mixer.setTime(0);
    action.time = Math.min(t, klippi.duration - 0.0001);
    mixer.update(0);
    yhdistetty.union(new THREE.Box3().setFromObject(malli, true));
  }
  action.stop();
  return yhdistetty;
}

// TÄRKEÄ JATKOKORJAUS (Jarno: "on jump it scales smaller", 31.8.2026):
// laskeKlipinBbox() korjasi leikkautumisen JOKAISEN KLIPIN sisällä, mutta
// jokainen klippi sai OMAN riippumattoman laatikkonsa - Jump-klipin poosit
// levittäytyvät paljon laajemmalle (jalat auki, vartalo kaartuu ilmassa)
// kuin esim. Walk, joten Jumpin laatikko on isompi -> kamera loitontuu
// enemmän -> kettu näyttää PIENEMMÄLTÄ samassa 260x260-kehyksessä kuin
// Walkissa, vaikka itse malli on samankokoinen. Peli skaalaa jokaisen
// spritesheetin SAMALLA kertoimella, joten tämä näkyi suoraan ruudulla
// eri kokoisena ketuna eri animaatioiden välillä.
//
// Korjaus: laskeGlobaaliBbox() näytteistää KAIKKI annetut klipit ja ottaa
// union-laatikon niiden YLI - tätä YHTÄ laatikkoa käytetään sitten KAIKKIEN
// klippien kaappaukseen, jolloin kehysrajaus (siis ketun koko suhteessa
// 260x260-kehykseen) on VAKIO joka ikiselle spritesheetille. Jump saa
// enemmän tyhjää marginaalia ympärilleen kuin Walk tarvitsisi yksinään,
// mutta se on juuri oikein - ketun TODELLINEN koko pysyy samana kaikissa
// animaatioissa, mikä on tärkeämpää kuin tiivis rajaus per klippi.
function laskeGlobaaliBbox(klipit, naytteitaPerKlippi) {
  const yhdistetty = new THREE.Box3();
  klipit.forEach(klippi => {
    yhdistetty.union(laskeKlipinBbox(klippi, naytteitaPerKlippi));
  });
  return yhdistetty;
}

function kaappaaYksiKehys(frameKoko, zoomKerroin, ylosAkseli, katseluAkseli, annettuLaatikko, pakotettuHalkaisija) {
  // siirrä kamera samaan kohtaan kuin naytaCam mutta orthographic, side-on
  // zoomKerroin: joillain malleilla (esim. terminator-t800.glb) bounding box
  // on rikki (§26-bugi, ~10x liian suuri) - tällä voi korjata kehyksen kokoa
  // manuaalisesti ilman että luotetaan automaattiseen laatikkoon.
  // ylosAkseli: 'y' (oletus) tai 'z' - jotkin mallit (esim. loki.glb) on
  // viety siten että hahmon "ylös"-suunta on Z eikä Y.
  // katseluAkseli: mistä suunnasta kamera katsoo kohti keskipistettä -
  // 'z' (oletus, kamera +Z-puolella) tai 'x' (kamera +X-puolella) - esim.
  // fox.glb:n "pituusakseli" (kyljen profiili) osoittautui olevan Z, ei X,
  // joten kamera pitää asettaa X-akselille nähdäkseen kyljen eikä takaa/edestä.
  // annettuLaatikko: valinnainen ESILASKETTU Box3 (ks. laskeKlipinBbox) -
  // käytetään KESKIPISTEEN (kamera katsoo tähän) lähteenä. Jos ei annettu,
  // lasketaan NYKYISESTÄ poosista precise:true-tarkkuudella.
  // pakotettuHalkaisija: valinnainen, OHITTAA annettuLaatikko/nykypoosin
  // koon kehyksen ZOOMIN (frustumin koon) laskennassa - käytetään keskipiste
  // silti laatikosta/nykypoosista. TÄTÄ TARVITAAN pystysuoraa root-motionia
  // sisältäville klipeille (esim. Jump, Jarno: "cuts some part of fox when
  // jumps", 31.8.2026): jos koko klipin laatikko (joka kattaa ILMAAN
  // NOUSEMISEN) käytettäisiin sekä keskipisteeksi ETTÄ zoomiksi jokaiselle
  // yksittäiselle kehykselle, hahmo ajautuisi pois kehyksen keskeltä niissä
  // kehyksissä joissa se on maassa (koska klipin KESKIPISTE on korkealla
  // ilmassa, ei maan tasolla) - peli olettaa ketun pysyvän suunnilleen
  // samassa kohtaa kehystä joka animaatiossa (kiinteä origin 0.5,0.82), joten
  // "kettu uppoaa maahan" tietyissä kehyksissä. Ratkaisu: käytä NYKYISEN
  // POOSIN omaa (precise) laatikkoa keskipisteeksi (kamera seuraa hahmoa
  // joka kehyksessä, hahmo pysyy aina kehyksen keskellä) MUTTA pakota zoom
  // pysymään VAKIONA (sama kuin muilla animaatioilla) erillisellä
  // pakotettuHalkaisija-arvolla - näin koko/mittakaava pysyy
  // yhdenmukaisena EIKÄ hahmo karkaa kehyksen reunoille/ulkopuolelle.
  zoomKerroin = zoomKerroin || 1;
  ylosAkseli = ylosAkseli || 'y';
  katseluAkseli = katseluAkseli || 'z';
  const laatikko = annettuLaatikko || new THREE.Box3().setFromObject(malli, true);
  const koko = laatikko.getSize(new THREE.Vector3());
  const keski = laatikko.getCenter(new THREE.Vector3());
  const halkaisija = (pakotettuHalkaisija || koko.length() || 1) * zoomKerroin;
  const puoliKorkeus = halkaisija * 0.55; // koko halkaisija mahtuu reilusti kehykseen
  const aspect = 1;
  const etaisyys = halkaisija * 3;
  const cam = new THREE.OrthographicCamera(-puoliKorkeus*aspect, puoliKorkeus*aspect, puoliKorkeus, -puoliKorkeus, 0.01, etaisyys + halkaisija * 3);
  if (ylosAkseli === 'z') cam.up.set(0, 0, 1); else cam.up.set(0, 1, 0);
  if (katseluAkseli === 'x') cam.position.set(keski.x + etaisyys, keski.y, keski.z);
  else if (ylosAkseli === 'z') cam.position.set(keski.x, keski.y + etaisyys, keski.z);
  else cam.position.set(keski.x, keski.y, keski.z + etaisyys);
  cam.lookAt(keski.x, keski.y, keski.z);

  kaappausRenderer.setSize(frameKoko, frameKoko);
  kaappausRenderer.setClearColor(0x000000, 0);
  kaappausRenderer.render(naytaScene, cam);
  return kaappausRenderer.domElement;
}

document.getElementById('kaappaaNappi').addEventListener('click', () => {
  if (!malli) { status.textContent = 'lataa malli ensin'; return; }
  asetaMateriaali(siluettiChk.checked, variInput.value);
  naytaGrid.visible = false; // muuten ruudukko täyttää koko kehyksen läpinäkyvyyden sijaan
  naytaScene.background = null; // scene.background täyttäisi koko kehyksen läpinäkyvyyden sijaan

  const frameKoko = parseInt(kokoInput.value, 10);
  const klippiNimi = klippiSel.value;
  let maara = parseInt(frametInput.value, 10) || 1;

  const kehykset = [];

  if (klippiNimi === '__staattinen__' || !mixer) {
    if (mixer) mixer.stopAllAction();
    const canvas = kaappaaYksiKehys(frameKoko);
    kehykset.push(canvas.toDataURL('image/png'));
  } else {
    const klippi = klipit.find(c => c.name === klippiNimi);
    const klipinLaatikko = laskeKlipinBbox(klippi); // koko klipin kattava, ei leikkaa mitään
    const action = mixer.clipAction(klippi);
    action.play();
    action.paused = true;
    for (let i = 0; i < maara; i++) {
      const t = (klippi.duration * i) / Math.max(1, maara - (maara > 1 ? 1 : 0));
      mixer.setTime(0); // reset ennen asetusta, joku three-versio vaatii tämän
      action.time = Math.min(t, klippi.duration - 0.0001);
      mixer.update(0);
      const canvas = kaappaaYksiKehys(frameKoko, undefined, undefined, undefined, klipinLaatikko);
      kehykset.push(canvas.toDataURL('image/png'));
    }
    action.stop();
  }

  naytaGrid.visible = true;
  naytaScene.background = new THREE.Color(0x2b3648);

  // koosta sheet: vaakariviin, frameKoko x frameKoko per ruutu
  sheetCanvas.width = frameKoko * kehykset.length;
  sheetCanvas.height = frameKoko;
  const ctx = sheetCanvas.getContext('2d');
  ctx.clearRect(0, 0, sheetCanvas.width, sheetCanvas.height);

  let ladattu = 0;
  kehykset.forEach((dataUrl, i) => {
    const img = new Image();
    img.onload = () => {
      ctx.drawImage(img, i * frameKoko, 0, frameKoko, frameKoko);
      ladattu++;
      if (ladattu === kehykset.length) {
        status.textContent = `valmis: ${kehykset.length} kehystä, ${frameKoko}x${frameKoko}/kehys, sheet ${sheetCanvas.width}x${sheetCanvas.height}`;
        dl.href = sheetCanvas.toDataURL('image/png');
        const nimiOsa = malliSel.value.split('/').pop().replace('.glb','');
        const klippiOsa = klippiNimi === '__staattinen__' ? 'static' : klippiNimi;
        dl.download = `${nimiOsa}-${klippiOsa}.png`;
      }
    };
    img.src = dataUrl;
  });
});

addEventListener('resize', () => {
  naytaCam.aspect = innerWidth / innerHeight;
  naytaCam.updateProjectionMatrix();
  naytaRenderer.setSize(innerWidth, innerHeight);
});

// --- ohjelmallinen API automatisointia varten (javascript_exec) ---
window.__api = {
  bbox() {
    const laatikko = new THREE.Box3().setFromObject(malli);
    return { min: laatikko.min, max: laatikko.max, center: laatikko.getCenter(new THREE.Vector3()), size: laatikko.getSize(new THREE.Vector3()) };
  },
  // laskee union-laatikon USEAN klipin yli (nimilistalla) - käytä TÄTÄ
  // tulosta kaappaa()-kutsujen globaaliBbox-parametrina kun haluat että
  // koko erä spritesheettejä pysyy keskenään samassa mittakaavassa
  // (ks. laskeGlobaaliBbox():n kommentti yllä).
  laskeGlobaaliBbox(klippiNimet, naytteitaPerKlippi) {
    const valitut = klippiNimet && klippiNimet.length
      ? klipit.filter(c => klippiNimet.includes(c.name))
      : klipit;
    return laskeGlobaaliBbox(valitut, naytteitaPerKlippi);
  },
  meshBboxit() {
    const tulos = [];
    malli.traverse(n => {
      if (n.isMesh) {
        const b = new THREE.Box3().setFromObject(n);
        tulos.push({ name: n.name, min: b.min, max: b.max, size: b.getSize(new THREE.Vector3()) });
      }
    });
    return tulos;
  },
  lataa(polku) {
    return new Promise((resolve, reject) => {
      tyhjennaScene();
      loader.load(polku, gltf => {
        malli = gltf.scene;
        naytaScene.add(malli);
        paivitaBbox();
        klipit = (gltf.animations || []);
        if (klipit.length) mixer = new THREE.AnimationMixer(malli);
        resolve({ korkeusYks, klipit: klipit.map(c => ({ name: c.name, duration: c.duration })) });
      }, undefined, reject);
    });
  },
  // globaaliBbox: valinnainen ESILASKETTU THREE.Box3 (ks. laskeGlobaaliBboxKaikille
  // alla) - jos annettu, käytetään sellaisenaan JOKAISELLE klipille sen sijaan
  // että jokainen klippi saisi oman laatikkonsa. Näin kaikki samalla globaalilla
  // laatikolla kaapatut spritesheetit pysyvät KESKENÄÄN samassa mittakaavassa
  // (ks. laskeGlobaaliBbox():n kommentti - muuten esim. Jump näyttää pienemmältä
  // kuin Walk koska sen omat poosit levittäytyvät laajemmalle).
  kaappaa(klippiNimi, maara, frameKoko, siluetti, vari, zoomKerroin, ylosAkseli, katseluAkseli, globaaliBbox) {
    asetaMateriaali(siluetti !== false, vari || '#2b3648');
    naytaGrid.visible = false;
    naytaScene.background = null;
    const kehykset = [];
    if (!klippiNimi || klippiNimi === '__staattinen__' || !mixer) {
      if (mixer) mixer.stopAllAction();
      kehykset.push(kaappaaYksiKehys(frameKoko, zoomKerroin, ylosAkseli, katseluAkseli, globaaliBbox).toDataURL('image/png'));
    } else {
      const klippi = klipit.find(c => c.name === klippiNimi);
      const laatikko = globaaliBbox || laskeKlipinBbox(klippi); // koko klipin (tai koko erän) kattava, ei leikkaa mitään
      const action = mixer.clipAction(klippi);
      action.play(); action.paused = true;
      for (let i = 0; i < maara; i++) {
        const t = (klippi.duration * i) / Math.max(1, maara - (maara > 1 ? 1 : 0));
        mixer.setTime(0);
        action.time = Math.min(t, klippi.duration - 0.0001);
        mixer.update(0);
        kehykset.push(kaappaaYksiKehys(frameKoko, zoomKerroin, ylosAkseli, katseluAkseli, laatikko).toDataURL('image/png'));
      }
      action.stop();
    }
    naytaGrid.visible = true;
    naytaScene.background = new THREE.Color(0x2b3648);

    sheetCanvas.width = frameKoko * kehykset.length;
    sheetCanvas.height = frameKoko;
    const ctx = sheetCanvas.getContext('2d');
    ctx.clearRect(0, 0, sheetCanvas.width, sheetCanvas.height);
    return Promise.all(kehykset.map((dataUrl, i) => new Promise(res => {
      const img = new Image();
      img.onload = () => { ctx.drawImage(img, i * frameKoko, 0, frameKoko, frameKoko); res(); };
      img.src = dataUrl;
    }))).then(() => sheetCanvas.toDataURL('image/png'));
  },
  // "seuraava" kaappaus root-motion-klipeille (esim. Jump) - ks.
  // kaappaaYksiKehys():n pakotettuHalkaisija-kommentti. Kamera KESKITTÄÄ
  // JOKAISEN kehyksen erikseen hahmon nykyiseen (precise) poosiin, joten
  // hahmo ei koskaan ajaudu pois kehyksen keskeltä/uppoa maahan riippumatta
  // kuinka paljon se liikkuu maailmatilassa - mutta ZOOM pysyy VAKIONA
  // (pakotettuHalkaisija) jotta koko pysyy samana kuin muissa animaatioissa.
  // pakotettuHalkaisija: yleensä toisen (maassa pysyvän) laskeGlobaaliBbox-
  // kutsun tulos .getSize(...).length() - laske se erikseen ja anna tänne.
  kaappaaSeuraten(klippiNimi, maara, frameKoko, siluetti, vari, pakotettuHalkaisija, ylosAkseli, katseluAkseli) {
    asetaMateriaali(siluetti !== false, vari || '#2b3648');
    naytaGrid.visible = false;
    naytaScene.background = null;
    const klippi = klipit.find(c => c.name === klippiNimi);
    const action = mixer.clipAction(klippi);
    action.play(); action.paused = true;
    const kehykset = [];
    for (let i = 0; i < maara; i++) {
      const t = (klippi.duration * i) / Math.max(1, maara - (maara > 1 ? 1 : 0));
      mixer.setTime(0);
      action.time = Math.min(t, klippi.duration - 0.0001);
      mixer.update(0);
      const nykyinenLaatikko = new THREE.Box3().setFromObject(malli, true); // TÄMÄN kehyksen oma poosi, keskitykseen
      kehykset.push(kaappaaYksiKehys(frameKoko, 1, ylosAkseli, katseluAkseli, nykyinenLaatikko, pakotettuHalkaisija).toDataURL('image/png'));
    }
    action.stop();
    naytaGrid.visible = true;
    naytaScene.background = new THREE.Color(0x2b3648);

    sheetCanvas.width = frameKoko * kehykset.length;
    sheetCanvas.height = frameKoko;
    const ctx = sheetCanvas.getContext('2d');
    ctx.clearRect(0, 0, sheetCanvas.width, sheetCanvas.height);
    return Promise.all(kehykset.map((dataUrl, i) => new Promise(res => {
      const img = new Image();
      img.onload = () => { ctx.drawImage(img, i * frameKoko, 0, frameKoko, frameKoko); res(); };
      img.src = dataUrl;
    }))).then(() => sheetCanvas.toDataURL('image/png'));
  }
};

(function loop(){
  requestAnimationFrame(loop);
  const dt = clock.getDelta();
  controls.update();
  naytaRenderer.render(naytaScene, naytaCam);
})();
</script>
</body>
