    const x2 = leveys * v.x2, y2 = korkeus * v.y2;
    const w = leveys * v.leveys;
    const dx = x2 - x1, dy = y2 - y1;
    const pituus = Math.hypot(dx, dy) || 1;
    const nx = -dy / pituus, ny = dx / pituus; // kohtisuora yksikkövektori
    const hw = w / 2;
    const g = this.add.graphics().setScrollFactor(0).setDepth(-997);
    g.parallaksiKerroin = v.scrollFactor != null ? v.scrollFactor : 1;
    g.parallaksiViite = this.cameras.main.scrollX; // ks. piirraSiluetit():n kommentti
    g.fillStyle(v.vari, v.alpha != null ? v.alpha : 1);
    g.fillPoints([
      { x: x1 + nx * hw, y: y1 + ny * hw },
      { x: x1 - nx * hw, y: y1 - ny * hw },
      { x: x2 - nx * hw, y: y2 - ny * hw },
      { x: x2 + nx * hw, y: y2 + ny * hw },
    ], true);
    this.valokeilaGrafiikka = g;
  }

  // AMBIENSSIT - geneerinen pieni-liikkuvien-elementtien järjestelmä
  // (Jarno 1.9.2026: "small ones, like fireflies... could be other things
  // too, like stars in sky, sun, clouds etc." - EI siis pelkkä tulikärpäs-
  // efekti, vaan uudelleenkäytettävä pohja monelle eri "ambient"-tyypille).
  // Per-kohtaus VALINNAINEN `ambienssit`-taulukko esitys-2d-kohtaukset.js:ssä,
  // jokainen alkio kuvaa YHDEN ryhmän samanlaisia pisteitä:
  //   { tyyppi:'tahti'|'tulikarpanen', maara, vari, kokoAlue:[min,max],
  //     alueY:[0-1,0-1] (mihin osaan ruudun korkeudesta pisteet arvotaan),
  //     scrollFactor, syvyys, ajelehdintaSade (vain tulikarpanen) }
  // Kaksi tyyppiä toteutettu nyt (todistaa mekanismin): 'tahti' (vain
  // vilkkuu, ei liiku - kaukana taivaalla) ja 'tulikarpanen' (vilkkuu JA
  // ajelehtii hitaasti, ADD-blend = hehkuu, lähellä maata). 'aurinko'/
  // 'pilvi' voisi lisätä myöhemmin samaan tyyppi-haaraan (eri koko/käytös,
  // sama runko) - EI vielä tehty, ei pyydetty.
  //
  // Sijainti käyttää TARKALLEEN samaa käsin laskettua parallaksikorjausta
  // kuin piirraSiluetit()/piirraValokeila() (`parallaksiKerroin`+
  // `parallaksiViite`, päivitetään update():ssa) - EI natiivia
  // setScrollFactor():ia, koska se on jo todistetusti rikki suuremmilla
  // scrollFactor-arvoilla tässä moottorissa (ks. muistio, kamera on
  // absoluuttinen koko esityksen alusta asti). Ajelehdinta lasketaan
  // itse joka framessa (ei Phaser-tweeniä x/y:lle) juuri siksi ettei se
  // ole ristiriidassa saman parallaksikorjauksen kanssa - vilkkuminen
  // (pelkkä alpha) sen sijaan käy hyvin tweeninä koska alpha ei osallistu
  // sijaintilaskuun lainkaan.
  piirraAmbienssit(ambienssit, leveys, korkeus){
    (this.ambienssiOliot || []).forEach(o => o.destroy());
    this.ambienssiOliot = [];
    if (!ambienssit) return;
    ambienssit.forEach(a => {
      const scrollFactor = a.scrollFactor != null ? a.scrollFactor : 0.05;
      const vari = a.vari != null ? a.vari : 0xffffff;
      const kokoMin = a.kokoAlue ? a.kokoAlue[0] : 1;
      const kokoMax = a.kokoAlue ? a.kokoAlue[1] : 2;
      const yMin = korkeus * (a.alueY ? a.alueY[0] : 0);
      const yMax = korkeus * (a.alueY ? a.alueY[1] : 1);
      for (let i = 0; i < a.maara; i++){
        const perusX = leveys * Math.random();
        const perusY = yMin + Math.random() * (yMax - yMin);
        const koko = kokoMin + Math.random() * (kokoMax - kokoMin);
        const piste = this.add.circle(perusX, perusY, koko, vari);
        piste.setScrollFactor(0);
        piste.setDepth(a.syvyys != null ? a.syvyys : -900);
        if (a.tyyppi === 'tulikarpanen') piste.setBlendMode(Phaser.BlendModes.ADD);
        piste.parallaksiKerroin = scrollFactor;
        piste.parallaksiViite = this.cameras.main.scrollX;
        piste.perusX = perusX;
        piste.perusY = perusY;
        piste.ajelehdintaSade = a.tyyppi === 'tulikarpanen' ? (a.ajelehdintaSade != null ? a.ajelehdintaSade : 30) : 0;
        piste.ajelehdintaNopeus = 0.3 + Math.random() * 0.4;
        piste.vaihe = Math.random() * Math.PI * 2;
        const kesto = 1200 + Math.random() * 2000;
        this.tweens.add({ targets: piste, alpha: { from: 0.25 + Math.random() * 0.3, to: 1 }, duration: kesto, yoyo: true, repeat: -1, delay: Math.random() * kesto, ease: 'Sine.easeInOut' });
        this.ambienssiOliot.push(piste);
      }
    });
  }

  update(time, delta){
    const dt = Math.min(delta / 1000, 0.05);
    const cam = this.cameras.main;
    const kohdeScrollX = kohdeX - this.scale.width / 2;
    let kameraSiirtyma = (kohdeScrollX - cam.scrollX) * Math.min(1, dt * KAMERA_NOPEUS);
    const maxSiirtyma = KAMERA_MAX_NOPEUS * dt;
    if (kameraSiirtyma > maxSiirtyma) kameraSiirtyma = maxSiirtyma;
    else if (kameraSiirtyma < -maxSiirtyma) kameraSiirtyma = -maxSiirtyma;
    cam.scrollX += kameraSiirtyma;

    // kohtausvaihto: tarkistetaan hahmon OMAN sijainnin (ei kohdeX:n) mukaan,
    // jotta vaihto tapahtuu juuri silloin kun hahmo oikeasti kävelee rajan
    // yli - näyttää siltä että hahmo "kävelee uuteen maisemaan" sen sijaan
    // että tausta vaihtuisi heti napin painalluksesta asti (Jarnon pyyntö
    // 31.8.2026: "fox moves to new scenery").
    const hahmonOmaX = this.hahmo.x / SKAALA;
    if (hahmonOmaX < this.kohtaus.xAlue[0] || hahmonOmaX > this.kohtaus.xAlue[1]) {
      const uusi = this.valitseKohtaus(hahmonOmaX);
      if (uusi !== this.kohtaus) this.vaihdaKohtaus(uusi);
    }

    // vainKohtaus (VALINNAINEN, HAHMOKERROKSET-kenttä, ks. esitys-2d-
    // hahmot.js): rajoittaa maisemaan kelluvan kuvan näkyvyyden VAIN
    // yhteen tiettyyn KOHTAUKSET-kohtaukseen. Löydetty tarve linna-
    // trilogiasta (day/sunset/night, 1.9.2026): ilman tätä KAIKKI
    // kuvahahmot ovat AINA näkyvissä laskettuun maailmasijaintiinsa
    // perustuen (oikea käytös patsaalle/Lokille/Sokrateelle - ne halutaan
    // näkyä jo kaukaa lähestyessä) - mutta kolme eri-väristä linnaa vain
    // ~300-550 yksikön päässä toisistaan näkyivät KAIKKI yhtä aikaa,
    // väärän vuorokaudenajan linna päällekkäin oikean kanssa. Kenttä
    // puuttuessaan (kaikki vanhat hahmot) käytös EI muutu ollenkaan.
    if (this.kuvahahmot) {
      this.kuvahahmot.forEach(kh => {
        if (kh.h.vainKohtaus) kh.img.setVisible(kh.h.vainKohtaus === this.kohtaus.nimi);
      });
    }

    // omaLiike (VALINNAINEN, HAHMOKERROKSET-kenttä, 8.9.2026): maailmaan
    // ankkuroidun esineen OMA liike parallaksin PÄÄLLE, pikseliä sekunnissa
    // MAAILMAKOORDINAATISTOSSA (positiivinen = oikealle). Tarve: Finnairin
    // kone (x:184), Jarno testasi ja sanoi "Plaine could be flying" - pelkkä
    // parallaksi liikuttaa esinettä VAIN silloin kun kamera liikkuu, joten
    // pysähdyksellä seistessä kone seisoi paikallaan taivaalla.
    // TÄMÄ EI OLE PALUUTA ensimmäisen version CSS-animaatioon, joka
    // hylättiin ("plain did not look at all like flying plane"): siinä
    // elementti oli ruutuun naulattu ja liikkui maailmasta RIIPPUMATTA.
    // Tässä liike lisätään esineen MAAILMASIJAINTIIN, joten kameran
    // parallaksi (scrollFactor/lukitseKerrokseen) vaikuttaa siihen edelleen
    // täysin normaalisti - kone sekä lentää ETEENPÄIN että ajelehtii
    // maiseman mukana oikeassa syvyydessään. Liikutetaan vain näkyvissä
    // olevia; paluu alkusijaintiin hoidetaan paivitaVainPysahdysKuvat():ssa.
    if (this.kuvahahmot) {
      this.kuvahahmot.forEach(kh => {
        if (kh.h.omaLiike != null && kh.img.visible) kh.img.x += kh.h.omaLiike * dt;
      });
    }

    // vainKohtaus, video-tyypille (3.9.2026, Jarno: "make it to them too, but
    // do not add to current ones" - siis MEKANISMI valmiiksi videolle/
    // spritesheetille myös, EI mihinkään olemassa olevaan hahmoon vielä).
    // spritesheet-tyyppi ei tarvinnut omaa haaraa - se työntyy jo SAMAAN
    // this.kuvahahmot-taulukkoon kuin kuva-tyyppi (ks. luonti-kohta), joten
    // yllä oleva silmukka kattoi sen jo. video-tyypillä on kolme erillistä
    // Phaser-oliota (video + kaksi PNG-kaveria, ks. luonti-kohdan iso
    // kommentti) - kaikki kolme on pakotettava piiloon yhdessä kun kohtaus
    // ei täsmää, MUUTEN esim. ekaKuva jäisi näkyviin väärässä kohtauksessa.
    // Kun palataan takaisin sallittuun kohtaukseen (eikä video ole juuri
    // soimassa), palautetaan oletus-eka-kuva näkyviin - video käynnistyy
    // normaaliin tapaan paivitaVideot():n kautta kun oma pysähdys saavutetaan,
    // ei tässä. Kenttä puuttuessaan (kaikki nykyiset videohahmot) käytös EI
    // muutu ollenkaan - täsmälleen sama suoja kuin kuvahahmot-haarassa.
    if (this.videohahmot) {
      this.videohahmot.forEach(vh => {
        if (!vh.h.vainKohtaus) return;
        const naytaTama = vh.h.vainKohtaus === this.kohtaus.nimi;
        if (!naytaTama) {
          if (vh.aktiivinen) {
            vh.aktiivinen = false;
            if (vh.varmuusAjastin) { vh.varmuusAjastin.remove(false); vh.varmuusAjastin = null; }
            vh.video.stop();
          }
          vh.video.setVisible(false);
          vh.ekaKuva.setVisible(false);
          vh.viimeinenKuva.setVisible(false);
        } else if (!vh.aktiivinen && !vh.video.visible && !vh.ekaKuva.visible && !vh.viimeinenKuva.visible) {
          vh.ekaKuva.setVisible(true);
        }
      });
    }

    // aurinko/kuu KULKEE KOKO ESITYKSEN halki (Jarno 1.9.2026: "in
    // beginning left, midlle in middle and in end on right") - etenema
    // 0..1 lasketaan hahmon OMASTA x:stä (sama arvo joka jo laskettiin
    // yllä) suhteessa koko PYSAHDYKSET_2D-listan alku/loppu-x:ään, EI
    // nykyisen kohtauksen omaan xAlueeseen - näin sama taivaankappale
    // liikkuu tasaisesti vasemmalta oikealle riippumatta siitä kuinka
    // monta kohtausta/kohtauksenvaihtoa matkan varrella on. y seuraa
    // sinikaarta (matala alussa/lopussa, korkeimmillaan puolivälissä) -
    // sama "aurinko nousee ja laskee" -tuntuma kuin oikealla taivaalla.
    if (this.kuuGrafiikka) {
      const alkuX = PYSAHDYKSET_2D[0].x, loppuX = PYSAHDYKSET_2D[PYSAHDYKSET_2D.length - 1].x;
      const etenema = Phaser.Math.Clamp((hahmonOmaX - alkuX) / Math.max(1, loppuX - alkuX), 0, 1);
      this.kuuGrafiikka.x = this.scale.width * (0.06 + etenema * 0.88);
      this.kuuGrafiikka.y = this.scale.height * (0.42 - Math.sin(etenema * Math.PI) * 0.28);
    }

    // taustakerrokset seuraavat kameraa parallaksinopeudella PLUS oma
    // jatkuva ajelehdinta (ajelehdintaNopeus, ks. rakennaTausta()) - autot/
    // pilvet ym. liikkuvat siis VAIKKA kamera seisoisi paikallaan
    // pysähdyksellä, Jarnon pyyntö 1.9.2026.
    this.taustakerrokset.forEach(t => {
      if (t.ajelehdintaNopeus) t.omaSiirtyma += t.ajelehdintaNopeus * dt;
      t.obj.tilePositionX = cam.scrollX * t.scrollFactor + t.omaSiirtyma;
      // sykeNopeus: siniaalto-alpha, ks. rakennaTausta():n kommentti ja
      // vaihdaKohtaus():n huomio miksi näitä EI häivytetä tweenillä.
      if (t.sykeNopeus) {
        const s = Math.sin(time / 1000 * t.sykeNopeus * Math.PI * 2 + t.satunnaisVaihe);
        t.obj.alpha = Phaser.Math.Clamp(t.perusAlpha + s * t.sykeAmplitudi, 0, 1);
      }
    });
    // poistuvatKerrokset (ristikkohäivytyksestä poistumassa, ks. vaihdaKohtaus())
    // pidetään myös vielä liikkeessä niin kauan kuin ne näkyvät haalistuvina -
    // muuten ne jäisivät "jäätyneeksi haamukuvaksi" häivytyksen ajaksi.
    (this.poistuvatKerrokset || []).forEach(kerrokset => {
      kerrokset.forEach(t => {
        if (t.ajelehdintaNopeus) t.omaSiirtyma += t.ajelehdintaNopeus * dt;
        t.obj.tilePositionX = cam.scrollX * t.scrollFactor + t.omaSiirtyma;
      });
    });

    // siluetit ja valokeila ovat myös setScrollFactor(0) (kamerakiinnitetty)
    // + käsin päivitettävä x - sama periaate kuin taustakerroksilla mutta
    // koko OLIOTA siirretään (ei vain tekstuurin näyteikkunaa), koska
    // nämä ovat kertakertaisia muotoja, ei toistuvia tekstuureja. Siirtymä
    // lasketaan SUHTEESSA piirtohetken scrollX:ään (`parallaksiViite`),
    // EI absoluuttisesta scrollX=0:sta - muuten muoto yrittäisi korjata
    // pois koko siihenastisen kameramatkan (voi olla tuhansia pikseleitä
    // pitkälle kohtaukselle) ja piirtyisi kauas näkymän ulkopuolelle.
    // Miinusmerkki koska kasvava scrollX (kamera oikealle) pitää siirtää
    // muodon VASEMMALLE ruudulla, sama efekti kuin oikean maailman
    // parallaksissa (ks. piirraSiluetit():n kommentti).
    (this.siluettiGrafiikat || []).forEach(g => { g.x = -(cam.scrollX - g.parallaksiViite) * g.parallaksiKerroin; });
    if (this.valokeilaGrafiikka) this.valokeilaGrafiikka.x = -(cam.scrollX - this.valokeilaGrafiikka.parallaksiViite) * this.valokeilaGrafiikka.parallaksiKerroin;

    // ambienssit (tähdet/tulikärpäset/...): sama parallaksikorjaus kuin
    // yllä, PLUS tulikärpäsille hidas ajelehdinta sini-/kosinikäyrällä
    // perusX/Y:n ympärillä - laskettu itse (ei tweeni) ettei riitele
    // parallaksikorjauksen kanssa, ks. piirraAmbienssit():n kommentti.
    (this.ambienssiOliot || []).forEach(o => {
      const parallaksiSiirtyma = -(cam.scrollX - o.parallaksiViite) * o.parallaksiKerroin;
      o.x = o.perusX + parallaksiSiirtyma + (o.ajelehdintaSade ? Math.sin(time / 1000 * o.ajelehdintaNopeus + o.vaihe) * o.ajelehdintaSade : 0);
      if (o.ajelehdintaSade) o.y = o.perusY + Math.cos(time / 1000 * o.ajelehdintaNopeus * 0.7 + o.vaihe) * o.ajelehdintaSade * 0.5;
    });

    // YLITYSHAHMOT (ks. esitys-2d-hahmot.js): RUUTU-tilassa (setScrollFactor(0)
    // luotu create():ssa) liikkuvat kiinteällä RUUTUNOPEUDELLA reunasta
    // reunaan `kesto`-sekunnissa, riippumatta kamerasta/parallaksista -
    // siksi laskenta täällä on paljon yksinkertaisempi kuin yllä olevilla
    // (ei parallaksiViite/-Kerroin -korjausta lainkaan). Koko lasketaan
    // uudelleen joka framessa (ei erillistä resize-koukkua) - halpaa koska
    // aktiivisia on käytännössä 0-1 kerrallaan.
    (this.ylitykset || []).forEach(yl => {
      if (!yl.aktiivinen) return;
      const { width, height } = this.scale;
      const kesto = yl.h.kesto || 6;
      const t = Math.min(1, (this.time.now - yl.alkuaika) / 1000 / kesto);
      const kProsentti = yl.h.korkeusProsentti != null ? yl.h.korkeusProsentti : 0.3;
      yl.img.setScale((Math.min(width, height) * kProsentti) / yl.img.height);
      const suunta = yl.h.suunta != null ? yl.h.suunta : 1;
      const puoliLeveys = yl.img.displayWidth / 2;
      const alkuX = suunta > 0 ? -puoliLeveys : width + puoliLeveys;
      const loppuX = suunta > 0 ? width + puoliLeveys : -puoliLeveys;
      yl.img.x = alkuX + (loppuX - alkuX) * t;
      yl.img.y = height * (yl.h.yProsentti != null ? yl.h.yProsentti : 0.85);
      // kasvotSuuntaan: mihin suuntaan hahmon kuva on PIIRRETTY katsomaan
      // luonnostaan (peilaamatta) - EI sama kaikilla assteilla (ketun/
      // terminatorin GLB-kaappaukset olivat nenä-vasemmalle, mutta Jarnon
      // toimittama Mech-spritesheet on kasvot-oikealle - Jarno: "face is
      // backwards" kun tätä ei vielä ollut, kiinteä oletus oli väärä juuri
      // Mechille). Peilataan JOS kävelysuunta EI täsmää luonnolliseen
      // suuntaan. Oletus -1 (nenä vasemmalle) jos kenttää ei anneta -
      // säilyttää vanhan käytöksen terminator-kaltaisille assteille.
      const kasvotSuuntaan = yl.h.kasvotSuuntaan != null ? yl.h.kasvotSuuntaan : -1;
      yl.img.setFlipX(suunta !== kasvotSuuntaan);
      // osuma (VALINNAINEN, 4.9.2026, Jarno x:8940 "rocket... comes to
      // shoot the bubble") - { hetki: 0-1, kipina: {...}, piilotaKupla: true }.
      // `hetki` on KOHTA LENNOSTA (0=juuri lähtenyt, 1=juuri saapumassa
      // toiseen reunaan) jolloin efekti laukeaa - EI kiinteä millisekunti-
      // viive, koska ylitys itsessään voi olla eri pituinen eri ruutu-
      // koolla/kesto-arvolla, `t` (0-1) on jo laskettu tähän mennessä juuri
      // tätä varten. osumaAmmuttu estää toistuvan laukaisun SAMAN kierroksen
      // aikana (nollataan uudelleen joka kierroksen alussa, ks. aloita()
      // paivitaYlitykset():ssä) - ilman tätä efekti laukeaisi JOKA FRAME
      // kun t on jo hetkeä suurempi.
      if (yl.h.osuma && !yl.osumaAmmuttu && t >= yl.h.osuma.hetki) {
        yl.osumaAmmuttu = true;
        if (yl.h.osuma.kipina) this.piirraKipina(yl.h.osuma.kipina);
        if (yl.h.osuma.piilotaKupla) piilotaKuplaPoksahtaen();
      }
      // virtaa (VALINNAINEN, 3.9.2026, Jarno "several endless stream of she
      // ... unstil clicked to next") - kun true, ylitys EI pysähdy/piiloudu
      // reunaan päästyään kuten Mechin kertaylitys, vaan aloittaa HETI
      // uudelleen alusta (nollaa vain alkuaika, aktiivinen/näkyvissä pysyy
      // koko ajan totena) - loputon virta niin kauan kuin tämä pysähdys on
      // aktiivinen. paivitaYlitykset() hoitaa AINA lopullisen piilotuksen
      // kun pysähdyksestä oikeasti poistutaan (koskematon, riippumaton tästä).
      if (t >= 1) {
        if (yl.h.virtaa) yl.alkuaika = this.time.now;
        else { yl.aktiivinen = false; yl.img.setVisible(false); }
      }
    });

    // hahmo: kävelee kohti kohdeX:ää, kääntyy suunnan mukaan, vaihtaa
    // tilaan kun on perillä (sama periaate kuin esitys-3d.html:ssä).
    // Animaatioavaimet ovat '<hahmoAvain>:<klippi>' (ks. create():n
    // anims.create()-kutsut ja HAHMOVAIHTOEHDOT-taulukon animaatioKartta) -
    // jos p.hahmoAnimaatio ei löydy nykyisen hahmon kartasta (esim. 'Bark'
    // T-Rexille, jolla ei ole haukku-klippiä), palataan aina 'idle':en.
    const walkAvain = this.hahmoAvain + ':walk';
    const ero = kohdeX - this.hahmo.x;
    const kavelynopeus = 220; // px/s
    if (Math.abs(ero) > 4){
      const suunta = Math.sign(ero);
      this.hahmo.x += suunta * kavelynopeus * dt;
      this.hahmo.flipX = suunta > 0; // sprite kuvattu nenä vasemmalle, siis peilataan kun mennään oikealle
      if (this.hahmo.anims.currentAnim?.key !== walkAvain) this.hahmo.play(walkAvain);
    } else {
      this.hahmo.x = kohdeX;
      const p = PYSAHDYKSET_2D[indeksi];
      const tiedot = this.hahmoTiedot(this.hahmoAvain);
      const klippi = tiedot.animaatioKartta[p.hahmoAnimaatio] || 'idle';
      const animaatio = this.hahmoAvain + ':' + klippi;
      if (this.hahmo.anims.currentAnim?.key !== animaatio) this.hahmo.play(animaatio);
    }
  }
}

new Phaser.Game({

  ...(ESIKATSELU ? { preserveDrawingBuffer: true } : {}),

<script>
// ============================================================================
// OPPAAN VALINTA - "game like start" (Jarno 1.9.2026: "Let's choose your
// guide to walk in AI black box - choose character, list is there 1-4 -
// some game music when chosen the character and beginning"). Täysin
// ERILLINEN Phaser-pelistä (tavallinen DOM-overlay #opasvalinta-elementin
// päällä, ks. <style> ja HTML-body) - EI riipu Phaserin sisäisestä
// alustuksesta millään tavalla: hahmo vaihdetaan JÄLKIKÄTEEN olemassa
// olevalla vaihdaHahmo()-mekanismilla (sama jota 1-4-näppäimet jo
// käyttävät) sen jälkeen kun Phaser on ehtinyt käynnistyä - ei siis
// tarvitse viivyttää/järjestää pelin omaa create()-ajoitusta uudelleen.
//
// "Peli-musiikki": EI ladattu ulkoista äänitiedostoa (ei mitään sopivaa
// löytynyt projektin äänikansioista, ja lisenssien tarkistus/uuden
// tiedoston hakeminen olisi vienyt aikaa + riskeeraisi offline-toimivuuden,
// ks. 1.9.2026 offline-auditointi) - sen sijaan LYHYT SYNTETISOITU
// nouseva arpeggio Web Audio APIlla suoraan koodista. Tämä on TÄYSIN
// offline-varma (ei tiedostoa, ei verkkoa, ei lisenssikysymystä) ja
// kuulostaa aidosti "peli valitsi hahmon" -äänimerkiltä.
(function () {
  const overlay = document.getElementById('opasvalinta');
  const kortitEl = document.getElementById('opasvalinta-kortit');
  const AVAIN = 'esitys-2d-opas-valittu';

  // ESIKATSELU (ks. ESIKATSELU-vakion iso kommentti tiedoston alussa) -
  // pikkukuva-iframe ei koskaan saa jäädä odottamaan klikkausta valinta-
  // ruudulta - poistetaan se HETI ja hypätään suoraan oletushahmoon,
  // EI sessionStoragen kautta (jaettu vanhemman kanssa, ks. INDEKSI_AVAIN-
  // kommentti - useampi rinnakkainen iframe kirjoittaisi/lukisi ristiin).
  if (ESIKATSELU) {
    overlay.remove();
    odotaSceneaJaVaihda('kettu', 0);
    return;
  }

  // jo valittu TÄLLÄ välilehdellä (esim. reload kesken testauksen) - ei
  // näytetä valintaruutua uudelleen, sama periaate kuin INDEKSI_AVAIN:lla.
  let jo = null;
  try { jo = sessionStorage.getItem(AVAIN); } catch (e) {}
  if (jo) {
    overlay.remove();
    // KORJAUS: pelkkä ruudun piilottaminen ei riittänyt - tallennettu
    // valinta EI ollut koskaan sovellettu takaisin, joten sama välilehti
    // palasi aina oletushahmoon (kettu) uudelleenlatauksella vaikka
    // valintaruutu oikein pysyi piilossa. odotaSceneaJaVaihda on
    // funktiodeklaraatio (hoistattu), joten sitä voi kutsua jo tässä
    // vaikka sen teksti on tiedostossa alempana.
    odotaSceneaJaVaihda(jo, 0);
  }

  function soitaValintaAani() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const nyt = ctx.currentTime;
      // C5-E5-G5-C6-nouseva arpeggio, kukin sävel lyhyt "chiptune"-tyylinen
      // neliöaalto pehmeällä decaylla - kuulostaa peli-"valinta vahvistettu"
      // -merkiltä ilman mitään ulkoista äänitiedostoa.
      [523.25, 659.25, 783.99, 1046.50].forEach((hz, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.value = hz;
        const alku = nyt + i * 0.09;
        gain.gain.setValueAtTime(0, alku);
        gain.gain.linearRampToValueAtTime(0.12, alku + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, alku + 0.35);
        osc.connect(gain).connect(ctx.destination);
        osc.start(alku);
        osc.stop(alku + 0.4);
      });
    } catch (e) { /* Web Audio ei käytettävissä - ei haittaa, valinta toimii silti */ }
  }

  function odotaSceneaJaVaihda(avain, yritys) {
    yritys = yritys || 0;
    if (window.__scene && window.__scene.vaihdaHahmo) {
      if (avain !== 'kettu') window.__scene.vaihdaHahmo(avain); // kettu on jo oletus, ei tarvitse vaihtaa
    } else if (yritys < 100) {
      setTimeout(() => odotaSceneaJaVaihda(avain, yritys + 1), 50);
    }
  }

  function valitse(avain) {
    try { sessionStorage.setItem(AVAIN, avain); } catch (e) {}
    soitaValintaAani();
    odotaSceneaJaVaihda(avain, 0);
    overlay.classList.add('piilossa');
    setTimeout(() => overlay.remove(), 700); // pois DOM:sta häivytyksen jälkeen, ei jää turhaan pointer-events-esteeksi
    // esityksen kello nollataan TÄSSÄ, ei sivun latautumishetkeen (ks.
    // alkuaika:n kommentti ylempänä) - lähetetään heti myös esittäjä-
    // näkymälle (samaan tapaan kuin siirry() tekee joka pysähdyksellä),
    // vaikka itse pysähdysindeksi ei vielä muutu tässä kohtaa.
    alkuaika = Date.now();
    if (typeof esitysKanava !== 'undefined' && esitysKanava) {
      esitysKanava.postMessage({ tyyppi: 'siirry', indeksi: (typeof globaaliIndeksi === 'function' ? globaaliIndeksi() : 0), alkuaika });
    }
  }

  if (!jo && typeof HAHMOVAIHTOEHDOT !== 'undefined') {
    HAHMOVAIHTOEHDOT.forEach(h => {
      const nappi = document.createElement('button');
      nappi.className = 'opas-kortti';
      nappi.setAttribute('aria-label', 'Valitse ' + h.nimi);
      const kuva = document.createElement('div');
      kuva.className = 'opas-kortti-kuva';
      kuva.style.backgroundImage = `url('${h.spritet.idle}')`;
      const nimi = document.createElement('div');
      nimi.className = 'opas-kortti-nimi';
      nimi.textContent = h.nimi;
      nappi.appendChild(kuva);
      nappi.appendChild(nimi);
      nappi.addEventListener('click', () => valitse(h.avain));
      kortitEl.appendChild(nappi);
    });
  }
})();
</script>
