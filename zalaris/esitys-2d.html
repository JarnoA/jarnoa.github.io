    this.saapujat = []; // ks. h.saapuu-haaran kommentti alempana + paivitaSaapujat()
    HAHMOKERROKSET.forEach(h => {
      if (h.kiintea && h.video) {
        // KIINTEA VIDEO (3.9.2026, Jarno Gemini-videosta: "this shoudl be
        // one time, not paraller" - siis SAMA "näkyy vain yhdellä
        // pysähdyksellä, ruutuun sidottu" -mekanismi kuin kiintea:true-
        // kuvilla, EI maisemaan sulautuva parallaksi-video kuten patsas).
        // EI tarvita ekaFrame/viimeinenFrame-PNG-kavereita kuten maisema-
        // videolla: siellä niitä tarvittiin koska hahmo näkyy JO KAUKAA
        // matkan varrella parallaksissa (video täytyy näyttää jotain ennen
        // soittoa) - kiintea video sen sijaan on AINA joko piilossa
        // (setVisible(false)) tai soimassa, ei koskaan "näkyvissä mutta ei
        // vielä soi" -väliaikaa, joten Phaserin "pysäytetty video ei
        // piirry" -ongelma ei koske tätä lainkaan.
        const sijainti = this.laskeKiinteaSijainti(h, width, height);
        const video = this.add.video(sijainti.x, sijainti.y, 'hahmo-video:' + h.video);
        video.setOrigin(sijainti.originX, sijainti.originY);
        video.setScrollFactor(0);
        video.setLoop(!!h.loop);
        video.setVisible(false);
        if (h.syvyysSuhde != null) {
          const omaKohtaus = this.valitseKohtaus(h.x);
          video.setDepth(h.syvyysSuhde * omaKohtaus.kerrokset.length);
        } else {
          video.setDepth(200); // sama oletus kuin kiintea-kuvalla - koko maailman yläpuolella
        }
        const kv = { h, video, aktiivinen: false, varmuusAjastin: null };
        this.kiinteatVideot.push(kv);
        this.sovitaKiinteaVideoKokoon(kv, width, height);
        video.on('created', () => this.sovitaKiinteaVideoKokoon(kv, this.scale.width, this.scale.height));
      } else if (h.kiintea) {
        const sijainti = this.laskeKiinteaSijainti(h, width, height);
        // spritesheet (VALINNAINEN, 4.9.2026, "Mickey"-taikominen x:4141) -
        // AIEMMIN kiintea:true tuki VAIN yksittäistä kuvaa (this.add.image),
        // ei animoitua spritesheetiä - sama laajennus-periaate kuin video/
        // ankkuri-kentillä aiemmin tässä tiedostossa. animaatioAvain
        // tallennetaan this.kiinteatKuvat-alkioon, ks. paivitaKiinteatKuvat().
        let img, animaatioAvain = null;
        if (h.spritesheet) {
          img = this.add.sprite(sijainti.x, sijainti.y, 'hahmo-sheet:' + h.spritesheet);
          animaatioAvain = 'hahmo-sheet:' + h.spritesheet + ':silmukka';
          if (!this.anims.exists(animaatioAvain)) {
            this.anims.create({
              key: animaatioAvain,
              frames: this.anims.generateFrameNumbers('hahmo-sheet:' + h.spritesheet, { start: 0, end: (h.kehyksia || 1) - 1 }),
              frameRate: h.fps || 10,
              repeat: -1
            });
          }
        } else {
          img = this.add.image(sijainti.x, sijainti.y, 'hahmo:' + h.kuva);
          if (h.pehmea) img.texture.setFilter(Phaser.Textures.FilterMode.LINEAR); // ks. `pehmea`-kentän kommentti kuva-haarassa
        }
        img.setOrigin(sijainti.originX, sijainti.originY);
        img.setScrollFactor(0); // ruutuun sidottu, ei liiku kameran/ketun mukana lainkaan
        // syvyysSuhde (VALINNAINEN, 2.9.2026, Jarno: "how i position it behind
        // of scene elements, like ground?") - kiintea-kuva oli AINA depth:200
        // (koko maailman yläpuolella, kuten teksti) - nyt VOI halutessaan
        // upottaa taustan kerrosten SEKAAN samalla suhdeluku-mekanismilla
        // kuin maisemaosa-kuvilla (ks. alempi haara), esim. 0.85 = juuri
        // etummaisimman taustakerroksen (usein "maa/nurmi") TAKANA - jättää
        // kentän pois = ennallaan, AINA päällimmäisenä (vanha käytös).
        if (h.syvyysSuhde != null) {
          const omaKohtaus = this.valitseKohtaus(h.x);
          img.setDepth(h.syvyysSuhde * omaKohtaus.kerrokset.length);
        } else {
          img.setDepth(200); // aina koko maailman (taustat, hahmot, kettu=100) yläpuolella
        }
        const kProsentti = h.korkeusProsentti != null ? h.korkeusProsentti : 0.18;
        img.setScale((Math.min(width, height) * kProsentti) / img.height);
        img.setAlpha(0); // piilossa oletuksena - paivitaKiinteatKuvat() näyttää sen omalla pysähdyksellään
        this.kiinteatKuvat.push({ h, img, animaatioAvain, aktiivinen: false });
      } else if (h.saapuu) {
        // saapuu (UUSI 4.9.2026, x:13890 loppukiitos, Jarno: "could first
        // walk to next to fox, then wave and continue waving", kuvat
        // assets/2d/sprites/jarno/) - RUUTUUN sidottu kuten kiintea, mutta
        // KAKSIVAIHEINEN: 1) kävelee reunalta kohdesijaintiin (TWEEN, sama
        // idea kuin kiintea-kuvan liukuSuunta), 2) saapuessaan VAIHTAA
        // spritesheetin heiluttamis-silmukkaan ja jää paikalleen loputtomiin
        // (ks. paivitaSaapujat()). Kaksi ERI spritesheetiä (kävely =
        // sivuprofiili vasemmalle, heilutus = edestä kuvattu) - siksi OMA
        // haara, ei kiintea-branchin yhden-spritesheetin uudelleenkäyttöä.
        const sa = h.saapuu;
        const kavelyAvain = 'saapuu-kavely:' + sa.kavely + ':silmukka';
        if (!this.anims.exists(kavelyAvain)) {
          this.anims.create({
            key: kavelyAvain,
            frames: this.anims.generateFrameNumbers('saapuu-kavely:' + sa.kavely, { start: 0, end: (sa.kavelyKehyksia || 1) - 1 }),
            frameRate: sa.fps || 8,
            repeat: -1
          });
        }
        const heilutusAvain = 'saapuu-heilutus:' + sa.heilutus + ':silmukka';
        if (!this.anims.exists(heilutusAvain)) {
          this.anims.create({
            key: heilutusAvain,
            frames: this.anims.generateFrameNumbers('saapuu-heilutus:' + sa.heilutus, { start: 0, end: (sa.heilutusKehyksia || 1) - 1 }),
            frameRate: sa.fps || 8,
            repeat: -1
          });
        }
        const img = this.add.sprite(0, 0, 'saapuu-kavely:' + sa.kavely);
        img.setOrigin(0.5, 1); // jalat pisteessä, sama periaate kuin ketulla (HAHMON_Y_SUHDE)
        img.setScrollFactor(0); // ruutuun sidottu, ei liiku kameran/maailman mukana
        img.setDepth(sa.syvyys != null ? sa.syvyys : 101); // hieman ketun (100) YLÄPUOLELLA
        img.setAlpha(0); // piilossa oletuksena, paivitaSaapujat() näyttää omalla pysähdyksellään
        this.saapujat.push({ h, img, vaihe: 'pois', aktiivinen: false, kavelyAvain, heilutusAvain, tweeni: null });
      } else {
        // syvyysSuhde on suhteessa SEN kohtauksen (jonka xAlue sisältää tämän
        // hahmon x:n) omaan kerrosmäärään - sama suhdeluku toimii oikein
        // riippumatta siitä onko kyseisessä taustassa 4 vai 12 kerrosta
        // (ks. muistio §38 jatko 6, todistettu test-video-alpha.html:ssä).
        // Oletus 1.0 = juuri kerrosten YLÄPUOLELLA eli kaiken edessä - vastaa
        // vanhaa käytöstä ennen tätä kenttää.
        const omaKohtaus = this.valitseKohtaus(h.x);
        const syvyys = (h.syvyysSuhde != null ? h.syvyysSuhde : 1.0) * omaKohtaus.kerrokset.length;
        // lukitseKerrokseen (ks. laskeLukittuScrollFactor():n iso kommentti) -
        // OHITTAA h.scrollFactor:in kokonaan kun annettu.
        const lukittuScrollFactor = h.lukitseKerrokseen ? this.laskeLukittuScrollFactor(omaKohtaus, h.lukitseKerrokseen, height) : null;
        const scrollFactor = lukittuScrollFactor != null ? lukittuScrollFactor : (h.scrollFactor != null ? h.scrollFactor : 1);
        // siirtymaX (VALINNAINEN, story-x-yksikköä, oletus 0): PELKKÄ
        // visuaalinen sivuttaissiirto - lisätään VAIN tähän sijainti-
        // laskuun, EI mihinkään laukaisu-/täsmäysehtoon (paivitaVideot(),
        // paivitaKiinteatKuvat(), paivitaAanet() - ne kaikki vertaavat
        // AINA suoraan h.x:ää, koskematon). LÖYDETTY BUGI 2.9.2026: Jarno
        // pyysi siirtää patsaan pois puunrungon takaa "nudge x:llä" -
        // neuvoni, muutin silloin suoraan h.x:n (1290->1235) - näytti
        // toimivan visuaalisesti MUTTA hiljaa RIKKOI videon käynnistys-
        // täsmäytyksen (uusiPysahdys.x===vh.h.x ei enää täsmännyt, video ei
        // käynnistynyt ollenkaan). h.x on MYÖS laukaisuavain kolmelle
        // muulle mekanismille (video/kiintea-kuva/aaniraita) - EI turvallinen
        // muokattava pelkkää visuaalista siirtoa varten. `siirtymaX` pitää
        // h.x:n koskemattomana (laukaisu toimii aina) ja tarjoaa OMAN,
        // tarkoitukseen rakennetun kentän visuaaliselle nykäisylle.
        const worldX = this.laskeParallaksiX(h.x + (h.siirtymaX || 0), scrollFactor, width);

        if (h.video) {
        const y = height * (h.yProsentti != null ? h.yProsentti : 0.82);

        // Video-elementti: EI KOSKAAN pyydetä näyttämään mitään paitsi kun se
        // oikeasti soi (ks. esitys-2d-hahmot.js:n "MIKSI KAKSI PNG:tä VIDEON
        // LISÄKSI" -kommentti) - piilossa oletuksena, ei minkäänlaista
        // play()+pause()-"pakota frame näkyviin" -temppua enää.
        // ankkuri (VALINNAINEN, 4.9.2026, "jarnocat" x:690 - lähdevideon
        // 1920x1080-kehys on suurelta osin tyhjää tilaa hahmon YMPÄRILLÄ,
        // oletus {0.5,1} olisi keskittänyt koko TYHJÄN kehyksen, ei itse
        // sisältöä) - sama kenttä ja oletus kuin kuva-tyypillä alempana,
        // AIEMMIN kiinteä setOrigin(0.5,1) kaikille video/ekaKuva/
        // viimeinenKuva:lle, koskematon jos kenttää ei anneta (esim. patsas).
        const ankkuriX = h.ankkuri ? h.ankkuri.x : 0.5, ankkuriY = h.ankkuri ? h.ankkuri.y : 1;
        const video = this.add.video(worldX, y, 'hahmo-video:' + h.video);
        video.setOrigin(ankkuriX, ankkuriY);
        video.setDepth(syvyys);
        video.setScrollFactor(scrollFactor);
        video.setLoop(!!h.loop);
        video.setVisible(false);

        // Kaksi PNG-kaveria SAMASSA kohdassa/koossa/syvyydessä - nämä
        // hoitavat KAIKEN näkyvyyden kun video ei soi. Tavallinen kuva,
        // piirtyy 100%-luotettavasti heti, ei mitään videospesifistä.
        const ekaKuva = this.add.image(worldX, y, 'hahmo-eka:' + h.video);
        ekaKuva.setOrigin(ankkuriX, ankkuriY);
        ekaKuva.setDepth(syvyys);
        ekaKuva.setScrollFactor(scrollFactor);

        const viimeinenKuva = h.viimeinenFrame
          ? this.add.image(worldX, y, 'hahmo-viimeinen:' + h.video)
          : this.add.image(worldX, y, 'hahmo-eka:' + h.video); // ei erillistä viimeistä framea -> käytä ekaa myös tähän
        viimeinenKuva.setOrigin(ankkuriX, ankkuriY);
        viimeinenKuva.setDepth(syvyys);
        viimeinenKuva.setScrollFactor(scrollFactor);
        viimeinenKuva.setVisible(false);

        const vh = { h, video, ekaKuva, viimeinenKuva, aktiivinen: false, varmuusAjastin: null };
        this.videohahmot.push(vh);
        this.sovitaVideoKokoon(vh, width, height);
        video.on('created', () => this.sovitaVideoKokoon(vh, this.scale.width, this.scale.height));
        } else if (h.spritesheet) {
          // animoitu maailmassa-kelluva kerros (savu, mainostaulu, ...) -
          // sama sijainti/parallaksi-logiikka kuin kuva-haaralla alla,
          // mutta Sprite + jatkuvasti silmukoiva anims.play() (EI kävely-
          // käynnistys/pysäytys kuten YLITYSHAHMOT:issa - tämä vain pyörii
          // koko ajan, näkyy/piiloutuu luonnostaan kameran mukana kuten
          // mikä tahansa muu maisemahahmo).
          const y = height * (h.yProsentti != null ? h.yProsentti : 0.82);
          const img = this.add.sprite(worldX, y, 'hahmo-sheet:' + h.spritesheet);
          img.setOrigin(h.ankkuri ? h.ankkuri.x : 0.5, h.ankkuri ? h.ankkuri.y : 1);
          // korkeusProsentti (3.9.2026, ennakoiva korjaus Nera-armeijaa
          // varten - ks. kuva-haaran samanniminen kommentti/bugi alempana):
          // ilman tätä spritesheet-tyyppi olisi ainoa maisemaosa-tyyppi jolla
          // EI ole resoluutioriippumatonta kokoa - sama "mittakaava on aina
          // sama pikselimäärä riippumatta ruudun koosta" -bugi kuin kuvilla
          // aiemmin, ei toistettu tähän uuteen käyttöön.
          if (h.korkeusProsentti != null) {
            img.setScale((Math.min(width, height) * h.korkeusProsentti) / img.height);
          } else {
            img.setScale(h.mittakaava || 1);
          }
          img.setScrollFactor(scrollFactor);
          img.setDepth(syvyys);
          const animaatioAvain = 'hahmo-sheet:' + h.spritesheet + ':silmukka';
          if (!this.anims.exists(animaatioAvain)) {
            this.anims.create({
              key: animaatioAvain,
              frames: this.anims.generateFrameNumbers('hahmo-sheet:' + h.spritesheet, { start: 0, end: (h.kehyksia || 1) - 1 }),
              frameRate: h.fps || 12,
              repeat: -1
            });
          }
          img.play(animaatioAvain);
          // aloitusEtenema (0-1): VALINNAINEN - hyppää animaation TIETTYYN
          // kohtaan heti alussa. Ilman tätä KAIKKI saman spritesheetin
          // instanssit (esim. useampi savu-hahmo vierekkäin) animoisivat
          // TÄSMÄLLEEN samassa tahdissa, mikä näyttää keinotekoiselta -
          // Jarnon pyyntö 1.9.2026 "genuine animated sprite sheets" +
          // savun ohuus vaati useamman limittäisen instanssin.
          if (h.aloitusEtenema != null) img.anims.setProgress(h.aloitusEtenema);
          this.kuvahahmot.push({ h, img });
        } else if (h.kuva) {
          const y = height * (h.yProsentti != null ? h.yProsentti : 0.82);
          const img = this.add.image(worldX, y, 'hahmo:' + h.kuva);
          if (h.pehmea) img.texture.setFilter(Phaser.Textures.FilterMode.LINEAR); // ks. kiintea-haaran kommentti - PUUTTUI tästä haarasta 2.9.2026 asti
          img.setOrigin(h.ankkuri ? h.ankkuri.x : 0.5, h.ankkuri ? h.ankkuri.y : 1);
          // korkeusProsentti (VALINNAINEN, 2.9.2026, "castle is small and
          // floating" - RUUTUUN suhteutettu koko, SAMA periaate kuin
          // kiintea/video-tyypeillä) - KÄYTETÄÄN jos annettu, muuten vanha
          // mittakaava (kiinteä kerroin). LÖYDETTY BUGI: mittakaava on
          // AINA sama pikselimäärä riippumatta ruudun koosta (Phaser.Scale.
          // RESIZE tekee canvas-pikselistä ≈ CSS-pikselin) - kapeassa
          // testi-ikkunassa (esim. 800px) sama luku näyttää ISOLTA suhteessa
          // ruutuun, mutta oikealla esitysnäytöllä (esim. 1920px) SAMA
          // pikselikoko on paljon PIENEMPI OSUUS ruudusta - mitattu
          // suoraan: 28% ruudun korkeudesta 1920x1080:lla vs. ~36% 800px
          // -testi-ikkunassa, SAMALLA mittakaava-arvolla. korkeusProsentti
          // pitää koon VAKIONA suhteessa ruutuun millä tahansa näytöllä,
          // sama korjaus kuin kiintea-kuvilla oli jo aiemmin.
          if (h.korkeusProsentti != null) {
            img.setScale((Math.min(width, height) * h.korkeusProsentti) / img.height);
          } else {
            img.setScale(h.mittakaava || 1);
          }
          img.setScrollFactor(scrollFactor);
          img.setDepth(syvyys);
          // h.alpha (VALINNAINEN, 2.9.2026, linna-eder-3:n vedenpeilikuva) -
          // PUUTTUI tästäkin haarasta, sama tapaus kuin pehmea yllä.
          if (h.alpha != null) img.setAlpha(h.alpha);
          this.kuvahahmot.push({ h, img });
        }
        // h ilman kuva/videota (pelkkä aaniraita, ei visuaalista) - ei tehdä
        // mitään täällä, käsitellään alla.
      }

      // aaniraita: RIIPPUMATON kuva/video/kiintea-valinnasta yllä - voi olla
      // minkä tahansa hahmotyypin kanssa TAI kokonaan ilman visuaalista osaa
      // (esim. Ada Lovelace -sitaatti, ks. esitys-2d-hahmot.js). Sama x-
      // täsmäys-periaate kuin muillakin, ks. paivitaAanet(). HTML5 <audio>
      // (EI enää Phaserin this.sound.add/WebAudio, ks. iso selitys
      // paivitaAanet():n yläpuolella) - sama mekanismi kuin HAHMOKERROKSET-
      // videoilla (myös tavallisia <video>-elementtejä), jotka jo toimivat
      // etäohjattuna ilman ongelmia.
      if (h.aaniraita) {
        const sound = new Audio(h.aaniraita + '?cb=' + Date.now());
        sound.preload = 'auto';
        if (ESIKATSELU) sound.muted = true; // sama periaate kuin videoiden oma ESIKATSELU-mykistys (ks. kaynnistaVideoAlusta())
        this.aanihahmot.push({ h, sound, aktiivinen: false });
      }
    });

    // YLITYSHAHMOT (ks. esitys-2d-hahmot.js) - RUUTUUN sidottu sijainti
    // (setScrollFactor(0), sama turvallinen erikoistapaus kuin kiinteatKuvat
    // käyttää) mutta EI kiinteatKuvat-tyylistä haalistu-paikallaan -käytöstä:
    // näiden x/y päivittyy JOKA FRAME update():ssa niin kauan kuin aktiivinen,
    // ks. paivitaYlitykset() ja update(). syvyys (VALINNAINEN per alkio,
    // 3.9.2026, Jarno "can you adjust dept of Nara?") - oletus 50: taustaker-
    // rosten (0..~12) ja maisemahahmojen yläpuolella, ketun (100) alapuolella -
    // kävelee taka-/keskimaastossa, ei peitä opashahmoa. Aiemmin KIINTEÄ
    // luku kaikille YLITYSHAHMOT-alkioille - nyt jokainen voi asettaa oman.
    this.ylitykset = [];
    YLITYSHAHMOT.forEach((h, i) => {
      let animaatioAvain = null;
      if (h.spritesheet) {
        animaatioAvain = 'ylitys:' + i + ':kavely';
        this.anims.create({
          key: animaatioAvain,
          frames: this.anims.generateFrameNumbers('ylitys:' + i, { start: 0, end: (h.kehyksia || 1) - 1 }),
          frameRate: h.fps || 10,
          repeat: -1
        });
      }
      // maara (VALINNAINEN, 3.9.2026, Jarno "several endless stream of she" -
      // Nera-armeija): kuinka MONTA rinnakkaista ylitystä tästä samasta
      // konfiguraatiosta luodaan, kaikki jakavat SAMAN ladatun tekstuurin/
      // animaatioavaimen ('ylitys:'+i, ei per-instanssi) mutta liikkuvat
      // TOISISTAAN RIIPPUMATTA (oma alkuaika, ks. paivitaYlitykset()).
      // Oletus 1 = vanha käytös (yksi Mech), täysin koskematon jos kenttä
      // puuttuu.
      const maara = h.maara || 1;
      for (let j = 0; j < maara; j++) {
        const img = h.spritesheet ? this.add.sprite(-9999, -9999, 'ylitys:' + i) : this.add.image(-9999, -9999, 'ylitys:' + i);
        img.setOrigin(h.ankkuriX != null ? h.ankkuriX : 0.5, h.ankkuriY != null ? h.ankkuriY : 1);
        img.setScrollFactor(0);
        img.setDepth(h.syvyys != null ? h.syvyys : 50);
        img.setVisible(false);
        this.ylitykset.push({ h, img, animaatioAvain, aktiivinen: false, odottaa: false, viiveAjastin: null, alkuaika: 0, vaiheindeksi: j, vaiheita: maara, osumaAmmuttu: false });
      }
    });

    // --- animaatiot ---
    // Avaimet uudelleennimetty 'kettu:walk' jne (aiemmin pelkkä 'walk') kun
    // hahmovalinta lisättiin (31.8.2026) - Phaserin anims.create()-avaimet
    // ovat GLOBAALEJA (eivät per-sprite), joten "walk" olisi törmännyt uusien
    // hahmojen omien "walk"-animaatioiden kanssa. Sama '<avain>:<klippi>'
    // -konventio kuin tekstuuriavaimissa.
    this.anims.create({ key: 'kettu:walk', frames: this.anims.generateFrameNumbers('kettu-walk', { start: 0, end: 7 }), frameRate: 10, repeat: -1 });
    this.anims.create({ key: 'kettu:idle', frames: this.anims.generateFrameNumbers('kettu-idle', { start: 0, end: 4 }), frameRate: 6, repeat: -1 });
    this.anims.create({ key: 'kettu:sit', frames: [{ key: 'kettu-sit', frame: 0 }], frameRate: 1 });
    this.anims.create({ key: 'kettu:idle_alert', frames: [{ key: 'kettu-idle-alert', frame: 0 }], frameRate: 1 });
    this.anims.create({ key: 'kettu:sneak', frames: [{ key: 'kettu-sneak', frame: 0 }], frameRate: 1 });
    // uudet klipit exported-model.glb:stä (Jarnon pyyntö 31.8.2026, "more
    // variation") - toistuvat/eleenomaiset (bark/howl/run) loopataan kuten
    // walk/idle, kertaluontoiset teot (bite/fetch/jump) soitetaan KERRAN ja
    // jäävät viimeiseen kehykseen (repeat:0, Phaserin oletuskäytös). Ei vielä
    // liitetty mihinkään pysähdykseen esitys-data.js:ssä - lisää
    // hahmoAnimaatio-kenttään haluamallesi pysähdykselle (esim.
    // hahmoAnimaatio:'Bark') kun päätät mihin kohtaan mikäkin sopii.
    this.anims.create({ key: 'kettu:bark',  frames: this.anims.generateFrameNumbers('kettu-bark',  { start: 0, end: 5 }), frameRate: 4,  repeat: -1 });
    this.anims.create({ key: 'kettu:bite',  frames: this.anims.generateFrameNumbers('kettu-bite',  { start: 0, end: 3 }), frameRate: 6,  repeat: 0 });
    this.anims.create({ key: 'kettu:fetch', frames: this.anims.generateFrameNumbers('kettu-fetch', { start: 0, end: 3 }), frameRate: 5,  repeat: 0 });
    this.anims.create({ key: 'kettu:howl',  frames: this.anims.generateFrameNumbers('kettu-howl',  { start: 0, end: 5 }), frameRate: 4,  repeat: -1 });
    this.anims.create({ key: 'kettu:jump',  frames: this.anims.generateFrameNumbers('kettu-jump',  { start: 0, end: 7 }), frameRate: 6,  repeat: 0 });
    this.anims.create({ key: 'kettu:run',   frames: this.anims.generateFrameNumbers('kettu-run',   { start: 0, end: 7 }), frameRate: 12, repeat: -1 });

    // muiden valittavien hahmojen animaatiot - geneerisesti HAHMOVAIHTOEHDOT-
    // taulukosta. KORJATTU 7.9.2026 (T-Rex/Hevonen-uudelleenkaappaus toi
    // moniKEHYKSISIÄ ei-walk-klippejä - roar/tail_attack/rear/run, 6-8
    // kehystä) - AIEMMIN tämä silmukka oletti KAIKKI ei-walk-klipit AINA
    // yhden kehyksen "poosiksi" (kovakoodattu `frame:0`), mikä olisi
    // hiljaa näyttänyt vain jokaisen uuden spritesheetin ENSIMMÄISEN
    // kehyksen paikallaan - ei kaatunut, mutta olisi haaskannut koko
    // kaapatun animaation. Kehysmäärä luetaan nyt SUORAAN ladatun
    // tekstuurin leveydestä (260px per kehys, sama kiinteä koko kuin
    // preload()-vaiheen frameWidth/frameHeight, ks. yllä oleva load.spritesheet-
    // silmukka) - EI tarvitse ylläpitää erillistä kehysmäärä-listaa käsin,
    // toimii automaattisesti riippumatta kuinka monta kehystä joku
    // spritesheet oikeasti sisältää.
    HAHMOVAIHTOEHDOT.forEach(h => {
      if (h.avain === 'kettu') return; // luotu yllä
      Object.keys(h.spritet).forEach(klippi => {
        const avainTekstuuri = h.avain + ':' + klippi;
        const kehyksia = Math.max(1, Math.round(this.textures.get(avainTekstuuri).source[0].width / 260));
        if (kehyksia > 1) {
          this.anims.create({ key: avainTekstuuri, frames: this.anims.generateFrameNumbers(avainTekstuuri, { start: 0, end: kehyksia - 1 }), frameRate: klippi === 'walk' ? 10 : 8, repeat: -1 });
        } else {
          this.anims.create({ key: avainTekstuuri, frames: [{ key: avainTekstuuri, frame: 0 }], frameRate: 1 });
        }
      });
    });

    // --- kettu ---
    // origin (0.5, 0.696) - MITATTU suoraan fox-walk.png:n kehys 0:sta
    // (Pillow: alin läpinäkymätön rivi jaettuna kehyskorkeudella), ei enää
    // silmämääräinen arvaus. HUOM: tämä arvo on SIDOTTU nykyiseen
    // kaappausrajaukseen (§27 kohta 8:n yhteinen "maadoitettu" laatikko) -
    // jos spritet joskus kaapataan uudelleen ERI rajauksella, origin.y
    // pitää mitata uudestaan samalla tavalla, muuten kettu kelluu/uppoaa
    // taas (Jarno: "position is not same as before, it should be on grass
    // level", 31.8.2026 - ilmeni suoraan §27 kohta 8:n skaalamuutoksesta,
    // koska vanha 0.82 oli mitoitettu VANHALLE, tiukemmalle Walk-rajaukselle
    // eikä enää osunut jalkojen kohdalle uudessa, väljemmässä rajauksessa).
    // Y lasketaan suhteessa ruudun korkeuteen (KETUN_Y_SUHDE), päivitetään
    // resize-käsittelijässä jos ruudun koko vaihtuu. KETUN_Y_SUHDE
    // säädetty uudelleen silmämääräisesti (0.98 -> 0.94) origin-muutoksen
    // jälkeen niin että jalat osuvat nurmen pintaan.
    //
    // HUOM (kettu eri ruutukoilla): pelkkä Y-suhde EI riitä - ketun
    // setScale() oli aiemmin KIINTEÄ luku (1.1) joka ei muuttunut ruudun
    // korkeuden mukana, vaikka taustan kuvakerrokset skaalautuvat AINA
    // korkeuden mukaan (pystySkaala sovitaTaustatRuutuun():ssa). Lyhyellä/
    // leveällä ruudulla (esim. 1600x500) tausta pienenee mutta kettu pysyi
    // samankokoisena -> kettu näytti liian isolta ja "kelluvan" koska sen
    // kiinteä pikselikorkeus vei sen jalat todellisen nurmirajan yläpuolelle.
    // Korjaus: KETTU_SKAALA_SUHDE kertoo ketun skaalan samalla
    // pystySkaala-arvolla kuin taustan, jolloin kettu skaalautuu AINA
    // samassa suhteessa taustaan nähden riippumatta ruudun koosta/
    // kuvasuhteesta. Sovelletaan sekä täällä (alkuarvo) että
    // sovitaTaustatRuutuun():ssa (resize). Arvo laskettu niin että se
    // vastaa vanhaa toimivaksi todettua setScale(1.1):tä tunnetulla
    // testiviewportilla (korkeus 1296, TAUSTAN_ZOOM 1.45, lähdekorkeus 793).
    //
    // *1.1553-kerroin (Jarno: "fox got some smaller?", 31.8.2026): muistio
    // §27 kohta 8:n "yhtenäinen mittakaava kaikille animaatioille" -korjaus
    // vaihtoi Walkin kaappausrajauksen SEN OMASTA tiukasta laatikosta
    // (halkaisija ~3.893) KAIKKIEN maassa-pysyvien klippien yhteiseen,
    // isompaan laatikkoon (halkaisija ~4.497) - kettu vie siis saman
    // 260px-kehyksen sisällä VÄHEMMÄN pikseleitä kuin ennen (~15.5%
    // pienempi), täysin odotettu sivuvaikutus siitä korjauksesta mutta ei
    // toivottu koon pienennys. Kerroin (4.497/3.893) palauttaa ketun
    // ruudulla näkyvän koon ennalleen ilman että kaappauksia tarvitsee
    // muuttaa uudestaan.
    // HAHMON_Y_SUHDE: yhteinen kaikille valittaville hahmoille (aiemmin
    // KETUN_Y_SUHDE, vain ketulle) - jokainen hahmo seisoo samalla
    // "maanpinnan" korkeudella riippumatta siitä kumpi on valittuna, koska
    // origin.y (per-hahmo, HAHMOVAIHTOEHDOT) hoitaa hahmon OMAN jalka-
    // kohdan tarkkuuden.
    this.HAHMON_Y_SUHDE = 0.94;
    // KOKEILTU JA HYLÄTTY 2.9.2026: LINEAR-suodatus kaikille opashahmoille
    // (Jarno huomasi "characters... litte too pixelated, other than fox" -
    // syy oli oikea, ks. alla, mutta Jarno EI halunnut korjata sitä
    // pehmentämällä: "do not use smooth things! Looks worse! Pixel are
    // good" - hän haluaa PITÄÄ terävän pikselitaide-tyylin). OIKEA korjaus
    // on rakentaa trex/hevonen/pupu UUDELLEEN isommalla natiivilla
    // kehyskoolla (nyt kaikki jaettu 260x260, mutta mittakaavaSuhde
    // suurentaa niitä jopa yli 2x kettuun verrattuna - trex 1.15/hevonen
    // 1.05/pupu 0.85 vs. ketun 0.5361 - suurennos ilman lisäresoluutiota
    // ON pikselöitymisen syy, EI itse pixelArt:true-asetus, joka pysyy
    // ENNALLAAN koko pelille kaikkien MUIDEN kuvien vuoksi). Tehdään
    // MYÖHEMMIN Jarnon pyynnöstä - test-hahmo-render.html samalla
    // kaappaustekniikalla kuin kettu, vain isommalla kehyskoolla.
    this.hahmoAvain = 'kettu'; // oletusopas - vaihdettavissa vaihdaHahmo():lla, ks. alempana
    this.luoHahmo(this.hahmoAvain, kohdeX, height);
    hahmoTila = { kavelee: true };
    this.sovitaTaustatRuutuun(width, height); // asettaa myös hahmon skaalan+Y:n heti oikein

    this.cameras.main.scrollX = kohdeX - width / 2;

    // Käytä nykyistä (mahdollisesti sessionStoragesta palautettua, ks.
    // INDEKSI_AVAIN) indeksi:ä - EI aina [0]:aa, muuten teksti/palkki/laskuri
    // näyttäisivät alkua vaikka kamera/kettu jo palautuivat oikeaan kohtaan.
    const alkuPysahdys = PYSAHDYKSET_2D[indeksi];
    naytaTeksti(alkuPysahdys);
    naytaLukukortti(alkuPysahdys);
    naytaChatti(alkuPysahdys);
    naytaJaavuori(alkuPysahdys);
    naytaVesi(alkuPysahdys);
    naytaPaperipino(alkuPysahdys);
    naytaKupla(alkuPysahdys);
    naytaTikapuut(alkuPysahdys);
    naytaDiffuusio(alkuPysahdys);
    naytaEnnustus(alkuPysahdys);
    naytaTamagotchi(alkuPysahdys);
    naytaYoutube(alkuPysahdys);
    naytaPolkupeli(alkuPysahdys);
    naytaDatakupla(alkuPysahdys);
    naytaAgenda2030(alkuPysahdys);
    this.paivitaVainPysahdysKuvat(alkuPysahdys);
    palkkiEl.style.width = (indeksi / (PYSAHDYKSET_2D.length - 1) * 100) + '%';
    laskuriEl.textContent = 'Jarno Alastalo · ' + String(indeksi + 1).padStart(2, '0') + ' / ' + PYSAHDYKSET_2D.length;
    setTimeout(() => ohjeEl.classList.add('piilossa'), 4500);
    window.__scene = this;
    // ESIKATSELU-mykistys (8.9.2026, siirretty tänne aanihahmot-kohtaisesti,
    // ks. niiden oma luontikohta alempana) - Phaserin Sound Manageria
    // (this.sound.mute) EI enää käytetä aaniraita-klipeille, ks. iso selitys
    // paivitaAanet():n yläpuolella. `this.sound` jää nyt käyttämättä
    // KOKONAAN, ei siis tarvitse mykistää sitä täällä. Ei sisältökohtainen,
    // portattu Taiteilijajärjestöt-deckistä.
    // Ilmoita oma tila HETI latauksella (6.9.2026, "worst case" -pyyntö:
    // jos PÄÄNÄYTTÖ kaatuu/ladataan uudelleen kesken esityksen, esittäjä-
    // näkymä ei muuten saisi tästä koskaan tietoa - se kysyy tilan VAIN
    // omalla latautumishetkellään ("kysy"-viesti), ei jatkuvasti. Tämä
    // broadcast kattaa juuri sen tilanteen: esittäjänäkymä on jo auki ja
    // vastaanottaa tämän automaattisesti, ei tarvitse mitään manuaalista
    // toimenpidettä. Ei haittaa vaikka esittäjänäkymää ei olisi vielä
    // avattukaan - viesti menee vain sitä kuunteleviin ikkunoihin.
    if (esitysKanava) esitysKanava.postMessage({ tyyppi: 'siirry', indeksi: globaaliIndeksi(), alkuaika });
    // Kuva-/video-/ääni-hahmot ovat oikein NÄKYVISSÄ heti (samat oletukset
    // kuin aina), mutta eivät automaattisesti "aktiivisia" jos palataan
    // suoraan keskelle jonkin niistä pysähdystä - selaimen autoplay-esto
    // vaatisi ensin oikean käyttäjän klikkauksen joka tapauksessa (ks.
    // muistio §38), joten tämä ei ole aito regressio: siirry() seuraavaan/
    // edelliseen pysähdykseen käynnistää normaalisti.
  }

  // palauttaa KOHTAUKSET-taulukosta sen kohtauksen jonka xAlue sisältää
  // annetun x:n (esitys-data.js:n omassa x-yksikössä, EI kerrottuna
  // SKAALAlla). Jos mikään ei täsmää (ei pitäisi tapahtua jos xAlueet
  // kattavat koko käytetyn välin ilman aukkoja), palautetaan ensimmäinen.
  // KORJAUS 1.9.2026 (löydetty tarinakaari-tarkastelussa, ks. muistio):
  // vanha `|| KOHTAUKSET[0]` palautti METSÄN aina kun x ei osunut MIHINKÄÄN
  // xAlueeseen - tämä tapahtui joka kerta kun pysähdys oli KOHTAUKSET-
  // kattavuuden ULKOPUOLELLA (esim. x:9990-15240, "mitä jää ihmiselle" /
  // "HITAUS" / "Kiitos!" - reilu kolmannes koko esityksestä ei tällä
  // hetkellä osu MIHINKÄÄN kohtaukseen koska taustakohtaukset ulottuvat
  // vain x:9912:een asti) - tausta hyppäsi silloin yllättäen takaisin
  // alkumetsään keskellä esitystä, täysin irrallaan sen hetken sisällöstä.
  // Tämä korjaus VÄLTTÄÄ pahimman: alle kattavuuden -> ensimmäinen kohtaus
  // (ennallaan, järkevä oletus), YLI kattavuuden -> VIIMEINEN kohtaus (uusi -
  // pysyy edes SAMASSA, viimeksi näytetyssä maailmassa, ei hypi takaisin
  // alkuun). EI korvaa oikeaa sisältöratkaisua - Jarnon pitää itse päättää
  // pidennetäänkö kaupunkisarjaa, tuodaanko uusi pakka, vai jotain muuta
  // (ks. muistion iso-kysymys "6. Do we need more background to support
  // story?") - tämä on vain turvaverkko ettei tausta ikinä hyppää väärään
  // maailmaan sillä välin.
  valitseKohtaus(x){
    const osuma = KOHTAUKSET.find(k => x >= k.xAlue[0] && x <= k.xAlue[1]);
    if (osuma) return osuma;
    return x < KOHTAUKSET[0].xAlue[0] ? KOHTAUKSET[0] : KOHTAUKSET[KOHTAUKSET.length - 1];
  }

  // ==========================================================================
  // LÖYDETTY BUGI 3.9.2026 (Jarno: "still catle moves in different phase!!!!!"
  // - sen JÄLKEEN kun scrollFactor-LUVUT jo täsmäsivät linnan ja "sen"
  // maastokerroksen välillä). Mitattu SUORAAN pelissä: linna liikkui VAIN
  // 1/3.2 SIITÄ NOPEUDESTA jolla maasto liikkui, VAIKKA molempien
  // scrollFactor-KENTÄT olivat identtiset (0.445 == 0.445). Syy: nämä KAKSI
  // eri mekanismia EIVÄT ole verrannollisia keskenään:
  //   - KOHTAUKSET-taustakerros (TileSprite): ruudulla LUKITTU objekti
  //     (setScrollFactor(0)), liike tulee KOKONAAN tilePositionX:n
  //     käsinpäivityksestä (ks. update():n "t.obj.tilePositionX = cam.
  //     scrollX * t.scrollFactor..."). tilePositionX on LÄHDEKUVAN OMASSA
  //     pikseliavaruudessa - ruudulla näkyvä liike = scrollFactor *
  //     tileScaleX (ks. sovitaTaustatRuutuun()), koska tilePosition
  //     skaalautuu tileScaleen mukana.
  //   - HAHMOKERROKSET-kuva (Image): Phaserin OMA scrollFactor-mekanismi,
  //     joka toimii SUORAAN maailmakoordinaateissa (screenX = worldX -
  //     camScrollX*scrollFactor) - EI mitään tileScale-kerrointa mukana.
  // Sama scrollFactor-LUKU tuottaa siis ERI ruutunopeuden riippuen KUMMASSA
  // järjestelmässä sitä käytetään - ero on TÄSMÄLLEEN se kohtauksen oma
  // tileScaleX (joka taas riippuu RUUDUN KORKEUDESTA, EI siis mikään
  // kiinteä vakio jonka voisi vain kirjoittaa dataan kerran).
  //
  // lukitseKerrokseen (VALINNAINEN, HAHMOKERROKSET-kenttä): tiedostonimi
  // (esim. '11.png') jostain SEN OMAN vainKohtaus-kohtauksen kerrokset-
  // listalta. KÄYTETTÄESSÄ ohittaa h.scrollFactor-kentän KOKONAAN ja laskee
  // ajonaikaisesti OIKEAN, ruutukorkeuden-tietoisen efektiivisen scroll-
  // Factorin = kyseisen kerroksen oma scrollFactor * SEN OMA tileScaleX -
  // SAMALLA tileScaleX-kaavalla kuin sovitaTaustatRuutuun() käyttää
  // (omaKorkeus/lähdekorkeus*zoom). Kutsutaan SEKÄ create():ssa ETTÄ
  // resize-kuuntelijassa (ks. sovitaTaustatRuutuun()) - tulos MUUTTUU
  // ruudun koon mukana, ei voi laskea kerran etukäteen.
  laskeLukittuScrollFactor(kohtaus, tiedostonimi, korkeus){
    const idx = kohtaus.kerrokset.findIndex(k => k.tiedosto === tiedostonimi);
    if (idx === -1) {
      console.warn('lukitseKerrokseen: kerrosta "' + tiedostonimi + '" ei löydy kohtauksesta "' + kohtaus.nimi + '"');
      return null;
    }
    const kerros = kohtaus.kerrokset[idx];
    const avain = kohtaus.nimi + ':' + idx + ':' + kerros.tiedosto;
    const lahdekorkeus = this.textures.get(avain).getSourceImage().height;
    const korkeusSuhde = (kohtaus.taustaKorkeusSuhde != null) ? kohtaus.taustaKorkeusSuhde : 1.0;
    const omaKorkeus = korkeus * korkeusSuhde;
    const zoom = (kohtaus.zoom != null) ? kohtaus.zoom : 1.45; // TAUSTAN_ZOOM, ks. sovitaTaustatRuutuun()
    const tileScaleX = (omaKorkeus / lahdekorkeus) * zoom;
    return kerros.scrollFactor * tileScaleX;
  }

  // ==========================================================================
  // KORJAUS 1.9.2026 (Jarno: "video appeared middle of screen, not parallax
  // part of scene floating from right to left"): HAHMOKERROKSET-elementin
  // maailmakoordinaattia EI voi laskea suoraan `h.x * SKAALA`:lla paitsi
  // jos scrollFactor on tasan 1. Miksi: Phaserin ruutusijainti on
  // `screenX = worldX - cameraScrollX * scrollFactor`. Jos elementti halutaan
  // TÄSMÄLLEEN ruudun keskelle SILLÄ HETKELLÄ kun kamera saapuu kohteeseensa
  // (`cameraScrollX = h.x*SKAALA - leveys/2`), täytyy `worldX` ratkaista
  // TÄMÄN ehdon kautta - naiivi `h.x*SKAALA` toimii vain scrollFactor=1:llä.
  // Aiempi "korjaus" (kaikki scrollFactor:1) VÄLTTI ongelman kokonaan
  // poistamalla parallaksin - toimi mutta hävitti sen "kelluu osana
  // maailmaa" -tunnun jota Jarno halusi. Tämä TOSIASIALLINEN korjaus antaa
  // MOLEMMAT: minkä tahansa scrollFactorin (todellinen parallaksiliike) JA
  // silti täsmällisen keskityksen saapumishetkellä - koska worldX lasketaan
  // scrollFactorin mukaan, ei riippumatta siitä.
  //
  // Kutsutaan sekä create():ssa (alkusijoitus) että resize-kuuntelijassa
  // (leveys voi muuttua - "oikea" worldX riippuu ruudun leveydestä).
  laskeParallaksiX(tarinaX, scrollFactor, leveys){
    const kameraKohteessa = tarinaX * SKAALA - leveys / 2;
    return leveys / 2 + kameraKohteessa * scrollFactor;
  }

  // KIINTEÄT KUVAT (esitys-2d-hahmot.js: kiintea:true) - sijainti EI ole
  // maailmakoordinaatti vaan ruutuun sidottu, sama puoli/pysty-kieli ja
  // samat 6vw/6vh-marginaalit kuin #tekstikerroksella (ks. esitys-2d.html:n
  // <style>-lohko) - jotta kiintea kuva ja teksti asettuvat yhdenmukaisesti.
  laskeKiinteaSijainti(h, leveys, korkeus){
    // kohdistusX/Y + paikallinenX/Y (VALINNAINEN, 2.9.2026, "Creation of
    // Adam" -idea) - OHITTAA puoli/pysty kokonaan kun annettu. Jarno löysi
    // oikean bugin: puoli:'vasen'/'oikea' käyttää KIINTEÄÄ 6%-marginaalia
    // ruudun LEVEYDESTÄ, mutta kuvan koko tulee korkeusProsentista (siis
    // KORKEUDESTA) - kapealla/korkealla ruudulla marginaalien väli sattuu
    // olemaan lähellä kuvien kokoa (kädet melkein koskettavat), mutta
    // LEVEÄLLÄ ruudulla (oikea esitys, 16:9+) marginaalien väli kasvaa
    // paljon kuvien kokoa nopeammin - kädet jäävät kauas toisistaan.
    // TÄMÄ korjaus on kuvasuhteesta RIIPPUMATON: kohdistusX/Y = mihin
    // RUUDUN suhteelliseen (0-1) kohtaan osutaan, paikallinenX/Y = MIKÄ
    // kuvan OMA suhteellinen (0-1) kohta (esim. käden kärki) osuu sinne -
    // koska origin on Phaserissa jo valmiiksi kuvan omassa 0-1-skaalassa,
    // paikallinenX/Y VOI mennä suoraan origin-arvoiksi. Toimii oikein
    // MILLÄ TAHANSA ruutukoolla/-suhteella, ei vain siinä missä testattiin.
    if (h.kohdistusX != null && h.kohdistusY != null) {
      return {
        x: leveys * h.kohdistusX,
        y: korkeus * h.kohdistusY,
        originX: h.paikallinenX != null ? h.paikallinenX : 0.5,
        originY: h.paikallinenY != null ? h.paikallinenY : 0.5,
      };
    }
    const marginX = leveys * 0.06, marginY = korkeus * 0.06;
    const puoli = h.puoli || 'vasen';
    const pysty = h.pysty || 'yla';
    const x = puoli === 'oikea' ? leveys - marginX : (puoli === 'keski' ? leveys / 2 : marginX);
    const y = pysty === 'ala' ? korkeus - marginY : (pysty === 'keski' ? korkeus / 2 : marginY);
    const originX = puoli === 'oikea' ? 1 : (puoli === 'keski' ? 0.5 : 0);
    const originY = pysty === 'ala' ? 1 : (pysty === 'keski' ? 0.5 : 0);
    return { x, y, originX, originY };
  }

  // palauttaa HAHMOVAIHTOEHDOT-taulukosta annetun avaimen tiedot, tai
  // ketun jos avain ei täsmää mihinkään (ei pitäisi tapahtua normaalisti).
  hahmoTiedot(avain){
    return HAHMOVAIHTOEHDOT.find(h => h.avain === avain) || HAHMOVAIHTOEHDOT[0];
  }

  // luo this.hahmo-spriten annetulla avaimella x-sijaintiin. Käytetään
  // sekä create():ssa (ensimmäinen hahmo) että vaihdaHahmo():ssa (yleisö/
  // esittäjä vaihtaa opashahmoa kesken esityksen, Jarnon idea 31.8.2026 -
  // ks. esitys-2d-hahmovaihtoehdot.js:n yläkommentti). 'walk' on AINA
  // ensimmäinen animaatio koska hahmo on tässä kohtaa aina liikkeellä
  // (joko kävelemässä kohteeseen tai juuri vaihdettu kesken kävelyn).
  luoHahmo(avain, x, korkeus){
    const tiedot = this.hahmoTiedot(avain);
    this.hahmo = this.add.sprite(x, korkeus * this.HAHMON_Y_SUHDE, avain + ':walk');
    this.hahmo.setOrigin(tiedot.origin.x, tiedot.origin.y);
    this.hahmo.setScrollFactor(1);
    this.hahmo.setDepth(100);
    this.hahmo.play(avain + ':walk');
  }

  // ==========================================================================
  // VIDEOHAHMOT (maisemaan sulautuvat läpinäkyvät videot, esim. patsas x:860).
  // UUDISTETTU 1.9.2026 (Jarno: video "ilmestyi tyhjästä" hänen omalla
  // koneellaan, vaikka aiempi play()+pause()-"pakota frame näkyviin" -temppu
  // toimi tässä testiympäristössä). UUSI PERIAATE: video-elementtiä EI
  // KOSKAAN pyydetä näyttämään mitään paitsi kun se OIKEASTI soi - kaikki
  // "ei vielä soi" / "on jo soinut" -tilat hoidetaan kahdella tavallisella,
  // 100%-luotettavasti piirtyvällä PNG:llä (`ekaKuva`/`viimeinenKuva`, ks.
  // esitys-2d-hahmot.js). Video on JO KOKONAAN esiladattu
  // ('canplaythrough') siihen mennessä kun pysähdys voidaan edes saavuttaa,
  // joten PNG->video-vaihto on välitön eikä näy hyppynä.
  //
  // Kaksi asiaa jotka EIVÄT ole ilmeisiä pelkästä Phaser-dokumentaatiosta
  // (löydetty/korjattu test-video-alpha.html:ssä, ks. muistio §38):
  //   1. Video.play()-metodin ekaparametri on LOOP, ei "aloita alusta" -
  //      nollaus tehdään AINA eksplisiittisesti currentTime=0:lla.
  //   2. play() on TÄYSIN HILJAINEN NO-OP jos Phaserin sisäinen
  //      `_playCalled`-lippu on jo totta - se nollautuu VAIN stop()-
  //      kutsussa, siksi joka käynnistys kulkee stop()+play()-parina, ja
  //      selaimen play()/pause()-lupauskilpaa varten on 200ms-varmuustarkistus.
  // ==========================================================================

  // käynnistää videon AINA alusta - stop()+play()-pari (ei pelkkä play()),
  // koska pelkkä play() ei tee mitään jos Phaserin _playCalled-lippu on
  // jo totta edellisestä (mahdollisesti selaimen keskeyttämästä) yrityksestä.
  kaynnistaVideoAlusta(vh){
    const video = vh.video;
    video.stop(false);
    video.video.currentTime = 0;
    video.video.muted = ESIKATSELU || vh.h.aani === false;
    video.setVisible(true);
    vh.ekaKuva.setVisible(false);
    vh.viimeinenKuva.setVisible(false);
    video.play(!!vh.h.loop);
  }

  // sama stop()+play()-pari kuin kaynnistaVideoAlusta():ssa (samat kaksi
  // Phaser-kummajaista, ks. sen yläpuolen iso kommentti), mutta kiintea:true-
  // videolle - EI PNG-kavereiden piilotusta, koska niitä ei tässä haarassa
  // ole ollenkaan.
  kaynnistaKiinteaVideoAlusta(kv){
    const video = kv.video;
    video.stop(false);
    video.video.currentTime = 0;
    video.video.muted = ESIKATSELU || kv.h.aani === false;
    video.setVisible(true);
    video.play(!!kv.h.loop);
  }

  // videon (ja sen kahden PNG-kaverin) korkeus suhteessa ruudun korkeuteen
  // (korkeusProsentti-kenttä) - videolla EI ole vielä oikeaa kokoa ennen
  // 'created'-eventtiä (video.width/height ovat 256x256-paikkamerkki
  // siihen asti), PNG:t sen sijaan tietävät kokonsa heti.
  //
  // KORJAUS 1.9.2026 (Jarno: eri näytöt - projektori vs iso TV - näyttivät
  // patsaan/videon eri kokoisena): `ruudunKorkeus` YKSIN pohjana tarkoitti
  // että sama korkeusProsentti-arvo vie ERI OSUUDEN ruudun LEVEYDESTÄ eri
  // kuvasuhteilla (leveä ruutu = enemmän leveyttä käytettävissä samalle
  // korkeudelle, siis suhteellisesti kapeampi/pienempi; kapea/korkea ruutu =
  // päinvastoin). Käytetään nyt `Math.min(leveys, korkeus)`:ia - vaimentaa
  // heittelyn molempiin suuntiin ilman haittaa, EI täysin poista sitä
  // (siihen tarvittaisiin kiinteä kuvasuhde + letterbox, isompi muutos,
  // ei tehty tässä - Jarnon oma päätös jos tarvitaan myöhemmin).
  sovitaVideoKokoon(vh, ruudunLeveys, ruudunKorkeus){
    const kProsentti = vh.h.korkeusProsentti != null ? vh.h.korkeusProsentti : 0.55;
    const kohdeKorkeus = Math.min(ruudunLeveys, ruudunKorkeus) * kProsentti;
    if (vh.video.video && vh.video.width) vh.video.setScale(kohdeKorkeus / vh.video.height);
    vh.ekaKuva.setScale(kohdeKorkeus / vh.ekaKuva.height);
    vh.viimeinenKuva.setScale(kohdeKorkeus / vh.viimeinenKuva.height);
  }

  // sama periaate kuin sovitaVideoKokoon():ssa, mutta kiintea:true-videolle -
  // EI PNG-kavereita skaalattavana, koska niitä ei ole (ks. luonti-kohdan iso
  // kommentti). korkeusProsentin oletus sama kuin kiintea-kuvalla (0.18).
  sovitaKiinteaVideoKokoon(kv, leveys, korkeus){
    const kProsentti = kv.h.korkeusProsentti != null ? kv.h.korkeusProsentti : 0.18;
    if (kv.video.video && kv.video.width) {
      kv.video.setScale((Math.min(leveys, korkeus) * kProsentti) / kv.video.height);
    }
  }

  // kutsutaan globaalista siirry()-funktiosta joka kerta kun pysähdys
  // vaihtuu. suunta: 1=eteenpäin, -1=taaksepäin (ks. globaali siirry()).
  paivitaVideot(uusiPysahdys, suunta){
    this.videohahmot.forEach(vh => {
      const kuuluuTahan = uusiPysahdys.x === vh.h.x;
      if (kuuluuTahan && !vh.aktiivinen) {
        vh.aktiivinen = true;
        if (vh.varmuusAjastin) { vh.varmuusAjastin.remove(false); vh.varmuusAjastin = null; }
        this.kaynnistaVideoAlusta(vh);
        // varmuustarkistus - ks. yläpuolen selitys kohta 2.
        vh.varmuusAjastin = this.time.delayedCall(200, () => {
          vh.varmuusAjastin = null;
          if (vh.aktiivinen && vh.video.video.paused) this.kaynnistaVideoAlusta(vh);
        });
      } else if (!kuuluuTahan && vh.aktiivinen) {
        vh.aktiivinen = false;
        vh.video.stop();
        vh.video.setVisible(false);
        if (suunta > 0) { vh.viimeinenKuva.setVisible(true); vh.ekaKuva.setVisible(false); }
        else { vh.ekaKuva.setVisible(true); vh.viimeinenKuva.setVisible(false); }
      }
    });
  }

  // kiintea:true -kuvat (ks. esitys-2d-hahmot.js) - sama x-täsmäys-periaate
  // kuin paivitaVideot():ssä, mutta EI suuntariippuvaista (ei ole mitään
  // "viimeiseen frameen jää" -tarvetta, kuva vain haalistuu pois kuten
  // teksti tekee) - näkyy/piiloutuu haalistuen (.5s, sama ajoitus kuin
  // #teksti-elementin CSS-transitiolla) täsmälleen sillä yhdellä
  // pysähdyksellä johon sen x osuu.
  paivitaKiinteatKuvat(uusiPysahdys){
    this.kiinteatKuvat.forEach(kk => {
      const kuuluuTahan = uusiPysahdys.x === kk.h.x;
      if (kuuluuTahan && !kk.aktiivinen) {
        kk.aktiivinen = true;
        this.tweens.add({ targets: kk.img, alpha: 1, duration: 500 });
        if (kk.animaatioAvain) kk.img.play(kk.animaatioAvain); // aina alusta, sama "ei koskaan jatka kesken" -periaate kuin muillakin
        // liukuSuunta (VALINNAINEN, 2.9.2026, "Creation of Adam" -idea:
        // "adam flies from left to right and god from right to left and
        // their hand touches, spark") - kuva liukuu sisään RUUDUN REUNALTA
        // omaan (jo laskeKiinteaSijainti():n asettamaan) lopulliseen
        // paikkaansa, sen sijaan että vain ilmestyisi/haalistuisi paikalleen.
        // 'vasen' = tulee sisään ruudun VASEMMALTA reunalta (liikkuu siis
        // vasemmalta oikealle), 'oikea' = ruudun OIKEALTA reunalta.
        if (kk.h.liukuSuunta) {
          const kesto = kk.h.liukuKesto != null ? kk.h.liukuKesto : 1200;
          const lopullinenX = kk.img.x; // laskeKiinteaSijainti():n jo asettama oikea paikka
          kk.img.x = kk.h.liukuSuunta === 'vasen' ? -kk.img.displayWidth : this.scale.width + kk.img.displayWidth;
          this.tweens.add({ targets: kk.img, x: lopullinenX, duration: kesto, ease: 'Cubic.easeOut' });
          // kipina (VALINNAINEN): pieni kipinäpurskaus RUUDUN suhteellisessa
          // kohdassa (x/y, 0-1) TÄSMÄLLEEN kun liu'utus on valmis - ks.
          // piirraKipina() alempana. Aseta VAIN toiselle kahdesta kuvasta
          // (muuten kipinä laukeaisi kahdesti samaan aikaan).
          if (kk.h.kipina) this.time.delayedCall(kesto, () => this.piirraKipina(kk.h.kipina));
        }
      } else if (!kuuluuTahan && kk.aktiivinen) {
        kk.aktiivinen = false;
        this.tweens.add({ targets: kk.img, alpha: 0, duration: 500 });
        if (kk.animaatioAvain) kk.img.stop();
      }
    });
  }

  // vainPysahdys (VALINNAINEN, MAAILMAAN ankkuroitu kuva/spritesheet-
  // hahmoille - EI kiintea:true, 6.9.2026, Jarno: "fire should be only one
  // page, on this" x:6390-tornituli) - eri asia kuin vainKohtaus (joka
  // rajoittaa näkyvyyden KOKO kohtaukseen, esim. koko 1200-yksikön tornin-
  // sumu-kohtaukseen): tämä näyttää elementin VAIN sillä YHDELLÄ täsmälleen
  // täsmäävällä pysähdyksellä, sama x-täsmäys-periaate kuin kiintea-kuvilla,
  // MUTTA säilyttää TÄYDEN maailma-/parallaksisijainnin (lukitseKerrokseen
  // jne.) - kiintea:true ei kävisi tähän koska se hylkää koko parallaksin
  // ja käyttää puoli/pysty-ruutusijaintia sen sijaan.
  paivitaVainPysahdysKuvat(uusiPysahdys){
    if (!this.kuvahahmot) return;
    this.kuvahahmot.forEach(kh => {
      if (kh.h.vainPysahdys == null) return;
      const nakyy = kh.h.vainPysahdys === uusiPysahdys.x;
      // omaLiike (ks. update():n vastaava lohko): esine ajelehtii omaa
      // vauhtiaan niin kauan kuin se on näkyvissä. Lähtösijainti otetaan
      // talteen ENSIMMÄISELLÄ kutsulla - tämä metodi ajetaan create():ssa
      // ennen kuin update() on ehtinyt siirtää mitään, joten talteen jää
      // aito alkuperäinen maailmasijainti. Palautetaan joka kerta kun esine
      // tulee UUDELLEEN näkyviin: muuten kone olisi toisella katselukerralla
      // (esim. kun esityksessä palataan taaksepäin) jo lentänyt pois ruudulta.
      if (kh.h.omaLiike != null) {
        if (kh.perusX == null) kh.perusX = kh.img.x;
        if (nakyy && !kh.img.visible) kh.img.x = kh.perusX;
      }
      kh.img.setVisible(nakyy);
    });
  }

  // saapuu (ks. h.saapuu-haaran iso kommentti create():ssa) - sama x-
  // täsmäys-periaate kuin paivitaKiinteatKuvat(), mutta saapuessaan
  // KÄVELEE (tween, sama idea kuin liukuSuunta) reunalta kohdesijaintiin
  // ja VAIHTAA sitten spritesheetin heiluttamis-silmukkaan onComplete-
  // callbackissa - EI palaa kävelyyn ennen kuin poistutaan pysähdykseltä.
  paivitaSaapujat(uusiPysahdys){
    const width = this.scale.width, height = this.scale.height;
    this.saapujat.forEach(sa => {
      const kuuluuTahan = uusiPysahdys.x === sa.h.x;
      const s = sa.h.saapuu;
      if (kuuluuTahan && !sa.aktiivinen) {
        sa.aktiivinen = true;
        sa.vaihe = 'kavely';
        if (sa.tweeni) { sa.tweeni.stop(); sa.tweeni = null; }
        const groundY = height * (s.pysty != null ? s.pysty : 0.94); // sama oletus kuin ketun HAHMON_Y_SUHDE
        const kohdeX = width * (s.kohdeX != null ? s.kohdeX : 0.58);
        const aloitusX = width * (s.aloitusX != null ? s.aloitusX : 1.15); // ruudun oikean reunan ULKOPUOLELTA
        const kProsentti = s.korkeusProsentti != null ? s.korkeusProsentti : 0.4;
        sa.img.setTexture('saapuu-kavely:' + s.kavely);
        sa.img.setScale((Math.min(width, height) * kProsentti) / sa.img.height);
        // KORJAUS 4.9.2026 (Jarno: "i am walking backewards") - kavely-kuvat
        // on piirretty OIKEALLE päin katsovina/kävelevinä (tarkistettu
        // päänkuvasta: nenä/leuka työntyy kehyksen OIKEALLE puolelle), mutta
        // hahmo kävelee tässä VASEMMALLE (aloitusX oikealta > kohdeX lähempänä
        // keskustaa) - ilman peilausta askel näytti siis "perääntyvältä".
        // setFlipX PEILAA vaakasuunnassa Phaserissa (ei erillistä kuvatiedostoa
        // tarvita) - lasketaan liikkeen suunnasta, EI kovakoodattu, jotta
        // toimisi oikein vaikka aloitusX/kohdeX joskus vaihdettaisiin toisin päin.
        sa.img.setFlipX(kohdeX < aloitusX);
        sa.img.play(sa.kavelyAvain);
        sa.img.x = aloitusX;
        sa.img.y = groundY;
        sa.img.setAlpha(1);
        sa.tweeni = this.tweens.add({
          targets: sa.img,
          x: kohdeX,
          duration: (s.kavelyAika != null ? s.kavelyAika : 3) * 1000,
          ease: 'Sine.easeInOut',
          onComplete: () => {
            sa.tweeni = null;
            sa.vaihe = 'heiluttaa';
            sa.img.setFlipX(false); // heilutus-kuvat on kuvattu edestä, ei suuntariippuvaisia
            sa.img.setTexture('saapuu-heilutus:' + s.heilutus);
            sa.img.setScale((Math.min(width, height) * kProsentti) / sa.img.height);
            // heiluttaaKertaa (VALINNAINEN, oletus 2, Jarno "make wave just
            // couple time and then 00") - EI loputtomiin, vaan rajattu määrä
            // silmukoita, sitten pysähtyy heilutus0-kehykseen (rauhallinen
            // "seisoo paikallaan" -loppuasento, ei jää heiluttamaan ikuisesti).
            const kertaa = s.heiluttaaKertaa != null ? s.heiluttaaKertaa : 2;
            sa.img.play({ key: sa.heilutusAvain, repeat: Math.max(0, kertaa - 1) });
            sa.img.once('animationcomplete', () => {
              if (sa.vaihe === 'heiluttaa') sa.img.setFrame(0); // heilutus0.png: kädet alhaalla, "ja sitten 00"
            });
          }
        });
      } else if (!kuuluuTahan && sa.aktiivinen) {
        sa.aktiivinen = false;
        sa.vaihe = 'pois';
        if (sa.tweeni) { sa.tweeni.stop(); sa.tweeni = null; }
        sa.img.setAlpha(0);
        sa.img.stop();
      }
    });
  }

  // kiintea:true + video (ks. luonti-kohdan iso kommentti) - sama x-täsmäys-
  // periaate kuin paivitaVideot()/paivitaKiinteatKuvat():ssa, käytännössä
  // paivitaVideot():n varmuustarkistus-koneisto ilman suuntariippuvaista
  // PNG-vaihtoa (ei tarvita, ei PNG-kavereita tässä haarassa).
  paivitaKiinteatVideot(uusiPysahdys){
    this.kiinteatVideot.forEach(kv => {
      const kuuluuTahan = uusiPysahdys.x === kv.h.x;
      if (kuuluuTahan && !kv.aktiivinen) {
        kv.aktiivinen = true;
        if (kv.varmuusAjastin) { kv.varmuusAjastin.remove(false); kv.varmuusAjastin = null; }
        this.kaynnistaKiinteaVideoAlusta(kv);
        kv.varmuusAjastin = this.time.delayedCall(200, () => {
          kv.varmuusAjastin = null;
          if (kv.aktiivinen && kv.video.video.paused) this.kaynnistaKiinteaVideoAlusta(kv);
        });
      } else if (!kuuluuTahan && kv.aktiivinen) {
        kv.aktiivinen = false;
        if (kv.varmuusAjastin) { kv.varmuusAjastin.remove(false); kv.varmuusAjastin = null; }
        kv.video.stop();
        kv.video.setVisible(false);
      }
    });
  }

  // KIPINÄ (2.9.2026, "Creation of Adam" -idea) - pieni itsestään siivoutuva
  // valopurskaus RUUDUN suhteellisessa kohdassa (screen-space, scrollFactor:0,
  // depth kiinteiden kuvien YLÄPUOLELLA) - keskusympyrä + muutama satunnaiseen
  // suuntaan sinkoava kipinänsiru. EI mitään pysyvää tilaa, tuhoaa itsensä
  // tweenin valmistuttua.
  piirraKipina(kipina){
    const x = this.scale.width * (kipina.x != null ? kipina.x : 0.5);
    const y = this.scale.height * (kipina.y != null ? kipina.y : 0.5);
    const vari = kipina.vari != null ? kipina.vari : 0xcdf3ff;
    const kesto = kipina.kesto != null ? kipina.kesto : 700;
    const keskus = this.add.graphics();
    keskus.setScrollFactor(0);
    keskus.setDepth(250);
    keskus.fillStyle(vari, 1);
    keskus.fillCircle(0, 0, 7);
    keskus.x = x; keskus.y = y;
    this.tweens.add({ targets: keskus, scaleX: 9, scaleY: 9, alpha: 0, duration: kesto, ease: 'Cubic.easeOut', onComplete: () => keskus.destroy() });
    for (let i = 0; i < 10; i++) {
      const kulma = Math.random() * Math.PI * 2;
      const matka = 18 + Math.random() * 42;
      const siru = this.add.graphics();
      siru.setScrollFactor(0);
      siru.setDepth(250);
      siru.fillStyle(vari, 1);
      siru.fillCircle(0, 0, 1.5 + Math.random() * 2);
      siru.x = x; siru.y = y;
      this.tweens.add({ targets: siru, x: x + Math.cos(kulma) * matka, y: y + Math.sin(kulma) * matka, alpha: 0, duration: kesto * 0.85, ease: 'Cubic.easeOut', onComplete: () => siru.destroy() });
    }
  }

  // aaniraita (ks. esitys-2d-hahmot.js) - sama x-täsmäys-periaate kuin
  // paivitaVideot()/paivitaKiinteatKuvat(), mutta VIELÄ yksinkertaisempi:
  // ei suuntariippuvaista (ei ole mitään visuaalista tilaa säilytettävänä
  // kuten videon "viimeiseen frameen jää") - poistuttaessa (kumpaan
  // suuntaan tahansa) ääni pysähtyy ja kelautuu alkuun heti, valmiina
  // soimaan kokonaan uudelleen jos palataan takaisin.
  //
  // HTML5 <audio> EIKÄ Phaserin Sound Manager (8.9.2026, Taiteilijajärjestöt-
  // deckissä löytynyt bugi, Jarno: "when I click presentation on
  // esittajanakymä html, there is no sound" / "why video works, but not
  // audio? same principle!") - JUURISYY LÖYTYI: se EI OLLUT sama periaate.
  // Chrome (ja muut) sallii <video>/<audio>-elementtien autoplayn ILMAN
  // tuoretta käyttäjäelettä kun selaimen "Media Engagement Index" tälle
  // sivustolle on tarpeeksi korkea (paljon aiempaa toistoa) - EI VAADI
  // mitään erillistä käyttäjäelettä sillä KERTAA. Phaserin `this.sound.add/
  // play` KÄYTTÄÄ SUORAAN raakaa Web Audio API:n AudioContextia, jolla EI
  // OLE tätä poikkeusta - se vaatii AINA aidon käyttäjäeleen JUURI SILLÄ
  // sivulataus-kerralla, riippumatta sivun aiemmasta käyttöhistoriasta.
  // Juuri tämä ero (ei mikään koodivirhe kummassakaan) selitti miksi video
  // toimi etäohjattuna mutta ääni ei. Korjaus: aaniraita vaihdettu
  // tavalliseksi <audio>-elementiksi (ks. luontikohta ylempänä create():ssa),
  // joka saa NYT saman "media engagement" -poikkeuksen kuin video jo sai.
  // #aaniLukko-nappi (ks. HTML-kommentti) jää silti viimeiseksi varakeinoksi.
  // Ei sisältökohtainen, portattu Taiteilijajärjestöt-deckistä.
  paivitaAanet(uusiPysahdys){
    this.aanihahmot.forEach(ah => {
      const kuuluuTahan = uusiPysahdys.x === ah.h.x;
      if (kuuluuTahan && !ah.aktiivinen) {
        ah.aktiivinen = true;
        ah.sound.currentTime = 0;
        ah.sound.play().catch(() => { if (aaniLukkoEl) aaniLukkoEl.classList.add('nakyy'); });
      } else if (!kuuluuTahan && ah.aktiivinen) {
        ah.aktiivinen = false;
        ah.sound.pause();
        ah.sound.currentTime = 0;
      }
    });
  }

  // YLITYSHAHMOT (ks. esitys-2d-hahmot.js) - sama x-täsmäysperiaate kuin
  // paivitaAanet():ssä. Poistuttaessa (kumpaan suuntaan tahansa) ylitys
  // pysähtyy ja piiloutuu HETI (ei jää kesken näkyviin) - valmis alkamaan
  // kokonaan alusta jos pysähdykseen palataan. Itse liike lasketaan
  // update():ssa (this.time.now - alkuaika), ei täällä.
  paivitaYlitykset(uusiPysahdys){
    this.ylitykset.forEach(yl => {
      const kuuluuTahan = uusiPysahdys.x === yl.h.x;
      if (kuuluuTahan && !yl.aktiivinen && !yl.odottaa) {
        const aloita = () => {
          yl.odottaa = false;
          yl.viiveAjastin = null;
          yl.aktiivinen = true;
          yl.osumaAmmuttu = false; // osuma (ks. update()) saa laueta uudelleen joka kierroksella
          // vaiheindeksi/vaiheita (3.9.2026, Nera-armeija): kun maara>1,
          // jokainen instanssi käynnistetään AIKAISEMMIN alkuaikaan nähden,
          // tasan levitettynä koko `kesto`:n ylitse (indeksi 0 = jo puolivälissä
          // matkaa heti näkyviin tullessa jne.) - muuten kaikki `maara`
          // instanssia pörhähtäisivät samaan aikaan samasta reunasta, ei näyttäisi
          // "virralta" ollenkaan ensimmäisellä kierroksella. Myöhemmät kierrokset
          // (ks. update():n virtaa-silmukointi) pysyvät tästä lähtien tasavälisinä
          // luonnostaan, koska jokainen vain nollaa oman alkuaikansa erikseen.
          const kesto = (yl.h.kesto || 6) * 1000;
          const vaiheviive = yl.vaiheita > 1 ? (yl.vaiheindeksi / yl.vaiheita) * kesto : 0;
          yl.alkuaika = this.time.now - vaiheviive;
          yl.img.setVisible(true);
          if (yl.animaatioAvain) yl.img.play(yl.animaatioAvain);
        };
        // aloitusViive (VALINNAINEN, sekunteina) - 3.9.2026, Jarno ensin
        // "they could be more apart in beginning already, niw hard to see",
        // sitten korjaus "They could still start appearing from right" kun
        // ensimmäinen yritys (alkuaika taaksepäin, hyppäsi suoraan keskelle
        // matkaa) EI ollut mitä hän halusi. OIKEA käytös: hahmo pysyy
        // KOKONAAN piilossa/passiivisena `aloitusViive` sekuntia, ja
        // AKTIVOITUU VASTA SITTEN normaalisti reunasta (`aloita()` yllä,
        // täsmälleen sama koodi kuin viiveetön tapaus) - siis eri hahmot
        // ilmestyvät eri AIKOINA reunalta, eivät eri KOHDISTA radalla heti
        // alussa. Peruutetaan (viiveAjastin.remove) jos pysähdyksestä
        // poistutaan ENNEN kuin viive ehtii loppua - muuten hahmo voisi
        // pörähtää näkyviin väärällä pysähdyksellä.
        const kasinViiveMs = yl.h.aloitusViive != null ? yl.h.aloitusViive * 1000 : 0;
        if (kasinViiveMs > 0) {
          yl.odottaa = true;
          yl.viiveAjastin = this.time.delayedCall(kasinViiveMs, aloita);
        } else {
          aloita();
        }
      } else if (!kuuluuTahan && (yl.aktiivinen || yl.odottaa)) {
        yl.aktiivinen = false;
        yl.odottaa = false;
        if (yl.viiveAjastin) { yl.viiveAjastin.remove(false); yl.viiveAjastin = null; }
        yl.img.setVisible(false);
      }
    });
  }

  // vaihtaa aktiivisen opashahmon SAMAAN x-sijaintiin (ei teleporttaa/
  // nollaa kävelyä) - tuhoaa vanhan spriten ja luo uuden, koska eri
  // hahmoilla on eri origin/tekstuurit (ei voi vain vaihtaa tekstuuria
  // saman spriten päällä niin että origin pysyisi oikeana). Kutsutaan
  // näppäimistä (ks. addEventListener('keydown',...) alempana) - TÄMÄ ON
  // TEKNINEN PERUSTA hahmon vaihtamiselle, ei vielä yleisöäänestys-UI:ta
  // (Jarno: "plan to choose character" - äänestysmekanismi on oma
  // päätöksensä myöhemmin, tämä antaa vaihtokyvyn valmiiksi).
  vaihdaHahmo(avain){
    if (!this.hahmo || avain === this.hahmoAvain) return;
    if (!HAHMOVAIHTOEHDOT.some(h => h.avain === avain)) return;
    const x = this.hahmo.x;
    const flipX = this.hahmo.flipX;
    this.hahmo.destroy();
    this.hahmoAvain = avain;
    this.luoHahmo(avain, x, this.scale.height);
    this.hahmo.flipX = flipX;
    this.sovitaTaustatRuutuun(this.scale.width, this.scale.height);
    if (hahmoNimiEl) { hahmoNimiEl.textContent = this.hahmoTiedot(avain).nimi; hahmoNimiEl.classList.add('nakyy'); clearTimeout(this._hahmoNimiTimeout); this._hahmoNimiTimeout = setTimeout(() => hahmoNimiEl.classList.remove('nakyy'), 2500); }
  }

  // rakentaa taustakerrokset (TileSprite per kerros) annetulle kohtaukselle.
  // Erotettu create():sta jotta samaa logiikkaa voi käyttää vaihdaKohtaus():ssa
  // kun kettu kävelee toisen kohtauksen xAlueelle (ks. update()).
  rakennaTausta(kohtaus, leveys, korkeus){
    const kerrokset = [];
    kohtaus.kerrokset.forEach((k, i) => {
      const avain = kohtaus.nimi + ':' + i + ':' + k.tiedosto; // ks. preload():n kommentti (kansio-ohitus)
      const lahdekorkeus = this.textures.get(avain).getSourceImage().height;
      const ts = this.add.tileSprite(0, 0, leveys, korkeus, avain);
      ts.setOrigin(0, 0);
      ts.setScrollFactor(0);
      // Eksplisiittinen syvyys array-indeksin mukaan (0=taaimmainen) - UUSI
      // 1.9.2026, ei muuta mitään olemassa olevaa renderöintiä (sama
      // järjestys kuin ennenkin implisiittisesti lisäysjärjestyksen kautta),
      // mutta mahdollistaa nyt HAHMOKERROKSET-elementtien ASETTUMISEN
      // NÄIDEN VÄLIIN syvyysSuhde-kentällä (ks. muistio §38 jatko 6+8).
      ts.setDepth(i);
      if (k.blendMode === 'ADD') ts.setBlendMode(Phaser.BlendModes.ADD);
      if (k.alpha != null) ts.setAlpha(k.alpha);
      // ajelehdintaNopeus (VALINNAINEN, px/s): kerros liikkuu TÄTÄ VAUHTIA
      // AINA, riippumatta liikkuuko kamera ollenkaan - Jarnon pyyntö
      // 1.9.2026: "can cars move even then when not scrolling with clicker
      // to forward? So it is more natural?". Ilman tätä kaikki liike
      // (myös autot) oli 100% sidottu kameran scrollX:ään - pysähdyksellä
      // seisoessa MIKÄÄN ei liikkunut, mikä ei tunnu luonnolliselta autoille/
      // pilville/vastaavalle jatkuvasti liikkuvalle asialle (TOISIN kuin
      // esim. rakennukset, jotka luonnostaan PYSYVÄT paikallaan). Lisätään
      // TAVALLISEN parallaksisiirtymän PÄÄLLE (ks. update()), ei korvaa sitä.
      // sykeNopeus (VALINNAINEN, sykettä/s): kerroksen alpha sykkii/vilkkuu
      // jatkuvasti (siniaalto) - Jarnon pyyntö 1.9.2026 "Traffic-light/
      // window glow layers could also pulse/flicker". satunnaisVaihe
      // (arvottu KERTAALLEEN per kerros) estää useamman samassa
      // kohtauksessa olevan valokerroksen sykkimästä täsmälleen samassa
      // tahdissa (esim. close-yo:n 2 lights-kerrosta) - näyttää enemmän
      // "eri ikkunat vilkkuvat eri tahtiin" kuin "koko kaupunki hengittää".
      kerrokset.push({
        obj: ts, scrollFactor: k.scrollFactor, lahdekorkeus,
        ajelehdintaNopeus: k.ajelehdintaNopeus || 0, omaSiirtyma: 0,
        sykeNopeus: k.sykeNopeus || 0, sykeAmplitudi: k.sykeAmplitudi != null ? k.sykeAmplitudi : 0.3,
        perusAlpha: k.alpha != null ? k.alpha : 1, satunnaisVaihe: Math.random() * Math.PI * 2
      });
    });
    return kerrokset;
  }

  // vaihtaa aktiivisen kohtauksen kesken pelin - kutsutaan update():sta kun
  // kettu on kävellyt ulos nykyisen kohtauksen xAlueelta. Tuhoaa vanhat
  // taustakerros-TileSpritet (muuten ne jäävät muistiin/näkyviin turhaan) ja
  // rakentaa uudet, piirtää taivaan uudelleen (väri/kuu voi vaihtua tai
  // hävitä kokonaan) ja päivittää credit-tekstin. EI väliaikaista mustaa
  // ruutua/ristikkohäivytystä toistaiseksi - suora vaihto, koska tausta on
  // joka tapauksessa suurelta osin ruudun ulkopuolella juuri rajan
  // ylityshetkellä (kamera ehtii "pyyhkäistä" vaihdoksen yli parissa
  // ruudunpäivityksessä, ei näytä nykäisevältä käytännössä).
  vaihdaKohtaus(uusiKohtaus){
    // RISTIKKOHÄIVYTYS (Jarno 1.9.2026: "figure out can we combine
    // different scenes ... so we can seaminly move from scene to another")
    // - vanha dokumentoitu perustelu suoralle vaihdolle ("tausta on
    // suurelta osin ruudun ulkopuolella juuri rajan ylityshetkellä") piti
    // paikkansa VANHOILLA isoilla (620-3000 yks.) kohtauksilla, mutta ei
    // enää uusilla 400 yks. leveillä kaupunkikohtauksilla - vaihdot
    // tapahtuvat paljon useammin JA kohtaukset eroavat tunnelmaltaan
    // enemmän (esim. päivä->yö), joten suora vaihto alkoi näyttää
    // nykäykseltä. VANHAT taustakerrokset EIVÄT tuhoudu heti - ne jäävät
    // this.poistuvatKerrokset-listaan, häivytetään pois (samalla vielä
    // päivittyen update():ssa, ks. sen kommentti) ja tuhotaan vasta
    // häivytyksen päätyttyä. UUDET kerrokset aloittavat alpha:0:sta ja
    // häivytetään sisään OMAAN kohdealphaansa (EI aina 1 - esim. ADD-
    // blendatut "Lights"-kerrokset ovat esim. alpha:0.55).
    const vanhatKerrokset = this.taustakerrokset;
    // depth-siirto: vanhat kerrokset saavat ison NEGATIIVISEN lisän niin
    // että ne piirtyvät AINA kokonaan uusien kerrosten TAKANA häivytyksen
    // ajan - ilman tätä eri-indeksiset vanha/uusi-kerrokset limittyisivät
    // syvyysjärjestyksessä keskenään (esim. vanha kerros 3 uuden kerroksen
    // 2 ja 4 välissä) ja näyttäisivät sekavalta rasteroinnilta sen sijaan
    // että uusi kohtaus selvästi "peittäisi" vanhan häivytyksen aikana.
    vanhatKerrokset.forEach(t => t.obj.setDepth(t.obj.depth - 1000));
    this.kohtaus = uusiKohtaus;

    if (this.kuuGrafiikka) { this.kuuGrafiikka.destroy(); this.kuuGrafiikka = null; }
    this.kuuGrafiikka = uusiKohtaus.taivas?.kuu ? this.add.graphics().setScrollFactor(0).setDepth(-999) : null;
    if (uusiKohtaus.taivas) this.piirraTaivas(uusiKohtaus.taivas, this.scale.width, this.scale.height);
    else this.taivasGrafiikka.clear();
    this.piirraSiluetit(uusiKohtaus.siluetit, this.scale.width, this.scale.height);
    this.piirraValokeila(uusiKohtaus.valokeila, this.scale.width, this.scale.height);
    this.piirraAmbienssit(uusiKohtaus.ambienssit, this.scale.width, this.scale.height);

    this.taustakerrokset = this.rakennaTausta(uusiKohtaus, this.scale.width, this.scale.height);
    this.sovitaTaustatRuutuun(this.scale.width, this.scale.height);

    // SYVYYSPORRASTETTU häivytys (Jarno 1.9.2026: "Some layers from
    // previous chapter, some from new... this is kind of levels on game" -
    // vastaus kysymykseen "Could that work?"). Tasainen kaikki-kerrokset-
    // yhtäaikaa-häivytys (vanha HAIVYTYS_MS-versio) vaihdettu PORRASTETTUun:
    // ETUALAN kerrokset (korkea array-indeksi = lähellä kameraa) vaihtuvat
    // ENSIN (uusi ilmestyy heti, vanha katoaa heti), TAUSTAN kerrokset
    // (matala indeksi, esim. taivas/kaukaiset vuoret) vaihtuvat VIIMEISENÄ
    // (vanha taustaus JÄÄ NÄKYVIIN pidempään, uusi tausta tulee vasta
    // lopuksi). Lopputulos hetkeksi: VANHAN kohtauksen tausta + UUDEN
    // kohtauksen etuala SAMAAN AIKAAN ruudulla - juuri "osa edellisestä,
    // osa uudesta" -vaikutelma, ei tasainen ristikkohäivytys.
    const KESTO = 500, PORRASTUS = 450;
    const viive = (i, n) => n > 1 ? (1 - i / (n - 1)) * PORRASTUS : 0;
    const uusiN = this.taustakerrokset.length, vanhaN = vanhatKerrokset.length;
    this.taustakerrokset.forEach((t, i) => {
      // sykkivät kerrokset EIVÄT häivyty sisään - update() omistaa niiden
      // alphan kokonaan (siniaaltosykintä), tween kilpailisi saman
      // ominaisuuden kanssa joka framessa jos molemmat yrittäisivät
      // asettaa .alphaa. Näkyvät siis heti täydessä sykinnässään kun
      // kohtaus vaihtuu - pieni yksityiskohta, ei haittaa.
      if (t.sykeNopeus) return;
      const kohdeAlpha = t.obj.alpha;
      t.obj.setAlpha(0);
      this.tweens.add({ targets: t.obj, alpha: kohdeAlpha, duration: KESTO, delay: viive(i, uusiN) });
    });
    this.poistuvatKerrokset = this.poistuvatKerrokset || [];
    this.poistuvatKerrokset.push(vanhatKerrokset);
    vanhatKerrokset.forEach((t, i) => {
      this.tweens.add({ targets: t.obj, alpha: 0, duration: KESTO, delay: viive(i, vanhaN) });
    });
    // tuhoaminen VASTA kun PISIN yksittäinen tween (taustakerros, viive
    // PORRASTUS asti) on ehtinyt valmistua - muuten taustakerros
    // katkeaisi kesken häivytyksensä.
    this.time.delayedCall(PORRASTUS + KESTO, () => {
      vanhatKerrokset.forEach(t => t.obj.destroy());
      const idx = this.poistuvatKerrokset.indexOf(vanhatKerrokset);
      if (idx !== -1) this.poistuvatKerrokset.splice(idx, 1);
    });

    creditEl.textContent = uusiKohtaus.attribuutio || '';
  }

  // sovittaa taustakerrokset (ja ketun korkeuden) mihin tahansa ruudun
  // kokoon/kuvasuhteeseen - kutsutaan sekä create():ssa että aina kun
  // Phaser.Scale.RESIZE ilmoittaa koon muuttuneen (koko näyttö, eri
  // näyttö/projektori, ikkunan koon muutos)
  sovitaTaustatRuutuun(leveys, korkeus){
    // TAUSTAN_ZOOM > 1: näytetään vain ALAOSA lähdekuvasta (metsä/maa),
    // ei koko taivasta - vähemmän hukkatilaa ylhäällä, Jarnon pyynnöstä.
    // Kuva skaalataan isommaksi kuin ruutu vaatisi ja tilePositionY
    // siirtää näkyvän ikkunan alaspäin (=poistaa taivasta ylhäältä),
    // maa/nurmi pysyy aina ruudun pohjassa koska ylimäärä otetaan
    // kokonaan ylhäältä, ei alhaalta.
    //
    // HUOM (kuu/taivasobjektit): kokeiltiin aiemmin madaltaa TAUSTAN_ZOOMia
    // (1.20, 1.02) jotta kuu mahtuisi "aidosti avoimeen taivaaseen" latvuston
    // YLÄPUOLELLE - Jarno ei halunnut tätä: hän haluaa takaisin tiiviin
    // rajauksen (ei taivasta latvuston yläpuolella ollenkaan) JA kuun
    // näkyvän RUNKOJEN TAKAA keskikorkeudella, Limbo/Inside-tyyliin (ei
    // ylhäällä avotaivaalla). `TAUSTAN_ZOOM` on siis taas 1.45, ja kuu
    // (`taivas.kuu.y` alla, `esitys-2d-kohtaukset.js`) on siirretty puoliväliin
    // ruutua - se piirretään edelleen kuvakerrosten TAKANA
    // (`kuuGrafiikka.setDepth(-999)`) joten rungot peittävät sen luonnollisesti
    // paikoin, ja aukot runkojen välissä näyttävät kuun läpi - se ON haluttu
    // efekti, ei bugi.
    const TAUSTAN_ZOOM = 1.45;
    // taustaKorkeusSuhde: valinnainen per-kohtaus kenttä (oletus 1.0 = koko
    // ruudun korkeus, kuten metsäpaketti). Tarvittiin kun "Parallax
    // Industrial Pack"in lähdekuvat osoittautuivat PALJON pienemmiksi
    // (104-160px) kuin metsäpaketin 793px - sama "yksi kuva = koko ruudun
    // korkeus" -kaava olisi suurentanut ne ~12x, näyttäen täysin
    // lähikuvana/pikselöityneenä (Jarno: "it does not look good", ei
    // suoraan tästä mutta sama juurisyy). Pienemmällä suhteella tausta
    // ankkuroituu ruudun POHJAAN (kaupunki näkyy vain alaosassa) ja loppu
    // taivaasta jää proseduraaliselle liu'ulle - luonnollisempi tapa
    // näyttää pieniresoluutioista pikselitaidetta täyttämättä koko ruutua.
    const korkeusSuhde = (this.kohtaus.taustaKorkeusSuhde != null) ? this.kohtaus.taustaKorkeusSuhde : 1.0;
    const omaKorkeus = korkeus * korkeusSuhde;
    // zoom: VALINNAINEN per-kohtaus ohitus TAUSTAN_ZOOMille (3.9.2026, Jarno:
    // "part of top castle is not visible, it cuts?"). TAUSTAN_ZOOM leikkaa
    // AINA saman ~31% jokaisen kerroksen OMASTA yläreunasta pois (ks. yllä)
    // - taustaKorkeusSuhde EI vaikuta TÄHÄN osuuteen mitenkään, se vain
    // skaalaa koko lopputulosta, joten pelkkä taustaKorkeusSuhteen nosto ei
    // olisi tuonut leikattua sisältöä takaisin näkyviin. Linnapakan monessa
    // kerroksessa (esim. "6-castle.png") on OIKEAA sisältöä (tornin huippu)
    // juuri siinä 31%:ssa joka normaalisti leikataan pois olettaen sen
    // olevan "vain tyhjää taivasta" - toimi hyvin metsäpakalla mutta ei
    // linnapakalla. zoom:1 poistaa leikkauksen KOKONAAN kyseiseltä
    // kohtaukselta (koko 256px-kehys näkyy, ei mitään piiloon) - käytössä
    // kaikissa 9 linnakohtauksessa nyt kun niiden oma pelkkä-taivas-kerros
    // on jo poistettu (ks. esitys-2d-kohtaukset.js:n kommentti) - zoomin
    // AINOA hyöty (piilottaa tylsä litteä taivas) ei enää päde niille.
    const zoom = (this.kohtaus.zoom != null) ? this.kohtaus.zoom : TAUSTAN_ZOOM;
    this.taustakerrokset.forEach(t => {
      t.obj.setSize(leveys, omaKorkeus);
      t.obj.y = korkeus - omaKorkeus; // ankkuroi pohjaan (origin on (0,0), ks. rakennaTausta)
      const pystySkaala = (omaKorkeus / t.lahdekorkeus) * zoom;
      t.obj.setTileScale(pystySkaala, pystySkaala);
      t.obj.tilePositionY = t.lahdekorkeus * (zoom - 1) / zoom;
    });
    if (this.hahmo) {
      // sama pystySkaala-kaava kuin taustakerroksilla (lähdekorkeus 793,
      // sama kuvapakan kerrosten korkeus) - pitää hahmon koon AINA samassa
      // suhteessa taustaan riippumatta kummasta hahmosta on kyse, ks.
      // huomio create():ssa. mittakaavaSuhde on per-hahmo (HAHMOVAIHTOEHDOT).
      const omaPystySkaala = (korkeus / 793) * TAUSTAN_ZOOM;
      this.hahmo.setScale(omaPystySkaala * this.hahmoTiedot(this.hahmoAvain).mittakaavaSuhde);
      this.hahmo.y = korkeus * this.HAHMON_Y_SUHDE;
    }
  }

  // piirtää proseduraalisen taivaan (liuku + kuu/aurinko) - koodilla, ei
  // kuvatiedostolla. Kutsutaan create():ssa ja aina resize:n yhteydessä
  // koska Graphics-objektit pitää piirtää uudelleen kun koko muuttuu.
  piirraTaivas(taivas, leveys, korkeus){
    this.taivasGrafiikka.clear();
    this.taivasGrafiikka.fillGradientStyle(taivas.ylavari, taivas.ylavari, taivas.alavari, taivas.alavari, 1);
    this.taivasGrafiikka.fillRect(0, 0, leveys, korkeus);

    if (taivas.kuu && this.kuuGrafiikka) {
      // Jarno 1.9.2026: "moon and sun shoudl move during whole
      // presentation. in beginning left, midlle in middle and in end on
      // right?" - VÄRI/KOKO (vari/sade) tulevat yhä kunkin kohtauksen
      // omasta taivas.kuu-asetuksesta (lämmin=aurinko päiväkohtauksissa,
      // kylmä=kuu yökohtauksissa, ks. esitys-2d-kohtaukset.js), mutta
      // SIJAINTI (x/y) EI enää ole kohtauskohtainen kiinteä arvo - piirretty
      // nyt PAIKALLISEEN origoon (0,0) ja siirretään joka framessa
      // update():ssa KOKO ESITYKSEN etenemän mukaan (ks. sen kommentti) -
      // sama taivaankappale "kulkee" koko esityksen halki vasemmalta
      // oikealle, ei hyppää paikasta toiseen kohtausten mukana.
      const k = taivas.kuu;
      this.kuuGrafiikka.clear();
      // pehmeä hehku: muutama yhä läpinäkyvämpi ympyrä kuun ympärillä
      this.kuuGrafiikka.fillStyle(k.vari, 0.10); this.kuuGrafiikka.fillCircle(0, 0, k.sade * 2.6);
      this.kuuGrafiikka.fillStyle(k.vari, 0.18); this.kuuGrafiikka.fillCircle(0, 0, k.sade * 1.8);
      this.kuuGrafiikka.fillStyle(k.vari, 0.95); this.kuuGrafiikka.fillCircle(0, 0, k.sade);
      // AINA scrollFactor 0 (kokonaan ruutuun sidottu) - EI enää k.scrollFactor-
      // kenttää (vanha per-kohtaus arvo, esim. 0.03). Nyt kun sijainti
      // asetetaan KÄSIN joka framessa update():ssa (globaali esityksen
      // etenemä), MIKÄ TAHANSA nollasta poikkeava natiivi scrollFactor
      // kertoisi itsensä kameran KOKO esityksen matkalta kertyneellä,
      // hyvin suurella scrollX-arvolla ja ajautuisi käsin lasketun
      // sijainnin pois paikaltaan - sama tunnettu ongelmaluokka kuin
      // muualla tässä moottorissa (ks. muistio), vältetty käyttämällä
      // tässä AINA arvoa 0.
      this.kuuGrafiikka.setScrollFactor(0);
    }
  }

  // piirtää litteät siluettimuodot (esim. "koodi-teollisuus-inside" -
  // kohtauksen rakennukset, tai "teollisuus-ansimuz-inside"-kohtauksen
  // katukaista) - kokonaan koodia, ei kuvatiedostoja. Jokainen muoto on
  // suorakulmio jonka x/y/w/h ovat RUUDUN leveys/korkeus-SUHTEITA (ei
  // kiinteitä pikseleitä) jotta asettelu skaalautuu automaattisesti eri
  // ruutukoilla/kuvasuhteilla (sama periaate kuin taivas.kuu:ssa).
  //
  // TÄRKEÄ KORJAUS (Jarno lisäsi katukaistan, joka ei näkynyt MISSÄÄN
  // vaikka kaikki asetukset olivat oikein - depth, visible, jne): natiivi
  // Phaser setScrollFactor(sf) EI toimi näille "ruudun murto-osina"
  // piirretyille muodoille kuin hyvin PIENillä sf-arvoilla (esim. kuun
  // 0.03 - lähes kokonaan kamerakiinnitetty, pieni ajautuma). Suurilla
  // arvoilla (esim. katukaistan 0.90, lähes "seuraa maailmaa") Phaser
  // tulkitsee muodon paikalliset koordinaatit (0..leveys) MAAILMAN
  // koordinaateiksi - koska kamera on jo vierinyt kauas (scrollX voi olla
  // tuhansia), muoto piirtyy KAUAS NÄKYMÄN ULKOPUOLELLE eikä koskaan
  // näy. Sama bugi joka koskee TileSpritejä (siksi ne käyttävät
  // setScrollFactor(0) + käsin päivitettävää tilePositionX:ää, ei
  // natiivia scrollFactoria) - siluetit tarvitsevat NYT saman ratkaisun:
  // AINA setScrollFactor(0) (kamerakiinnitetty), ja `update()` siirtää
  // koko Graphics-olion x-sijaintia käsin (`g.x = -cam.scrollX * kerroin`)
  // joka ruudulla, tallennettu kerroin `g.parallaksiKerroin`-ominaisuuteen.
  //
  // HUOM: Phaserin setScrollFactor koskee KOKO Graphics-oliota, ei
  // yksittäistä piirrettyä muotoa - siksi muodot RYHMITELLÄÄN
  // parallaksikertoimen+syvyyden mukaan ja jokainen ryhmä saa oman
  // Graphics-olionsa. `syvyys`-kenttä (oletus -998, TAUSTAKERROSTEN eli
  // TileSpritejen [depth 0] TAKANA) on VALINNAINEN per muoto - tarvittiin
  // kun teollisuuskohtaukseen lisättiin koodilla piirretty katukaista:
  // sen PITÄÄ näkyä kuvakerrosten EDESSÄ (esim. depth 50, ketun [100]
  // takana mutta rakennusten [0] edessä), muuten se jää piiloon
  // läpinäkymättömien rakennuskuvien alle (Jarno: "there is no ground.
  // Fox has to have floor?", 1.9.2026).
  piirraSiluetit(siluetit, leveys, korkeus){
    (this.siluettiGrafiikat || []).forEach(g => g.destroy());
    this.siluettiGrafiikat = [];
    if (!siluetit || !siluetit.length) return;
    const ryhmat = new Map();
    siluetit.forEach(s => {
      const sf = s.scrollFactor != null ? s.scrollFactor : 1;
      const syvyys = s.syvyys != null ? s.syvyys : -998;
      const avain = sf + '|' + syvyys;
      if (!ryhmat.has(avain)) ryhmat.set(avain, { sf, syvyys, muodot: [] });
      ryhmat.get(avain).muodot.push(s);
    });
    ryhmat.forEach(({ sf, syvyys, muodot }) => {
      const g = this.add.graphics().setScrollFactor(0).setDepth(syvyys);
      g.parallaksiKerroin = sf;
      // VIITE-scrollX talteen NYT (piirtohetkellä) - update() laskee
      // siirtymän suhteessa TÄHÄN, ei absoluuttisesta scrollX=0:sta (joka
      // vastaisi koko esityksen alkua, ei tämän kohtauksen alkua). Ilman
      // tätä muoto "korjaisi" pois koko siihenastisen kameran matkan
      // (voi olla tuhansia pikseleitä pitkälle kohtaukselle) ja piirtyisi
      // kauas näkymän ulkopuolelle - täsmälleen se mitä tapahtui kun
      // katukaista ei näkynyt lainkaan (Jarno: "there is no ground"),
      // vaikka kaikki muu (depth, visible, väri) oli oikein.
      g.parallaksiViite = this.cameras.main.scrollX;
      muodot.forEach(s => {
        g.fillStyle(s.vari, s.alpha != null ? s.alpha : 1);
        g.fillRect(leveys * s.x, korkeus * s.y, leveys * s.w, korkeus * s.h);
      });
      this.siluettiGrafiikat.push(g);
    });
  }

  // piirtää yhden vinon valokeilan (nelikulmio pisteestä x1,y1 pisteeseen
  // x2,y2, annetulla leveydellä) - INSIDE-referenssikuvan tunnusomainen
  // yksittäinen valonsäde sumussa. Koordinaatit taas ruudun leveys/
  // korkeus-suhteina, leveys myös suhteessa ruudun leveyteen. Sama
  // setScrollFactor(0)+käsin päivitys -korjaus kuin piirraSiluetit():ssä
  // (ks. sen kommentti) - natiivi scrollFactor(0.35) siirsi tämänkin
  // pois näkyvistä kun kamera oli vierinyt pidemmälle.
  piirraValokeila(valokeila, leveys, korkeus){
    if (this.valokeilaGrafiikka) { this.valokeilaGrafiikka.destroy(); this.valokeilaGrafiikka = null; }
    if (!valokeila) return;
    const v = valokeila;
    const x1 = leveys * v.x1, y1 = korkeus * v.y1;
