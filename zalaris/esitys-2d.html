<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<!-- EI VÄLIMUISTIA tälle sivulle itselleen - Jarno raportoi 1.9.2026 "i did
     not see all them, or your animated layers" senkin JÄLKEEN kun uudet
     kohtaukset/animaatiot oli jo lisätty koodiin. Syy: esitys-data.js/
     esitys-2d-kohtaukset.js/hahmot.js/hahmovaihtoehdot.js LADATAAN aina
     ?t=Date.now()-välimuistinpoistolla (ks. alempi <script>-lohko), mutta
     TÄMÄ SIVU ITSE (esitys-2d.html) EI ollut - eli moottorin OMA koodi
     (esim. tämä crossfade/animoitu-kerros-ominaisuus) saattoi jäädä
     selaimen välimuistiin vaikka data näytti tuoreelta. Sama luokka bugia
     kuin Cmd+R-ongelma aiemmin, eri syy. Nämä kolme meta-tagia estävät
     selainta säilömästä TÄTÄ vastausta ollenkaan - normaali selaimen oma
     reload-nappi riittää nyt aina, ei tarvitse muistaa kovaa uudelleen-
     latausta (Cmd+Shift+R) erikseen. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Esitys 2D</title>
<style>
  html,body{ height:100%; margin:0; background:#0a0e14; overflow:hidden; font-family:Georgia,Garamond,"Times New Roman",serif; }
  #peli{ position:fixed; inset:0; }
  #peli canvas{ display:block; width:100%; height:100%; }

  /* Tekstin sijainti: kaksi riippumatonta akselia, asetetaan esitys-data.js:n
     kentillä per pysähdys - pysty:'yla'|'keski'|'ala' (oletus 'yla') ja
     puoli:'vasen'|'keski'|'oikea' (oletus 'vasen'). Tekstin TASAUS (text-align)
     seuraa aina puoli-arvoa automaattisesti (vasen->left, keski->center,
     oikea->right) - Jarnon pyyntö, ei erillistä tasaus-kenttää. */
  #tekstikerros{ position:fixed; inset:0; z-index:5; pointer-events:none; display:flex; padding:6vh 6vw; box-sizing:border-box; }
  #tekstikerros.v-yla{ align-items:flex-start; }
  #tekstikerros.v-keski{ align-items:center; }
  #tekstikerros.v-ala{ align-items:flex-end; }
  #tekstikerros.h-vasen{ justify-content:flex-start; }
  #tekstikerros.h-keski{ justify-content:center; }
  #tekstikerros.h-oikea{ justify-content:flex-end; }
  #teksti.h-vasen{ text-align:left; }
  #teksti.h-keski{ text-align:center; }
  #teksti.h-oikea{ text-align:right; }
  /* Tekstin koko-asteikko 1-10 (esitys-data.js:n "koko"-kenttä per pysähdys,
     oletus 3 jos ei annettu - nykyinen "pieni" koko vastaa suunnilleen
     arvoa 1). --koko asetetaan JS:stä (naytaTeksti()). 10 = otsikko täyttää
     ison osan ruudusta, 1 = nykyinen pieni koko. Kaava: rem-pohja + koko *
     (vw-osuus + vh-osuus), jotta koko skaalautuu sekä leveyden että
     korkeuden mukaan eikä vain toiseen suuntaan. */
  /* overflow-wrap (6.9.2026, ks. #diffuusio:n viereisen max-width-korjauksen
     kommentti) - pitkät suomalaiset yhdyssanat ("säännönmukaisuuksia",
     "kielioppisääntöjen") EIVÄT muuten katkea, vaan ylittävät kapean
     max-width:n näkyvästi - tämä pakottaa katkon tarvittaessa KESKELTÄ
     sanaa sen sijaan että teksti valuisi ulos laatikosta/toisen elementin alle. */
  #teksti{ --koko:3; max-width:min(92vw, calc(38vw + var(--koko) * 5.4vw)); overflow-wrap:break-word; opacity:0; transform:translateY(14px); transition:opacity .5s ease, transform .5s ease, max-width .3s ease; text-shadow:0 3px 18px rgba(0,0,0,.85), 0 1px 0 rgba(0,0,0,.6); }
  /* kortti (VALINNAINEN, esitys-data.js:n kenttä, 3.9.2026 - Jarno kysyi
     miten varmistaa luettavuus vaihtelevilla taustoilla). ENSIMMÄINEN
     YRITYS oli YKSI ISO pyöristetty laatikko koko #teksti:n ympärille -
     HYLÄTTY, näytti "laatikon näköiseltä" ja jätti paljon tyhjää tilaa
     laatikon sisään. Jarno näytti esimerkkikuvan OIKEASTA tyylistä: musta
     tausta TIIVIISTI JOKAISEN TEKSTIRIVIN ympärillä (kuten tekstitys/
     karaoke), EI yhtä isoa laatikkoa koko kappaleelle. `.hl` (kietoo
     naytaTeksti():ssä otsikon/leipätekstin sisällön) on display:inline +
     box-decoration-break:clone - inline-elementti saa taustan/paddingin
     VAIN siihen missä teksti oikeasti on JOKAISELLA rivillä erikseen kun
     rivitys tapahtuu (clone toistaa vasemman/oikean paddingin joka
     rivinpätkälle, muuten vain ensimmäinen/viimeinen rivi saisi sen).
     .otsikko/.leipa/.leipa-rivi PYSYVÄT omina display:block-riveinään
     (pinoutuvat edelleen allekkain normaalisti) - VAIN niiden SISÄLLÄ
     oleva .hl-span saa tämän rivikohtaisen taustan. */
  /* padding .16em -> .08em pystysuunnassa (6.9.2026, Jarno: "still some
     overlapping, but don't want to make space between lines too high") -
     rivien VÄLIIN jäävä tila tulee sekä line-height:sta ETTÄ tämän laatikon
     omasta pystypaddingista yhdessä; koska line-height (1.38) ei saa enää
     kasvaa, pienennetään sen sijaan laatikon OMAA tilantarvetta - sama
     lopputulos (ei päällekkäisyyttä) ilman että rivien väli kasvaa. */
  #teksti .hl{ display:inline; background:rgba(54,54,54,.75); box-decoration-break:clone; -webkit-box-decoration-break:clone; padding:.08em .4em; border-radius:.14em; }
  /* rivien väliin jäävä tila (4.9.2026, Jarno screenshot: "if text goes to
     different line, its under box goes over top text") - .hl:n oma .16em
     pysty-padding tarvitsee TILAA rivien VÄLIIN, muuten seuraavan rivitetyn
     pätkän laatikko työntyy edellisen päälle (varsinkin .otsikko:n tiiviillä
     1.08 line-height:lla - lähes ei tilaa ollenkaan kahden rivin väliin).
     KOSKEE VAIN kortti:true-lohkoja (:has(.hl) - sama "ei omaa luokkaa,
     .hl hoitaa kaiken" -periaate kuin yllä olevassa kommentissa) - tavallinen
     (kortti:false) teksti pysyy koskemattomana tiiviine rivivälilleen. */
  #teksti .otsikko:has(.hl), #teksti .leipa:has(.hl), #teksti .lahde:has(.hl){ line-height:1.38; }
  #teksti.nakyy{ opacity:1; transform:translateY(0); }
  #teksti .otsikko{ font-size:calc(1rem + var(--koko) * (0.4vw + 0.6vh)); font-weight:800; line-height:1.08; letter-spacing:-.01em; margin-bottom:.3em; }
  #teksti .leipa{ font-size:calc(0.6rem + var(--koko) * (0.19vw + 0.28vh)); font-weight:600; line-height:1.35; }
  /* Jarno 6.9.2026: "when there is otsikko, then teksti - keep otsikko that
     color what it is now, and change teksti to white. If there is just
     teksti with no otsikko, keep as it is." - VAIN kun SAMALLA pysähdyksellä
     on sekä otsikko ETTÄ teksti, teksti pakotetaan valkoiseksi RIIPPUMATTA
     savy-kentästä - otsikko pitää oman savy-värinsä ennallaan (ei kosketa).
     :has()-tekniikka, sama periaate kuin yllä olevalla .hl-rivikorkeus-
     korjauksella - EI vaadi mitään muutoksia esitys-data.js:ään, koskee
     automaattisesti KAIKKIA (myös tulevia) otsikko+teksti-yhdistelmiä.
     Pelkkä teksti (ei otsikkoa samalla pysähdyksellä) EI osu tähän sääntöön
     - pysyy savy-värisenä kuten ennenkin. */
  #teksti:has(.otsikko) .leipa{ color:#f6efe4; }
  /* .leipa-rivi: VAIHEITTAIN paljastuva teksti (Jarno 3.9.2026, x:2790
     "Artificial Intelligence, 1956" - halusi neljä lausetta esiin YKSI
     KERRALLAAN paikoillaan pysyen [KERTYVÄSTI, ei korvaten], EI koko
     kappaletta kerralla). Sama .leipa-fonttikoko peritään suoraan (ei omaa
     font-size-riviä), vain oma näkyvyys/liuku - ks. naytaTeksti():n
     Array.isArray(p.teksti)-haara. */
  #teksti .leipa-rivi{ opacity:0; transform:translateY(8px); transition:opacity .5s ease, transform .5s ease; margin-bottom:.4em; }
  #teksti .leipa-rivi.nakyy{ opacity:1; transform:translateY(0); }
  /* vertailu: kaksipalstainen vertailu (4.9.2026, x:12840 "kilpikonna vs.
     jänis" -kuva, ks. esitys-data.js:n vertailu-kentän kommentti). Tarvitsee
     enemmän leveyttä kuin tavallinen otsikko/teksti, siksi oma max-width
     :has():lla (sama tekniikka kuin #teksti .hl-rivikorkeuskorjauksella
     yllä) - ei riko --koko-pohjaista leveyttä muille pysähdyksille. */
  #teksti:has(.vertailu){ max-width:min(92vw, 78vw); }
  #teksti .vertailu{ display:grid; grid-template-columns:1fr 1fr; column-gap:2.4em; row-gap:.7em; width:100%; }
  #teksti .vertailu-otsikko{ font-size:calc(1rem + var(--koko) * (0.32vw + 0.48vh)); font-weight:800; text-align:center; margin-bottom:.2em; opacity:0; transform:translateY(8px); transition:opacity .5s ease, transform .5s ease; }
  #teksti .vertailu-rivi{ font-size:calc(0.5rem + var(--koko) * (0.17vw + 0.25vh)); font-weight:600; text-align:center; line-height:1.32; opacity:0; transform:translateY(8px); transition:opacity .5s ease, transform .5s ease; }
  #teksti .vertailu-otsikko.nakyy, #teksti .vertailu-rivi.nakyy{ opacity:1; transform:translateY(0); }
  /* --lahde-koko: ERI muuttuja kuin --koko, Jarnon pyynnöstä 1.9.2026 -
     lähteen (sitaatin esittäjän nimi) koko halutaan asettaa itsenäisesti
     leipätekstin koosta riippumatta (esitys-data.js:n "lahdeKoko"-kenttä).
     Jos lahdeKoko puuttuu, naytaTeksti() asettaa --lahde-koon samaksi kuin
     --koko, jolloin vanha käytös säilyy muuttumattomana niissä pysähdyksissä
     joita ei ole vielä päivitetty. */
  /* color:#f6efe4 (sama valko kuin #teksti.valko) kiinnitetty tähän KIINTEÄNÄ
     riippumatta savy-väristä - Jarnon pyyntö 1.9.2026: "names and titles as
     white". Nimi/lähde pysyy siis aina valkoisena vaikka itse sitaatti olisi
     kelta/puna/joku muu. */
  #teksti .lahde{ font-size:calc(0.5rem + var(--lahde-koko) * (0.13vw + 0.19vh)); font-weight:600; opacity:.8; margin-top:.5em; font-style:italic; color:#f6efe4; }
  #teksti.valko{ color:#f6efe4; }
  #teksti.kelta{ color:#f2c94c; }
  #teksti.puna{ color:#f2596a; }
  /* Jarnon lisäämät 1.9.2026 - koko otsikon/tekstin väriksi (savy-kenttä
     esitys-data.js:ssä) - ERI ASIA kuin osan tekstistä värittäminen, ks.
     sen ohje naytaTeksti()-funktion yllä olevassa kommentissa. */
  #teksti.koralli{ color:#FF5562; }
  #teksti.vihrea{ color:#B0CB40; }

  /* CHATTIKUPLAT - iPhone/iMessage-tyylinen keskustelu (Jarno 2.9.2026,
     x:3240 "Tekoäly on uusi käyttöliittymä koneen ja ihmisen välillä" -
     havainnollistaa juuri TÄTÄ: keskustelu on nyt tekoälyn ja ihmisen
     rajapinta). OMA DOM-kerros #teksti:n RINNALLA, sama näkyy/piiloutuu-
     periaate (ks. naytaChatti()) mutta EI kosketa #tekstiä - molemmat
     voivat olla näkyvissä samaan aikaan samalla pysähdyksellä jos otsikko
     mahtuu (ks. esitys-data.js:n chatti-kentän dokumentaatio, sijoita
     otsikko/kupla-alue niin etteivät peity, ks. Adam/God-kokemus samana
     päivänä missä teksti peitti kuvat). Tarkoituksella ERI fontti
     (system-ui, EI Georgia-serif jota muu esitys käyttää) - puhelimen
     käyttöliittymä-tunnun vuoksi, kontrastina esityksen omalle typografialle. */
  /* Jarno 2.9.2026 "can bubbles be more center vertically" - pystysuunnassa
     ruudun KESKELLE (top:50%) alareunaan ankkuroinnin (bottom:8vh) sijaan. */
  /* --kupla-skaala (4.9.2026, Jarno "can you make chat text 2x bigger?") -
     KAIKKI kuplan mitat (leveyskatto, avatar, fontti, padding, pyöristys)
     ovat calc()-lausekkeita tästä YHDESTÄ kertoimesta (oletus 1, asetetaan
     JS:ssä naytaChatti():ssa esitys-data.js:n `chattiKoko`-kentästä) - sama
     "yksi luku skaalaa kaiken yhdessä" -periaate kuin paperipino:n
     --taysikorkeus-muuttujalla, ettei fontti kasva ilman että kupla/avatar
     kasvavat mukana (muuten teksti tunkeutuisi kuplan reunojen yli). */
  #chattikupla{ position:fixed; left:50%; top:50%; transform:translate(-50%, calc(-50% + 10px)); z-index:5; width:min(90vw, calc(480px * var(--kupla-skaala, 1))); display:flex; flex-direction:column; gap:10px; pointer-events:none; opacity:0; transition:opacity .4s ease, transform .4s ease; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  #chattikupla.nakyy{ opacity:1; transform:translate(-50%, -50%); }
  /* kupla-rivi: kupla + valinnainen avatar-kuvake VIERI VIEREEN (Jarno
     2.9.2026 "icons of robot and me, i can make those") - rivi kantaa
     näkyy-tilan/animaation (EI enää pelkkä .kupla), jotta avatar ja kupla
     ilmestyvät yhdessä samalla ajoituksella. */
  .kupla-rivi{ display:flex; align-items:flex-end; gap:8px; max-width:82%; opacity:0; transform:translateY(8px) scale(.96); transition:opacity .35s ease, transform .35s ease; }
  .kupla-rivi.nakyy{ opacity:1; transform:translateY(0) scale(1); }
  .kupla-rivi.ai{ align-self:flex-end; flex-direction:row-reverse; }
  .kupla-rivi.sina{ align-self:flex-start; }
  .kupla-avatar{ width:calc(32px * var(--kupla-skaala, 1)); height:calc(32px * var(--kupla-skaala, 1)); border-radius:50%; object-fit:cover; flex-shrink:0; box-shadow:0 2px 6px rgba(0,0,0,.4); }
  .kupla{ min-width:0; padding:calc(10px * var(--kupla-skaala, 1)) calc(16px * var(--kupla-skaala, 1)); border-radius:calc(20px * var(--kupla-skaala, 1)); font-size:calc(1rem * var(--kupla-skaala, 1)); line-height:1.35; box-shadow:0 3px 10px rgba(0,0,0,.35); }
  .kupla.ai{ background:#0b84fe; color:#fff; border-bottom-right-radius:6px; }
  .kupla.sina{ background:#e9e9eb; color:#111; border-bottom-left-radius:6px; }

  /* JÄÄVUORI + AALTO (2.9.2026, Jarno: x:840 "TÄHÄN GEN, SOME, JÄRJESTELMÄ"
     - kolme tasoa paljastuvat peräkkäin (Generatiivinen tekoäly nähdään
     ensin/pinnalla, sitten Sosiaalinen media, lopuksi Järjestelmät - "under
     surface is lot, we often see only generative AI") + LÄPINÄKYVÄ aalto
     joka NOUSEE ruudun alareunasta jokaisen uuden (syvemmän) tason mukana -
     kuvaa kuinka paljon on piilossa pinnan alla. Aalto on TARKOITUKSELLA
     matala-alfa (ei peitä tekstiä, ks. Jarnon oma sana "transparent") ja
     z-index PIENEMPI kuin #jaavuori, jotta teksti pysyy aina täysin
     luettavana sen päällä. */
  #aalto{ position:fixed; left:0; right:0; bottom:0; height:0; z-index:4; pointer-events:none; overflow:hidden; transition:height 1.6s cubic-bezier(.22,.9,.35,1); }
  #aalto svg{ position:absolute; bottom:0; left:0; width:200%; height:100%; animation:aalto-liike 14s linear infinite; }
  #aalto path{ fill:rgba(70,140,200,.32); }
  @keyframes aalto-liike{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }

  #jaavuori{ position:fixed; inset:0; z-index:5; display:flex; flex-direction:column; justify-content:space-evenly; align-items:center; padding:10vh 6vw 6vh; box-sizing:border-box; pointer-events:none; font-family:Georgia,Garamond,"Times New Roman",serif; }
  .jaavuori-taso{ text-align:center; opacity:0; transform:translateY(14px); transition:opacity .7s ease, transform .7s ease; }
  .jaavuori-taso.nakyy{ opacity:1; transform:translateY(0); }
  .jaavuori-otsikko{ color:#f2c94c; font-weight:800; font-size:2.1rem; margin-bottom:.5em; text-shadow:0 3px 14px rgba(0,0,0,.85); }
  .jaavuori-kohteet{ display:flex; flex-wrap:wrap; justify-content:center; gap:.6em 1.6em; max-width:76vw; margin:0 auto; }
  .jaavuori-kohteet span{ color:#f6efe4; font-style:italic; font-size:1.55rem; font-weight:600; text-shadow:0 2px 10px rgba(0,0,0,.85); }

  /* PAPERIPINO (3.9.2026, Jarno x:5640 "Hyväksyn ehdot": "are you able
     simulate when people click ok on term of like TikTok or Microsoft?
     And show the number? Like pile of paper" - "animation"). SAMA "oma
     DOM-kerros, näkyy/piiloutuu #tekstin rinnalla" -periaate kuin
     #jaavuori/#chattikupla (ks. naytaPaperipino()) - EI vaadi mitään
     kuva-/videoassettia, kokonaan koodilla piirretty ja animoitu: luku
     laskee ylöspäin 0:sta annettuun määrään (ease-out, hidastuu loppua
     kohti) SAMAAN AIKAAN kun paperiarkkeja putoaa pinoon yksi kerrallaan -
     arkkien määrä sidottu SAMAAN etenemään kuin luku, joten pino on
     "täynnä" täsmälleen kun luku saavuttaa lopullisen arvonsa. KESKITETTY
     ruutuun (3.9.2026, Jarno "center thos" - oli aiemmin oikealla, ks.
     esitys-data.js:n paperipino-kentän dokumentaatio). z-index on kiinteä
     CSS-oletus TÄSSÄ (5, sama kerros kuin #jaavuori/#chattikupla) - JOTTA
     Jarno voi silti valita per-pysähdys "kerroksen" (esim. teksti taakse/
     eteen) ilman CSS-muokkausta, `syvyys`-kenttä (VALINNAINEN, ks.
     naytaPaperipino()) asettaa element.style.zIndex:in JS:stä SUORAAN
     tämän CSS-oletuksen YLI - ei siis kahta kilpailevaa lähdettä, JS voittaa
     aina kun kenttä on annettu. */
  #paperipino{ position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:5; display:flex; flex-direction:row; align-items:flex-end; gap:48px; pointer-events:none; opacity:0; transition:opacity .4s ease; font-family:Georgia,Garamond,"Times New Roman",serif; }
  #paperipino.nakyy{ opacity:1; }
  /* useampi pino vierekkäin (3.9.2026, Jarno "there should be two piles
     next to each other, and of course depends maara how large it will
     be") - yksi .paperipino-yksi per esitys-data.js:n paperipino.pinot-
     taulukon alkio, rakennetaan JS:ssä (ks. naytaPaperipino()). align-items:
     flex-end yllä pitää KAIKKIEN pinojen luvut/selitteet samalla "maan-
     tasolla" vaikka pinot itse ovat eri korkuisia - pino kasvaa ylöspäin. */
  /* KOKO (3.9.2026, Jarno "can they lbigger, now quite small on big
     screen, should be also scalable") - KAIKKI mitat tässä (pinon leveys,
     arkkien paksuus, lukujen/selitteiden fonttikoko) ovat calc()-lausekkeita
     JAETUSTA --taysikorkeus-CSS-muuttujasta (asetetaan JS:ssä #paperipino-
     elementtiin, ks. naytaPaperipino()) - YKSI luku skaalaa KAIKEN yhdessä,
     ja koska --taysikorkeus on itse vh-yksikköinen (EI kiinteä px, sama
     "resoluutioriippumaton" periaate kuin HAHMOKERROKSET-tiedoston
     korkeusProsentti-kentällä - ks. sen historia/bugikorjaus samassa
     projektissa), koko mukautuu AUTOMAATTISESTI ruudun kokoon ilman
     erillistä resize-kuuntelijaa, aivan kuten muukin vh/vw-pohjainen
     typografia tässä tiedostossa. */
  .paperipino-yksi{ display:flex; flex-direction:column; align-items:center; gap:10px; }
  .paperipino-pino{ position:relative; width:calc(var(--taysikorkeus) * 1.15); }
  .paperipino-arkki{ position:absolute; left:50%; background:#f2ead9; border:1px solid rgba(0,0,0,.18); border-radius:2px; transform:translateX(calc(-50% + var(--siirto))) rotate(var(--kulma)); box-shadow:0 1px 3px rgba(0,0,0,.3); animation:paperipino-pudota .3s ease-out; }
  @keyframes paperipino-pudota{ from{ opacity:0; transform:translateX(calc(-50% + var(--siirto))) rotate(var(--kulma)) translateY(-16px); } to{ opacity:1; transform:translateX(calc(-50% + var(--siirto))) rotate(var(--kulma)) translateY(0); } }
  .paperipino-luku{ font-weight:800; font-size:calc(var(--taysikorkeus) * .34); color:#f2c94c; text-shadow:0 3px 14px rgba(0,0,0,.85); font-variant-numeric:tabular-nums; }
  .paperipino-yksikko{ font-size:calc(var(--taysikorkeus) * .12); color:#f6efe4; text-align:center; max-width:calc(var(--taysikorkeus) * 1.7); text-shadow:0 2px 10px rgba(0,0,0,.85); }

  /* KUPLA (4.9.2026, Jarno x:8940 "Algoritmit luovat myös turvaa" /
     muistiinpanot "Algoritmien muodostamat KUPLAT voivat toimia turvallisina
     vertaistuen tiloina": "are you able creat water bubble that looks good?
     and insert some kittens inside of that, then from moon set will taken
     rocket and comes to shoot the bubble, and pass by") - siis kirjaimellinen
     "kupla" (filter bubble -metafora) visualisoituna: läpinäkyvä lasi-/
     saippuakupla-pallo, jonka SISÄLLÄ kolme nukkuvaa kissanpentua kelluu
     rauhassa - RAKETTI (ks. YLITYSHAHMOT-taulukon "MOON->KUPLA"-alkio)
     ampuu sen rikki lennon puolivälissä. Kokonaan koodilla piirretty (EI
     kuva-assettia kuplalle itselleen - vain kissat ovat oikeita spritejä,
     ks. esitys-2d-hahmot.js:n kommentti "Free pack.zip"-paketista) - kolme
     päällekkäistä kerrosta: #kupla-sisus (pyöristetty, overflow:hidden,
     KISSAT tässä sisällä), #kupla-pinta (lasimainen radial-gradient +
     inset-varjot, PÄÄLLÄ kissoista - antaa "lasin läpi näkyvä" -vaikutelman),
     #kupla-kiilto (pieni kirkas ympyrä ylävasemmalla - klassinen "kiiltävä
     pallo" -temppu). Koko kupla keinuu hitaasti (kupla-kellu), jokainen
     kissa keinuu HIEMAN ERI TAHDISSA (animation-delay) ettei näytä
     jäykältä/synkronoidulta. */
  #kupla{ position:fixed; left:50%; top:46%; transform:translate(-50%,-50%); z-index:5; width:min(34vw, 300px); aspect-ratio:1/1; opacity:0; transition:opacity .6s ease; pointer-events:none; animation:kupla-kellu 4.5s ease-in-out infinite; }
  #kupla.nakyy{ opacity:1; }
  #kupla.poksahtaa{ opacity:0; transform:translate(-50%,-50%) scale(1.35); transition:opacity .25s ease-out, transform .25s ease-out; }
  @keyframes kupla-kellu{ 0%,100%{ margin-top:0; } 50%{ margin-top:-12px; } }
  #kupla-sisus{ position:absolute; inset:0; border-radius:50%; overflow:hidden; background:radial-gradient(circle at 50% 62%, rgba(120,190,255,.10), rgba(80,150,230,.04)); }
  .kupla-kissa{ position:absolute; image-rendering:pixelated; filter:drop-shadow(0 2px 3px rgba(0,0,0,.3)); animation:kupla-kissa-kellu 3.2s ease-in-out infinite; }
  .kupla-kissa-0{ left:18%; top:54%; width:36%; }
  .kupla-kissa-1{ left:46%; top:34%; width:32%; animation-delay:.5s; }
  .kupla-kissa-2{ left:42%; top:60%; width:34%; animation-delay:1s; }
  @keyframes kupla-kissa-kellu{ 0%,100%{ transform:translateY(0) rotate(0deg); } 50%{ transform:translateY(-6%) rotate(3deg); } }
  #kupla-pinta{ position:absolute; inset:0; border-radius:50%; background:radial-gradient(circle at 32% 26%, rgba(255,255,255,.5), rgba(255,255,255,.05) 32%, rgba(140,200,255,.10) 60%, rgba(100,170,240,.28) 100%); box-shadow:inset 0 0 22px rgba(255,255,255,.35), inset 0 0 55px rgba(120,190,255,.2), 0 8px 30px rgba(0,20,45,.4); border:2px solid rgba(255,255,255,.6); }
  #kupla-kiilto{ position:absolute; left:15%; top:12%; width:32%; height:20%; border-radius:50%; background:radial-gradient(ellipse, rgba(255,255,255,.9), rgba(255,255,255,0) 72%); }

  /* TIKAPUUT (4.9.2026, Jarno x:11045 Stanford-sitaatti "Ihmisiä ei
     irtisanota massoittain, vaan yritykset jättävät tekoälylle soveltuvat
     aloituspaikat kokonaan täyttämättä": "Ladder example to Stanford study
     case to descripe career ladder... Ladders are tack, then removed those
     that are down" - siis URAPORTAAT joiden ALIMMAT (aloitustason)
     askelmat katoavat, kuvaten juuri tätä ilmiötä: nuorten aloituspaikat
     jäävät täyttämättä, vanhemmat/kokeneemmat tasot pysyvät koskemattomina.
     Kokonaan koodilla piirretty (ei kuva-assettia) - kaksi pystykiskoa +
     N vaakasuoraa askelmaa, ALIMMAT muutama haalistuu/liukuu pois lyhyen
     viiveen jälkeen. Sama DOM-overlay-periaate kuin paperipino/kupla. */
  #tikapuut{ position:fixed; left:6vw; top:50%; transform:translateY(-50%); z-index:5; width:min(13vw,110px); height:min(56vh,500px); opacity:0; transition:opacity .5s ease; pointer-events:none; }
  #tikapuut.nakyy{ opacity:1; }
  .tikapuut-kisko{ position:absolute; top:0; bottom:0; width:9%; background:linear-gradient(180deg, #f2c94c, #b98f2e); border-radius:3px; box-shadow:0 2px 8px rgba(0,0,0,.45); }
  .tikapuut-kisko-vasen{ left:0; }
  .tikapuut-kisko-oikea{ right:0; }
  .tikapuut-askel{ position:absolute; left:9%; right:9%; height:6%; background:#f6efe4; border-radius:2px; box-shadow:0 2px 6px rgba(0,0,0,.4); transition:opacity .6s ease, transform .6s ease; }
  .tikapuut-askel.poissa{ opacity:0; transform:translateX(-35%) rotate(-10deg); }

  /* DIFFUUSIO (4.9.2026, x:5190 "Miten tekoäly tekee kuvan" - Jarno: "Koodilla
     kuvitus, älä laita siis tekstejä vaan luo se miten tekoäly tekee kuvan").
     Visualisoi kohinasta-kuvaksi-prosessin: pieni <canvas> piirtää KIINTEÄN,
     koodilla määritellyn pikselikissa-ruudukon (DIFFUUSIO_KISSA, ei kuva-
     assettia - "kissa pikselikuva" syntyy täysin koodilla, sama periaate
     kuin muutkin tämän tiedoston koodilla-piirretyt efektit kuten paperipino/
     tikapuut), joka askel askeleelta selkiytyy satunnaisesta kohinasta kohti
     lopullista terävää kuvaa - KARKEAT muodot ensin, TARKAT yksityiskohdat
     viimeisenä (ks. naytaDiffuusio()). "kissa"-prompti-lappu ja lopputulos-
     lappu ovat OSA kaaviota (esittävät oikean generointityökalun promptti-
     kenttää), EI kuvailevaa kappaletekstiä - siksi ne EIVÄT riko Jarnon
     "älä laita tekstejä" -ohjetta. */
  #diffuusio{ position:fixed; right:8vw; top:50%; transform:translateY(-50%); z-index:5; display:flex; flex-direction:column; align-items:center; gap:.8em; opacity:0; transition:opacity .5s ease; pointer-events:none; }
  /* diffuusio 2x + otsikko/teksti koko:6 (6.9.2026, Jarno) yhdessä ajoivat
     #teksti:n tekstin ILLUSTRATION:n alle isommilla `koko`-arvoilla, koska
     #teksti:n oma max-width kasvaa koon mukana riippumatta #diffuusio:sta -
     kavennetaan #teksti VAIN kun #diffuusio on samalla näkyvissä (sama
     :has()-tekniikka kuin #teksti:n .hl-rivikorkeuskorjauksella yllä). */
  /* KORJATTU 6.9.2026 (Jarno: "text does not work!" - kapea/leveä vw-arvaus
     (44vw, sitten 54vw) toimi VAIN sillä yhdellä ikkunakoolla jota viimeksi
     testasin (1920x1080) - kapeammalla/neliömäisemmällä ikkunalla (esim.
     tämän Browserin OMA oletuskoko, ei pakotettu 1920-emulaatio) #diffuusio-
     kehys (60vw asti) vei niin ison osan leveydestä että teksti meni sen
     ALLE joka tapauksessa. OIKEA korjaus: calc(min()) laskee tekstin
     maksimileveyden SUORAAN #diffuusio-kehyksen OMASTA kaavasta (92vw -
     kuvan reunan etäisyys oikealta 8vw - kuvan oma leveys - 4vw väli =
     82vw - kuvan leveys), jolloin ne ovat AINA geometrisesti yhteensopivat
     RIIPPUMATTA ruudun koosta - ei enää kahta erillistä käsin viritettyä
     lukua jotka voivat karata epäsynkkaan. */
  body:has(#diffuusio.nakyy) #teksti{ max-width:calc(82vw - min(40vw, 600px)); }
  #diffuusio.nakyy{ opacity:1; }
  /* 2x (6.9.2026, Jarno: "image generation could be 2 x bigger") - kaava
     40vw (EI 60vw) niin että kuva ei syö LIIKAA leveydestä KAPEALLA
     ikkunalla (esim. tämän Browser-paneelin oma oletuskoko ~800px, jossa
     60vw jätti tekstille alle 165px - liian kapea suomen pitkille yhdys-
     sanoille, ks. #teksti:n viereisen max-width-säännön kommentti). 600px:n
     YLÄRAJA säilyy ennallaan - oikealla, leveällä esitysnäytöllä (esim.
     1920px+) 40vw ylittää 600px joka tapauksessa, joten lopputulos SIELLÄ
     on täsmälleen sama kuin 60vw:llä olisi ollut. */
  #diffuusio-kehys{ width:min(40vw,600px); height:min(40vw,600px); border-radius:14px; overflow:hidden; box-shadow:0 14px 44px rgba(0,0,0,.55); border:2px solid rgba(255,255,255,.18); background:#111; }
  #diffuusio-kangas{ width:100%; height:100%; display:block; image-rendering:pixelated; image-rendering:crisp-edges; }
  .diffuusio-tag{ background:rgba(28,28,28,.8); color:#f6efe4; font-weight:700; font-size:1rem; padding:.35em 1em; border-radius:999px; opacity:0; transform:translateY(6px); transition:opacity .4s ease, transform .4s ease; white-space:nowrap; }
  .diffuusio-tag.nakyy{ opacity:1; transform:translateY(0); }

  /* ENNUSTUS (6.9.2026, x:6090 "Tekoäly ennustaa seuraavan sanan" - Jarno:
     "vesi" "märkä" = "vesi on märkää", "if this is right from pov of AI
     models" - kyllä konseptina (tilastollinen läheisyys opetusdatassa, ei
     todellinen ymmärrys), MUTTA "vesi on märkää" on oikeasti hyvin VARMA
     jatko oikealle mallille - siksi tähän jätetty näkyvä "pohtii..."-hetki
     (kolme sykkivää pistettä, ks. #ennustus-pisteet) ENNEN vastausta, joka
     visualisoi juuri sen mitä stopin oma teksti jo sanoo: "ennustaa, mutta
     ei varmuudella" - ilman erillistä prosenttilukua tai sanalistaa, koska
     Jarno halusi pitää tämän yksinkertaisena (vain kaksi sanaa). Sama DOM-
     overlay-periaate kuin #diffuusio (näkyy/piiloutuu pysähdyksen mukana,
     ks. naytaEnnustus()). */
  /* 6.9.2026, Jarno: "center it, add water drops to drip from box, make it
     little bit bigger" - keskitetty (left:50%+translateX, EI enää oikeaan
     laitaan sidottu), kortti isompi (padding/fontit kasvatettu), ja kolme
     CSS-animoitua vesipisaraa tippuu kortin alareunasta - sopii teemaan
     ("vesi" on itse ennustettava sana). #ennustus-kortti tarvitsee
     position:relative jotta pisarat (position:absolute) asemoituvat SEN
     suhteen, ei koko ruudun. */
  #ennustus{ position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:5; display:flex; flex-direction:column; align-items:center; gap:.5em; opacity:0; transition:opacity .5s ease; pointer-events:none; font-family:Georgia,Garamond,"Times New Roman",serif; }
  #ennustus.nakyy{ opacity:1; }
  #ennustus-kortti{ position:relative; background:rgba(20,20,24,.7); border:2px solid rgba(255,255,255,.18); border-radius:16px; padding:1.9em 2.4em; box-shadow:0 14px 44px rgba(0,0,0,.5); text-align:center; }
  #ennustus-syote{ color:#f6efe4; font-size:2.9rem; font-weight:700; }
  #ennustus-pisteet{ display:inline-flex; gap:.22em; vertical-align:middle; margin-left:.15em; }
  #ennustus-pisteet span{ width:.4em; height:.4em; border-radius:50%; background:#f6efe4; opacity:.35; animation:ennustus-sykays 1.1s ease-in-out infinite; }
  #ennustus-pisteet span:nth-child(2){ animation-delay:.18s; }
  #ennustus-pisteet span:nth-child(3){ animation-delay:.36s; }
  @keyframes ennustus-sykays{ 0%,80%,100%{ opacity:.25; transform:translateY(0); } 40%{ opacity:1; transform:translateY(-3px); } }
  #ennustus-tulos{ color:#f2c94c; font-size:2.9rem; font-weight:700; opacity:0; transform:scale(.85); transition:opacity .4s ease, transform .4s ease; display:inline-block; }
  #ennustus-tulos.nakyy{ opacity:1; transform:scale(1); }
  .ennustus-pisara{ position:absolute; bottom:-2px; width:12px; height:16px; background:linear-gradient(180deg, rgba(140,195,255,.95), rgba(70,140,235,.85)); border-radius:50% 50% 50% 50% / 62% 62% 38% 38%; opacity:0; animation:ennustus-tippuu 2.6s ease-in infinite; pointer-events:none; }
  .ennustus-pisara-a{ left:20%; animation-delay:0s; }
  .ennustus-pisara-b{ left:48%; animation-delay:.9s; }
  .ennustus-pisara-c{ left:76%; animation-delay:1.7s; }
  @keyframes ennustus-tippuu{
    0%{ opacity:0; transform:translateY(0) scaleY(1); }
    10%{ opacity:1; }
    82%{ opacity:1; }
    100%{ opacity:0; transform:translateY(46px) scaleY(1.5); }
  }

  /* TAMAGOTCHI (6.9.2026, x:10990 "Antaistiko tamagotchisi tekoälylle?") -
     Jarno: "Can you make tamagotchi? animation to left side". Kokonaan
     koodilla piirretty (ei kuva-assettia, sama periaate kuin diffuusio/
     ennustus): CSS-runko (pyöreä 90-luvun lelu, silmukka+ruutu+3 nappia) +
     pieni käsin piirretty 16x16-pikeliolento (TAMAGOTCHI_OLENTO, ks. alla)
     joka räpsäyttää silmiään kahden kehyksen välillä. Näkyy oikeassa
     laidassa vastapäätä tekstiä (tämän stopin teksti on puoli:'oikea'),
     samalla show/hide-periaatteella kuin muutkin DOM-overlay-efektit. */
  /* YOUTUBE-UPOTUS (7.9.2026, Jarno: "maybe youtube embed with loitsu" -
     yksi ainoa poikkeus koko esityksen muuten offline-periaatteesta, VAIN
     tälle yhdelle pysähdykselle, koska Jarnolla on nettiyhteys juuri tässä
     esityksessä; kaikki muu pysyy paikallisena. youtube: 'VIDEO_ID' -kenttä
     esitys-data.js:ssä, sama show/hide-periaate .nakyy-luokalla kuin muut
     DOM-overlay-efektit. TOISIN kuin tamagotchi: pointer-events AUTO, koska
     esittäjän pitää voida ohjata YouTuben omaa play/pause-säädintä. src
     tyhjennetään piilotettaessa, jotta video oikeasti pysähtyy eikä soi
     taustalla näkymättömänä. */
  /* Pohjaan + pienempi (8.9.2026, löytyi Taiteilijajärjestöt-deckistä, Jarno:
     "can it be bottom and little bit smaller, now blocks text" - keskitetty
     80vw/1200px-versio peitti tekstin allensa). Pohjareunaan kiinnitetty
     (left:50% + translateX, EI enää translateY - ei keskitys pysty-
     suunnassa). ENSIN 40vw/560px, Jarno: "two small now" (=too small) -
     nostettu välille, n. 60% alkuperäisestä (48vw/680px). Ei sisältö-
     kohtainen, portattu Taiteilijajärjestöt-deckistä. */
  #youtube-kehys{
    position:fixed; left:50%; bottom:4vh; transform:translateX(-50%);
    width:min(48vw, 680px); aspect-ratio:16/9; z-index:5;
    opacity:0; transition:opacity .5s ease; pointer-events:none;
    border-radius:10px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  #youtube-kehys.nakyy{ opacity:1; pointer-events:auto; }
  #youtube-kehys iframe{ width:100%; height:100%; border:0; display:block; }

  #tamagotchi{ position:fixed; left:8vw; top:50%; transform:translateY(-50%); z-index:5; opacity:0; transition:opacity .5s ease; pointer-events:none; animation:tama-kellu 3.2s ease-in-out infinite; }
  #tamagotchi.nakyy{ opacity:1; }
  @keyframes tama-kellu{ 0%,100%{ transform:translateY(-50%) translateY(0); } 50%{ transform:translateY(-50%) translateY(-10px); } }
  #tama-runko{
    position:relative; width:min(20vw,220px); aspect-ratio:1/1.18;
    background:linear-gradient(160deg,#f4d9ec 0%,#e0b8dc 60%,#cfa0cf 100%);
    border-radius:50% 50% 46% 46% / 55% 55% 45% 45%;
    box-shadow:0 18px 44px rgba(0,0,0,.5), inset 0 -10px 18px rgba(0,0,0,.12), inset 0 8px 14px rgba(255,255,255,.5);
    display:flex; flex-direction:column; align-items:center; padding-top:16%;
  }
  #tama-lenkki{ position:absolute; top:-10%; left:50%; transform:translateX(-50%); width:16%; height:16%; border:5px solid #cfa0cf; border-radius:50%; background:transparent; }
  #tama-ruutu{ width:62%; aspect-ratio:1/0.82; background:#8fae86; border-radius:38% 38% 42% 42% / 48% 48% 40% 40%; box-shadow:inset 0 4px 10px rgba(0,0,0,.35), 0 2px 0 rgba(255,255,255,.4); display:flex; align-items:center; justify-content:center; overflow:hidden; }
  #tama-kangas{ width:78%; height:78%; image-rendering:pixelated; image-rendering:crisp-edges; }
  #tama-napit{ display:flex; gap:14%; margin-top:9%; }
  #tama-napit span{ width:11%; aspect-ratio:1/1; background:linear-gradient(160deg,#fff,#c9a8c6); border-radius:50%; box-shadow:0 2px 4px rgba(0,0,0,.35), inset 0 1px 1px rgba(255,255,255,.7); }

  /* PIILOTETUT ESINEET: ks. esitys-2d-hahmot.js:n "PIILOTETUT ESINEET"
     -lohko. Tässä oli 8.9.2026 asti #piilotettuEsine - position:fixed
     -RUUTUKERROKSEN ikoni (emoji + yksi SVG), joka häivytettiin näkyviin
     pysähdyksen nurkkaan. Se toimi teknisesti mutta oli VÄÄRÄ MEKANISMI:
     Jarno: "my idea was that they would be part of backgrounds, scenes,
     not like small objects every now and there" + "items does not feel
     like 2d pixel art". Ruutuun naulattu elementti ei skrollaa eikä
     parallaksoi maailman mukana, joten se luki HUD-ikonina eikä
     maisemaan kuuluvana rekvisiittana. Korvattu MAAILMAAN ankkuroiduilla
     HAHMOKERROKSET-merkinnöillä (sama mekanismi kuin Tampella-siluetti/
     Valkoinen talo) + oikeilla pikselitaide-asseteilla, ks.
     materiaalia/tee-piilotetut-esineet.py. Vanhaa CSS:ää EI jätetty
     jäljelle, jottei kaksi kilpailevaa mekanismia eläisi rinnakkain. */

  /* POLKUVALINTA - "choose your path" -finaali (6.9.2026, x:14040, heti
     Kiitos!-dian jälkeen). Jarno halusi ensin tekstipohjaisen version,
     palaute: "I dont get the paths... I was thinking more like visuals
     effects, robot rices or something" - sitten hän liitti neljä ulkopuolelta
     saatua konseptia ja suositteli itse "Arcade Choice: Glitch vs. Player 1
     Ready" -vaihtoehtoa (helpoin toteuttaa CSS+Canvas-efekteillä, reagoi
     suoraan kettu-hahmon animaatioon). RAKENNE: kaksi korttia -> valinnan
     mukaan JOKO glitch-efekti (rappeutuminen, Kettu Rest_Pose) TAI
     kultainen kipinäpurkaus + neon-teksti (Kettu Jump) - EI enää erillistä
     "kolmatta polkua" (poistettu, koska "Viisas tekoälyttömyys" ON jo tässä
     esityksessä oma, MYÖNTEINEN käsite - ks. esitys-data.js x:13290 "Viisas
     tekoälyttömyys on kykyä valita..." - eri asia kuin polun 1 sokea
     luottamus, joten kahden polun kontrasti RIITTÄÄ, kolmas olisi toistoa).
     Sama visuaalinen runko kuin #opasvalinta (tumma tausta, Georgia-otsikko,
     kortit) mutta OMA elementti, näytetään/piilotetaan TAVALLISELLA
     x-täsmäys-periaatteella (polkupeli:true, ks. esitys-data.js) - sama
     nayta<Feature>(p)-malli kuin diffuusio/ennustus/tamagotchi. */
  #polkuvalinta{ position:fixed; inset:0; z-index:90; background:radial-gradient(ellipse at center, #1c2438 0%, #0a0e14 100%); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4.5vh; opacity:0; pointer-events:none; transition:opacity .6s ease, background .6s ease; font-family:Georgia,Garamond,"Times New Roman",serif; overflow:hidden; }
  #polkuvalinta.nakyy{ opacity:1; pointer-events:auto; }
  /* glitch-tila (polku 1): tumman punainen/musta tausta + koko ruudun
     hienoinen tärinä/värivääristymä ajoittain - EI koko ajan (silmiä
     rasittava jatkuvana), vaan lyhyinä "häiriöpurskeina" (ks. JS
     polkuGlitchPurske()). */
  #polkuvalinta.glitch{ background:radial-gradient(ellipse at center, #2a1014 0%, #0a0505 100%); }
  #polkuvalinta.glitch-purske{ animation:polku-tarina .28s linear; }
  @keyframes polku-tarina{
    0%,100%{ transform:translate(0,0); filter:hue-rotate(0deg); }
    20%{ transform:translate(-6px,2px); filter:hue-rotate(30deg); }
    40%{ transform:translate(5px,-3px); filter:hue-rotate(-20deg); }
    60%{ transform:translate(-4px,1px) skewX(1deg); filter:hue-rotate(15deg); }
    80%{ transform:translate(3px,-2px); filter:hue-rotate(-10deg); }
  }
  #polku-efekti-kangas{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:1; opacity:0; transition:opacity .3s ease; }
  #polku-efekti-kangas.nakyy{ opacity:1; }
  /* virhe-otsikko (glitch) / PLAYER 1 READY (kipinä) - iso, "arcade"-tyylinen
     teksti kortti-alueen YLÄPUOLELLA, oma sykkivä hehku per tila. */
  #polkuvalinta-huuto{ position:relative; display:none; font-family:'Courier New',monospace; font-weight:900; font-size:clamp(1.6rem,4vw,3rem); letter-spacing:.08em; text-align:center; z-index:2; }
  #polkuvalinta-huuto.nakyy{ display:block; }
  #polkuvalinta-huuto.virhe{ color:#ff3b3b; text-shadow:0 0 10px #ff3b3b, 0 0 26px #ff3b3bcc; animation:polku-virhe-vilkku .12s steps(2) infinite; }
  @keyframes polku-virhe-vilkku{ 0%,100%{ opacity:1; } 50%{ opacity:.55; } }
  #polkuvalinta-huuto.voitto{ color:#ffe28a; text-shadow:0 0 12px #f2c94c, 0 0 34px #f2c94cbb; animation:polku-voitto-sykays 1.1s ease-in-out infinite; }
  @keyframes polku-voitto-sykays{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.055); } }
  #polkuvalinta-otsikko{ position:relative; color:#f2c94c; text-align:center; text-shadow:0 3px 18px rgba(0,0,0,.85); z-index:2; }
  #polkuvalinta-otsikko b{ display:block; font-size:2.2rem; font-weight:800; letter-spacing:-.01em; }
  #polkuvalinta-otsikko span{ display:block; margin-top:.4em; font-size:1.1rem; font-style:italic; color:#f6efe4cc; }

// erillinen kevyempi renderöijä - täysin sama koodi, ei kahta ylläpidettävää

// UPOTETTUUN, EI-INTERAKTIIVISEEN pikkukuvaan:

// koko bugiluokka ei voi enää toistua - lisää kohtauksia taakse ja raja
// seuraa automaattisesti mukana.
const KOHTAUS_MAX_X = Math.max(...KOHTAUKSET.map(k => k.xAlue[1]));

// LISAPYSAHDYKSET_ESIKATSELU: mekanismi jolla KOHTAUKSET-taulukon

const LISAPYSAHDYKSET_ESIKATSELU = KOHTAUKSET
  .filter(k => k.xAlue[0] >= KOHTAUS_MAX_X)

const PYSAHDYKSET_2D = PYSAHDYKSET.filter(p => p.x >= 60 && p.x <= KOHTAUS_MAX_X).concat(LISAPYSAHDYKSET_ESIKATSELU);

// Jarnon pyyntö 1.9.2026: käsin muokkauksen aikana rivi ladataan usein
// uudelleen, eikä silloin ole mukavaa palata joka kerta alkuun. Tallennetaan
// nykyinen pysähdys sessionStorageen (ei localStorage) - palautuu SAMAN
// välilehden uudelleenlatauksella, mutta EI aidosti uudessa välilehdessä/
// ikkunassa (esim. Aloita-esitys.command avaa aina uuden, joten oikea
// esitys alkaa silti aina puhtaalta pöydältä). `r`-näppäin (jo olemassa,
// nollaa alkuun) tyhjentää myös tallennuksen - käytä sitä ennen oikeaa
// esitystä jos olet jäänyt testaamaan kesken.
const INDEKSI_AVAIN = 'esitys-2d-indeksi';
let indeksi = 0;
try {
  // ESIKATSELU: iframe jakaa sessionStoragen VANHEMPI-ikkunan kanssa (sama

  // seuraava/strippi) kirjoittaisi/lukisi samaa avainta ristiin. Ohitetaan
  // kokonaan esikatselutilassa, aloitetaan aina indeksistä 0 (varsinainen
  // sijainti asetetaan joka tapauksessa heti __esikatseluSiirry():llä).
  const tallennettu = ESIKATSELU ? null : sessionStorage.getItem(INDEKSI_AVAIN);
  if (tallennettu !== null) {
    const n = parseInt(tallennettu, 10);
    if (!isNaN(n) && n >= 0 && n < PYSAHDYKSET_2D.length) indeksi = n;
  }
} catch (e) { /* sessionStorage voi olla estetty - ei haittaa, aloitetaan alusta */ }
let kohdeX = PYSAHDYKSET_2D[indeksi].x * SKAALA;
// alkuaika: EI enää const (6.9.2026, Jarno esittäjänäkymä-pyyntö "can

// samaa arvoa BroadcastChannel-viestien mukana.
let alkuaika = Date.now();

// =============================================================
//  BROADCASTCHANNEL - sama protokolla kuin esitys-3d.html:ssä
// =============================================================
const esitysKanava = (!ESIKATSELU && 'BroadcastChannel' in window) ? new BroadcastChannel('tekoalykahvit-esitys') : null;
if (esitysKanava) esitysKanava.onmessage = e => {

  if (!d) return;
  if (d.tyyppi === 'siirry') siirryGlobaaliIndeksiin(d.indeksi);
  else if (d.tyyppi === 'kysy') esitysKanava.postMessage({ tyyppi: 'siirry', indeksi: globaaliIndeksi(), alkuaika });
};

// esitys-3d.html:n indeksi viittaa KOKO PYSAHDYKSET-listaan (0..97), mutta

function globaaliIndeksi(){

}

let lukukorttiAjastin = null;
function naytaLukukortti(p){
  if (lukukorttiAjastin){ clearTimeout(lukukorttiAjastin); lukukorttiAjastin = null; }

//                      those") - näytetään JOKAISEN sen puhujan viestin

//   chattiKoko        - VALINNAINEN, kerroin (oletus 1), 4.9.2026 Jarno "can

//                      `chattiKoko: 2` = kaksinkertainen.
let chattiAjastimet = [];
function naytaChatti(p){
  chattiAjastimet.forEach(t => clearTimeout(t));
  chattiAjastimet = [];
  chattikuplaEl.classList.remove('nakyy');
  chattikuplaEl.style.setProperty('--kupla-skaala', p.chattiKoko != null ? p.chattiKoko : 1);
  chattikuplaEl.innerHTML = '';
  if (!p.chatti || !p.chatti.length) return;
  chattikuplaEl.classList.add('nakyy');
  const viive = p.chattiViive != null ? p.chattiViive : 550;
  p.chatti.forEach((viesti, i) => {
    const onAi = viesti.kuka === 'ai';
    const kuvake = onAi ? p.chattiKuvakeAi : p.chattiKuvakeSina;
    const rivi = document.createElement('div');
    rivi.className = 'kupla-rivi ' + (onAi ? 'ai' : 'sina');

      const img = document.createElement('img');
      img.className = 'kupla-avatar';
      img.src = kuvake;
      rivi.appendChild(img);

    const kupla = document.createElement('div');
    kupla.className = 'kupla ' + (onAi ? 'ai' : 'sina');
    kupla.innerHTML = viesti.viesti;
    rivi.appendChild(kupla);
    chattikuplaEl.appendChild(rivi);
    const t = setTimeout(() => rivi.classList.add('nakyy'), 250 + i * viive);
    chattiAjastimet.push(t);

}

// heti kun siirrytään pois - alkaa aina alusta jos palataan takaisin.
let jaavuoriAjastimet = [];
function naytaJaavuori(p){
  jaavuoriAjastimet.forEach(t => clearTimeout(t));
  jaavuoriAjastimet = [];

  aaltoEl.style.height = '0';
  if (!p.jaavuori || !p.jaavuori.tasot || !p.jaavuori.tasot.length) return;
  const tasot = p.jaavuori.tasot;
  const viive = p.jaavuori.viive != null ? p.jaavuori.viive : 1500;
  tasot.forEach((taso, i) => {
    const tasoEl = document.createElement('div');
    tasoEl.className = 'jaavuori-taso';
    const otsikkoEl = document.createElement('div');
    otsikkoEl.className = 'jaavuori-otsikko';
    otsikkoEl.textContent = taso.otsikko;
    const kohteetEl = document.createElement('div');
    kohteetEl.className = 'jaavuori-kohteet';
    (taso.kohteet || []).forEach(nimi => {
      const span = document.createElement('span');
      span.textContent = nimi;
      kohteetEl.appendChild(span);
    });
    tasoEl.appendChild(otsikkoEl);
    tasoEl.appendChild(kohteetEl);
    jaavuoriEl.appendChild(tasoEl);
    // aallon korkeus: joka tason myötä nousee - viimeinen (syvin) taso
    // nostaa aallon ~75%:iin ruudun korkeudesta (nostettu 60:sta 2.9.2026,
    // Jarno: "can water reach litte bit higher, like over Sosiaalinen
    // media level" - nyt aalto nousee "Sosiaalinen media" -tason YLI kun
    // kolmas/syvin taso paljastuu, EI koskaan täyteen (ylin taso pysyy
    // aina näkyvissä aallon YLÄPUOLELLA).
    const aaltoKorkeusProsentti = ((i + 1) / tasot.length) * 75;
    const t = setTimeout(() => {
      tasoEl.classList.add('nakyy');
      aaltoEl.style.height = aaltoKorkeusProsentti + 'vh';
    }, 300 + i * viive);
    jaavuoriAjastimet.push(t);
  });
}

// VESI (3.9.2026, Jarno x:4141 "Olemme kaikki Mikkejä" -pysähdys, Fantasian
// "Tirlittan oppipoika" -viittaus: "let's use just gandalf standing postitio
// and rising water") - KEVYT itsenäinen käyttö SAMASTA #aalto-elementistä
// kuin jaavuori (ks. sen kommentti/CSS) - EI mitään tasoja/tekstiä, pelkkä
// nouseva vesi. `vesi`-kenttä MIHIN TAHANSA esitys-data.js:n PYSAHDYKSET-
// alkioon: joko pelkkä luku (vh-korkeusprosentti, esim. `vesi: 55`) tai
// { korkeus, viive } jos haluat säätää käynnistysviivettä (oletus 300ms).
// TÄRKEÄÄ KUTSUJÄRJESTYS: kutsutaan AINA naytaJaavuori():n JÄLKEEN (ks.
// siirry()/alkupysähdys-koukut alempana) - jaavuori nollaa #aallon
// korkeuden 0:aan JOKAISELLA pysähdyksellä ehdoitta, joten vesi:n oma

function polkuvalintaAani(tila){

      osc.frequency.value = hz;
      const alku = nyt + i * (tila === 'voitto' ? 0.11 : 0.09);

      osc.connect(gain).connect(ctx.destination);

// polkuEfektiAloita: yksi jaettu <canvas> koko #polkuvalinta-overlayn päällä

        polkuvalintaEl.classList.add('glitch-purske');
      }

  } else {

// DATAKUPLA (ks. #datakupla:n CSS-kommentti - 7.9.2026, x:5490). Portattu
// test-datakupla.html-prototyypistä (ks. sen oma kommentti pakkaus-
// algoritmista - phyllotaxis-alkusijoitus + iteratiivinen törmäysten
// purku, Meta-solmu KIINTEÄNÄ keskellä). RAKENNETAAN VAIN KERRAN (raskas,
// ~200²×260 törmäystarkistusta) ja VÄLIMUISTIIN - toisin kuin diffuusio/
// ennustus/tamagotchi, jotka nollaavat/rakentavat itsensä joka kerta
// uudelleen, tämä vain piilotetaan/näytetään uudelleenkäytöllä (nopeampi
// eikä muuta kuplien satunnaisjärjestystä kesken esityksen). Uudelleen-
// rakennetaan ainoastaan ikkunan koon muuttuessa (ks. resize-kuuntelija
// alempana) - EI siis täysin resoluutioriippumaton kuten muu moottori,
// mutta riittävä koska esittäjä ei tyypillisesti muuta ikkunan kokoa
// kesken tämän yhden pysähdyksen.
let datakuplaRakennettu = false;
let datakuplaAjastimet = [];
let datakuplaKorostusVali = null;
function datakuplaAsettelu(data, W, H){
  const cx = W/2, cy = H/2;
  const minR = Math.min(W,H) * 0.012, maxR = Math.min(W,H) * 0.045;
  const maxE = Math.max(...data.map(d => d.e));
  const metaR = Math.min(W,H) * 0.075;
  const nodes = data.map(d => {
    const t = Math.sqrt(d.e / maxE);
    return { n: d.n, e: d.e, r: minR + t * (maxR - minR) };
  });
  const golden = Math.PI * (3 - Math.sqrt(5));
  const spiralK = Math.min(W,H) * 0.028;
  nodes.forEach((node, i) => {
    const idx = i + 1;
    const dist = spiralK * Math.sqrt(idx);
    const angle = idx * golden;
    node.x = cx + dist * Math.cos(angle);
    node.y = cy + dist * Math.sin(angle);
  });
  const meta = { x: cx, y: cy, r: metaR, pinned: true };
  const kaikki = nodes.concat([meta]);
  const PAD = 3;
  for (let iter = 0; iter < 260; iter++) {
    for (let i = 0; i < kaikki.length; i++) {
      for (let j = i + 1; j < kaikki.length; j++) {
        const a = kaikki[i], b = kaikki[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const dist = Math.hypot(dx, dy) || 0.001;
        const minDist = a.r + b.r + PAD;
        if (dist < minDist) {
          const overlap = (minDist - dist) / 2;
          const ux = dx / dist, uy = dy / dist;
          if (!a.pinned) { a.x -= ux * overlap; a.y -= uy * overlap; }
          if (!b.pinned) { b.x += ux * overlap; b.y += uy * overlap; }
        }
      }
    }
    const pull = 0.006;
    nodes.forEach(n => { n.x += (cx - n.x) * pull; n.y += (cy - n.y) * pull; });
  }
  return { nodes, meta };
}
function datakuplaRakenna(){
  datakuplaEl.querySelectorAll('.dk-node').forEach(el => el.remove());
  datakuplaSvgEl.querySelectorAll('.dk-line').forEach(el => el.remove());

  datakuplaTilastoEl.textContent = METAVERKOSTO_DATA.length + ' sovellusta ja sivustoa · ' +
    METAVERKOSTO_DATA.reduce((s,d) => s+d.e, 0) + ' tapahtumaa jaettu Metalle';

  const metaEl = document.createElement('div');
  metaEl.className = 'dk-node dk-node-meta';
  metaEl.style.left = meta.x + 'px'; metaEl.style.top = meta.y + 'px';
  metaEl.style.width = metaEl.style.height = (meta.r * 2) + 'px';
  metaEl.innerHTML = '<span class="dk-lbl">Meta</span>';
  datakuplaEl.appendChild(metaEl);
  requestAnimationFrame(() => requestAnimationFrame(() => metaEl.classList.add('nakyy')));

  const jarjestys = nodes.map((_, i) => i);
  for (let i = jarjestys.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [jarjestys[i], jarjestys[j]] = [jarjestys[j], jarjestys[i]];
  }
  const elems = [];
  nodes.forEach(node => {
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', meta.x); line.setAttribute('y1', meta.y);

    const bubble = document.createElement('div');
    bubble.className = 'dk-bubble';
    el.appendChild(bubble);
    if (node.r > 17) {
      const lbl = document.createElement('span');
      lbl.className = 'dk-lbl';
      lbl.textContent = node.n;
      lbl.style.fontSize = Math.max(0.55, Math.min(0.85, node.r / 32)) + 'rem';
      el.appendChild(lbl);
    }
    const badge = document.createElement('div');
    badge.className = 'dk-badge';
    badge.textContent = node.e + (node.e === 1 ? ' kerta' : ' kertaa');
    el.appendChild(badge);
    datakuplaEl.appendChild(el);
    elems.push({ el, line, node });
  });

  const KESTO_MS = 4200;
  jarjestys.forEach((idx, i) => {
    const delay = (i / jarjestys.length) * KESTO_MS;
    datakuplaAjastimet.push(setTimeout(() => {
      elems[idx].el.classList.add('nakyy');
      elems[idx].line.classList.add('nakyy');
    }, delay));
  });

  const korostettavat = elems.slice(0, 10);
  let korostusIdx = 0;
  function korostaSeuraava(){
    korostettavat.forEach(e => { e.el.classList.remove('korostus'); e.line.classList.remove('korostus'); });
    const kohde = korostettavat[korostusIdx % korostettavat.length];
    kohde.el.classList.add('korostus'); kohde.line.classList.add('korostus');
    korostusIdx++;
  }
  datakuplaAjastimet.push(setTimeout(() => {
    korostaSeuraava();
    datakuplaKorostusVali = setInterval(korostaSeuraava, 2200);
  }, KESTO_MS + 400));

  datakuplaRakennettu = true;
}
function datakuplaPysayta(){
  datakuplaAjastimet.forEach(t => clearTimeout(t));
  datakuplaAjastimet = [];
  if (datakuplaKorostusVali) { clearInterval(datakuplaKorostusVali); datakuplaKorostusVali = null; }
}
function naytaDatakupla(p){

    const elems = Array.from(datakuplaEl.querySelectorAll('.dk-node:not(.dk-node-meta)')).map((el, i) => ({

    }));

      korostettavat.forEach(e => { e.el.classList.remove('korostus'); e.line && e.line.classList.remove('korostus'); });
      const kohde = korostettavat[korostusIdx % korostettavat.length];
      kohde.el.classList.add('korostus'); kohde.line && kohde.line.classList.add('korostus');
      korostusIdx++;
    }

// OSAN TEKSTISTÄ VÄRITTÄMINEN (Jarnon kysymys 1.9.2026): `otsikko`/`teksti`
// kirjoitetaan suoraan innerHTML:ksi alla (ei escapata) - siis tavallinen
// HTML kelpaa jo NYT esitys-data.js:n merkkijonoissa, ei vaadi mitään
// koodimuutosta. Esimerkki:
//   otsikko: 'Tekoäly on <span style="color:#FF5562">jumala</span>?'
// `savy`-kenttä (alla, `valko`/`kelta`/`puna`/`koralli`/`vihrea`) värittää
// KOKO otsikon/tekstin - `<span style="color:...">`-tempu värittää vain
// halutun OSAN, riippumatta mitä `savy` on asetettu. Molempia voi käyttää
// samaan aikaan (savy koko tekstille, span yhden sanan päälle).
// leipaAjastimet: VAIHEITTAIN paljastuvan teksti-taulukon (ks. alla)
// ajastimet - sama siivous-periaate kuin chattiAjastimet/jaavuoriAjastimet,
// muuten vanhalle pysähdykselle ajastettu rivi voisi ilmestyä KESKELLE
// seuraavaa pysähdystä jos siirrytään pois kesken paljastuksen.
let leipaAjastimet = [];
function naytaTeksti(p){
  leipaAjastimet.forEach(t => clearTimeout(t));
  leipaAjastimet = [];
  tekstiEl.classList.remove('nakyy');
  setTimeout(() => {
    if (!p.otsikko && !p.teksti && !p.vertailu){ tekstiEl.innerHTML = ''; return; }
    let h = '';
    // kortti (VALINNAINEN, 3.9.2026, ks. #teksti .hl:n CSS-kommentti) -
    // kietoo tekstin sisältöön <span class="hl">, joka piirtää MUSTAN
    // taustan TIIVIISTI JOKAISEN RIVIN ympärille (ei koko kappaleen
    // ympärille yhtenä laatikkona) - Jarno näytti esimerkkikuvan tästä
    // tyylistä ("Or are you bale to add black backround just to text?").
    const hl = p.kortti ? (s) => `<span class="hl">${s}</span>` : (s) => s;
    if (p.otsikko) h += `<div class="otsikko">${hl(p.otsikko)}</div>`;
    // teksti: MERKKIJONO (vanha, oletus) TAI TAULUKKO (UUSI 3.9.2026, Jarno
    // x:2790 "Artificial Intelligence, 1956" - "I would like to add first
    // [lause 1] then [lause 2] then etc" - haluttiin AUTOMAATTINEN,
    // KERTYVÄ paljastus, EI klikkerillä - "matches jaavuori/chatti-tyyliä
    // jotka jo ovat tässä paketissa" oli perustelu, Jarno hyväksyi). Jokainen
    // taulukon alkio: { rivi:'teksti', viive: 2000 } - viive (ms, VALINNAINEN,
    // oletus 1800) on odotusaika EDELLISEN rivin jälkeen ENNEN TÄTÄ riviä,
    // eli säädettävissä ERIKSEEN JOKAISELLE rivinvaihdolle (Jarnon kysymys
    // "can I adjust time per screen" - kyllä, per rivi). Ensimmäinen rivi
    // näkyy AINA heti pysähdyksen kanssa (ei omaa viivettä).
    if (Array.isArray(p.teksti)) {
      h += '<div class="leipa">' + p.teksti.map((r, i) => `<div class="leipa-rivi" data-i="${i}">${hl(r.rivi)}</div>`).join('') + '</div>';
    } else if (p.teksti) {
      h += `<div class="leipa">${hl(p.teksti)}</div>`;
    }
    // vertailu (VALINNAINEN, 4.9.2026, x:12840 "kilpikonna vs. jänis" -kuva,
    // ks. esitys-data.js:n vertailu-kentän kommentti) - KAKSIPALSTAINEN
    // vertailu otsikko/teksti:n SIJAAN. { otsikot:[vasen,oikea], rivit:[
    // {vasen,oikea,viive}, ...] }. CSS-grid asettaa vasemman/oikean parin
    // automaattisesti VIERETYSTEN, koska ne kirjoitetaan HTML:ään pareittain
    // peräkkäin (grid-auto-flow täyttää rivin 2 solua kerrallaan). data-i
    // yhdistää saman parin nayta()-vaiheistuksessa alla.
    if (p.vertailu) {
      let vh = '<div class="vertailu">';
      const rivit = p.vertailu.rivit || [];
      const alkuOffset = p.vertailu.otsikot ? 1 : 0;
      if (p.vertailu.otsikot) {
        vh += `<div class="vertailu-otsikko" data-i="0">${hl(p.vertailu.otsikot[0] || '')}</div>`;
        vh += `<div class="vertailu-otsikko" data-i="0">${hl(p.vertailu.otsikot[1] || '')}</div>`;
      }
      rivit.forEach((r, i) => {
        const di = i + alkuOffset;
        vh += `<div class="vertailu-rivi" data-i="${di}">${hl(r.vasen || '')}</div>`;
        vh += `<div class="vertailu-rivi" data-i="${di}">${hl(r.oikea || '')}</div>`;
      });
      vh += '</div>';
      h += vh;
    }
    if (p.lahde)   h += `<div class="lahde">${hl(p.lahde)}</div>`;
    tekstiEl.innerHTML = h;
    const puoli = (p.puoli === 'keski' || p.puoli === 'oikea') ? p.puoli : 'vasen'; // 'vasen'|'keski'|'oikea'
    const pysty = (p.pysty === 'keski' || p.pysty === 'ala') ? p.pysty : 'yla';     // 'yla'|'keski'|'ala'
    tekstiEl.className = (p.savy || 'valko') + ' h-' + puoli; // kortti: ks. .hl-luokan kommentti - ei tarvitse omaa luokkaa tänne, .hl hoitaa kaiken sisällössä
    tekstiEl.style.setProperty('--koko', p.koko || 3); // 1-10, ks. esitys-data.js:n koko-kenttä; oletus 3
    // lahdeKoko: itsenäinen koko sitaatin lähteelle (nimi), Jarnon pyynnöstä
    // 1.9.2026. Jos ei annettu, käytetään samaa arvoa kuin --koko (vanha
    // käytös säilyy niissä pysähdyksissä joissa lahdeKoko-kenttää ei ole).
    tekstiEl.style.setProperty('--lahde-koko', p.lahdeKoko != null ? p.lahdeKoko : (p.koko || 3));
    kerrosEl.className = 'h-' + puoli + ' v-' + pysty;
    requestAnimationFrame(() => {
      tekstiEl.classList.add('nakyy');
      if (Array.isArray(p.teksti)) {
        const rivit = tekstiEl.querySelectorAll('.leipa-rivi');
        let kertyma = 0;
        rivit.forEach((rivi, i) => {
          if (i === 0) { rivi.classList.add('nakyy'); return; }
          kertyma += (p.teksti[i].viive != null ? p.teksti[i].viive : 1800);
          const t = setTimeout(() => rivi.classList.add('nakyy'), kertyma);
          leipaAjastimet.push(t);
        });
      }
      // vertailu: sama vaiheistus-idea kuin p.teksti-taulukolla yllä, mutta
      // ryhmiteltynä data-i:n mukaan niin että vasen+oikea samasta parista
      // ilmestyvät YHTÄ AIKAA (ei erikseen, muuten pariutus näyttäisi hassulta).
      if (p.vertailu) {
        const solut = tekstiEl.querySelectorAll('.vertailu-otsikko, .vertailu-rivi');
        const ryhmat = {};
        solut.forEach(el => { const i = el.dataset.i; (ryhmat[i] = ryhmat[i] || []).push(el); });
        const jarjestys = Object.keys(ryhmat).map(Number).sort((a, b) => a - b);
        const alkuOffset = p.vertailu.otsikot ? 1 : 0;
        let kertyma2 = 0;
        jarjestys.forEach((i, idx) => {
          const nayta = () => ryhmat[i].forEach(el => el.classList.add('nakyy'));
          if (idx === 0) { nayta(); return; }
          const rivi = p.vertailu.rivit[i - alkuOffset];
          kertyma2 += (rivi && rivi.viive != null ? rivi.viive : 1800);
          const t = setTimeout(nayta, kertyma2);
          leipaAjastimet.push(t);
        });
      }
    });
  }, 300);
}

  if (hahmoTila) hahmoTila.kavelee = true;
  if (window.__scene) window.__scene.paivitaVideot(p, suunta);

  if (window.__scene) window.__scene.paivitaVainPysahdysKuvat(p);
  if (!ESIKATSELU) { try { sessionStorage.setItem(INDEKSI_AVAIN, String(indeksi)); } catch (e) {} }
  if (laheta !== false && esitysKanava) esitysKanava.postMessage({ tyyppi: 'siirry', indeksi: globaaliIndeksi(), alkuaika });
}

// ESIKATSELU: vanhempi-ikkuna (esittajanakyma.html) kutsuu tätä suoraan
// contentWindow:in kautta (sama origin, iframe) hypätäkseen annettuun
// story-x:ään VÄLITTÖMÄSTI - EI kameran normaalia liu'utusta (KAMERA_NOPEUS-
// helpotusta, ks. update()), koska pieni pikkukuva-iframe ei ehdi/tarvitse
// odottaa sitä, kuvan pitää olla oikeassa kohdassa heti seuraavassa
// framessa. Etsii lähimmän PYSAHDYKSET_2D-pysähdyksen (täsmäävä x, tai
// lähin jos ei täsmää tarkalleen - esikatselustripin nimellinen x on aina
// jonkin oikean pysähdyksen x, joten tarkka täsmäys on normaalitapaus).
window.__esikatseluSiirry = function(x){
  let idx = PYSAHDYKSET_2D.findIndex(p => p.x === x);
  if (idx === -1) {
    idx = 0;
    let parasEro = Infinity;
    PYSAHDYKSET_2D.forEach((p, i) => {
      const ero = Math.abs(p.x - x);
      if (ero < parasEro) { parasEro = ero; idx = i; }
    });
  }
  siirry(idx, false);
  if (window.__scene) {
    const kohde = PYSAHDYKSET_2D[idx].x * SKAALA;
    window.__scene.cameras.main.scrollX = kohde;
    if (window.__scene.hahmo) window.__scene.hahmo.x = kohde;
  }
};

addEventListener('keydown', e => {
  // LÖYDETTY BUGI 1.9.2026 (Jarno: "cmd+r, goes beginning"): Cmd+R
  // (selaimen oma "lataa sivu uudelleen" -pikanäppäin) lähettää silti
  // 'keydown'-tapahtuman sivulle ENNEN kuin selain oikeasti lataa sivun
  // uudelleen - ilman tätä tarkistusta `case 'r':` (sovelluksen OMA "aloita
  // alusta" -pikanäppäin) täsmäsi silloinkin, nollasi tallennetun sijainnin
  // JUURI ENNEN uudelleenlatausta, ja näytti siltä että "Cmd+R nollaa
  // sijainnin" vaikka syy oli tämän sivun oma koodi, ei selain. Sama
  // ongelma olisi koskenut Cmd+F:ää (selaimen "etsi sivulta") ja Cmd+1-4:ää
  // (Chromen "vaihda välilehteen N") - KAIKKI sovelluksen pikanäppäimet on
  // tarkoitettu vain ILMAN Cmd/Ctrl-näppäintä, joten yksi yhteinen tarkistus
  // tässä kattaa koko luokan bugeja kerralla, ei vain yhtä tapausta.
  if (e.metaKey || e.ctrlKey) return;
  if (ESIKATSELU) return; // pikkukuva-iframe ei reagoi näppäimiin, ohjaus tulee AINA __esikatseluSiirry():n kautta
  switch (e.key){
    case 'ArrowRight': case 'PageDown': case ' ': case 'Enter': case 'ArrowDown':
      e.preventDefault(); siirry(indeksi + 1); break;
    case 'ArrowLeft': case 'PageUp': case 'ArrowUp': case 'Backspace':
      e.preventDefault(); siirry(indeksi - 1); break;
    case 'Home': siirry(0); break;
    case 'End': siirry(PYSAHDYKSET_2D.length - 1); break;
    case 'f': case 'F':
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
      break;
    case 'r': case 'R': siirry(0); break;
    // 1-4 = vaihda opashahmo (tekninen MVP "choose character" -mekanismi,
    // Jarnon idea 31.8.2026 - ei vielä yleisöäänestys-UI, ks. vaihdaHahmo():n
    // kommentti PaaKohtaus-luokassa). Järjestys HAHMOVAIHTOEHDOT-taulukon
    // mukaan (1=kettu, 2=T-Rex, 3=hevonen, 4=pupu).
    case '1': case '2': case '3': case '4': {
      const idx = Number(e.key) - 1;
      const tiedot = HAHMOVAIHTOEHDOT[idx];
      if (tiedot && window.__scene) window.__scene.vaihdaHahmo(tiedot.avain);
      break;
    }
  }
});

let hahmoTila = null; // { kavelee }

class PaaKohtaus extends Phaser.Scene {
  preload(){
    // KAIKKI tämän funktion lataukset (kuvat/videot/äänet/spritesheetit)
    // 2.9.2026 (Jarno: "If I change png, will it cache heavily. seems
    // that zalaris kuvat i have changed evolution.png and old still
    // shows" - lopulta todistettu palvelimen access-logista: evolution.
    // png:tä EI edes PYYDETTY uudelleen aidon sivunlatauksen yhteydessä,
    // eli selain näytti sen OMASTA cachesta ilman verkkopyyntöäkään).
    // SAMA "?t=Date.now()" -tekniikka joka jo esti tämän ongelman esitys-
    // 2d.html:lle itselleen JA esitys-data.js/kohtaukset.js/hahmot.js/
    // hahmovaihtoehdot.js-tiedostoille (ks. tämän tiedoston yläreunan
    // <meta>-kommentti ja alempi <script>-lohko) EI KOSKAAN kattanut
    // preload()in omia lähteitä - dev-server.py:n no-cache-otsakkeetkaan
    // (ks. sen kommentti) eivät auta jos selain ei edes YRITÄ verkko-
    // pyyntöä. bust() lisää yksilöllisen ?cb=<timestamp>:n JOKAISEEN
    // tässä ladattuun tiedostoon (myös niihin joilla on jo oma ?v=3, ks.
    // kettu/ylitys-spritesheetit alla) - selaimella ei ole KOSKAAN
    // aiempaa cache-osumaa tarjolla, joten se hakee AINA tuoreimman
    // version levyltä. Sama tietoinen "ei koskaan cachea" -valinta kuin
    // datatiedostoilla jo aiemmin - hidastaa latausta hieman jokaisella
    // reloadilla, mutta tämä on aktiivisen muokkauksen työkalu, ei
    // tuotantosivusto, joten tuoreus voittaa.
    const CB = Date.now();
    const bust = (polku) => polku + (polku.includes('?') ? '&' : '?') + 'cb=' + CB;

    // taustakerrokset (kaikki KOHTAUKSET-kohtaukset ladataan etukäteen,
    // prototyypissä vain yksi)
    //
    // TEEMOJEN SEKOITTAMINEN (Jarnon pyyntö 1.9.2026, "try mixing themes"):
    // yksittäinen kerros voi antaa OMAN `kansio`-kenttänsä joka korvaa
    // kohtauksen oletuskansion VAIN sille kerrokselle - näin yksi kohtaus
    // voi yhdistää kerroksia USEASTA eri pakasta (esim. metsän taivas +
    // kaupungin siluetti taustalla). Avain sisältää nyt kerrosindeksin
    // (aiemmin pelkkä `nimi:tiedosto`) - EI voinut ennen syntyä törmäystä
    // koska nimi oli aina uniikki per kohtaus, mutta nyt kun sama tiedosto-
    // NIMI (esim. yleinen "2-background.png") voi esiintyä SAMASSA
    // kohtauksessa kahdesti eri kansioista, indeksi takaa ettei jälkimmäinen
    // koskaan korvaa/sekoitu ensimmäisen kanssa lataus-cachessa.
    KOHTAUKSET.forEach(kohtaus => {
      kohtaus.kerrokset.forEach((k, i) => {
        const kansio = k.kansio || kohtaus.kansio;
        this.load.image(kohtaus.nimi + ':' + i + ':' + k.tiedosto, bust(kansio + k.tiedosto));
      });
    });

    // kettu: spritesheetit, 260x260 per kehys. walk/idle/sit/sneak
    // kaapattu uudelleen 31.8.2026 assets/exported-model.glb:stä (Jarnon
    // lataama uusi versio, enemmän klippejä) test-hahmo-render.html:n
    // korjatulla kaappauksella (precise:true + koko klipin kattava bbox,
    // ks. sen kommentit) - vanha kaappaustapa leikkasi hännän osittain
    // pois tietyissä animaatiokehyksissä koska luurangon lepoasennon
    // bounding box ei kattanut animoitua hännän liikettä. idle-alert on
    // AINOA joka on vielä vanhasta mallista (mallit/fox.glb) - uudessa
    // exported-model.glb:ssä ei ole Idle_Alert-klippiä lainkaan.
    //
    // ?v=3 KAIKISSA fox-*.png-poluissa: nämä tiedostot on kaapattu
    // UUDELLEEN useita kertoja tämän session aikana (häntäkorjaus,
    // yhtenäinen mittakaava, Jump-seuranta) ilman että selaimen
    // kuvatiedostocache olisi koskaan pakotettu päivittymään - täsmälleen
    // sama ongelma kuin esitys-data.js:ssä (ks. sen ?t=Date.now()-korjaus),
    // mutta kuville staattinen versionumero riittää koska niitä ei
    // muokata yhtä usein käsin. **NOSTA tämä numero (v=3 -> v=4 jne.) joka
    // kerta kun JOKIN fox-*.png kaapataan uudelleen test-hahmo-render.
    // html:llä** - muuten selain voi näyttää vanhaa spriteä uuden koodin
    // (esim. origin/skaala-arvojen) kanssa, mikä näyttää täsmälleen
    // samalta kuin maadoitusbugi vaikka koodi olisi oikein (Jarno:
    // "Fox is still too down, not on grass level like earlier", 31.8.2026).
    this.load.spritesheet('kettu-walk', bust('assets/2d/sprites/fox-walk.png?v=3'), { frameWidth: 260, frameHeight: 260 });
    this.load.spritesheet('kettu-idle', bust('assets/2d/sprites/fox-idle.png?v=3'), { frameWidth: 260, frameHeight: 260 });
    this.load.spritesheet('kettu-sit', bust('assets/2d/sprites/fox-sit.png?v=3'), { frameWidth: 260, frameHeight: 260 });
    this.load.spritesheet('kettu-idle-alert', bust('assets/2d/sprites/fox-idle-alert.png?v=3'), { frameWidth: 260, frameHeight: 260 });
    this.load.spritesheet('kettu-sneak', bust('assets/2d/sprites/fox-sneak.png?v=3'), { frameWidth: 260, frameHeight: 260 });
    // uudet klipit exported-model.glb:stä, lisää vaihtelua (Jarnon pyyntö 31.8.2026)
    this.load.spritesheet('kettu-bark', bust('assets/2d/sprites/fox-bark.png?v=3'), { frameWidth: 260, frameHeight: 260 });
    this.load.spritesheet('kettu-bite', bust('assets/2d/sprites/fox-bite.png?v=3'), { frameWidth: 260, frameHeight: 260 });
    this.load.spritesheet('kettu-fetch', bust('assets/2d/sprites/fox-fetch.png?v=3'), { frameWidth: 260, frameHeight: 260 });
    this.load.spritesheet('kettu-howl', bust('assets/2d/sprites/fox-howl.png?v=3'), { frameWidth: 260, frameHeight: 260 });
    // kettu-jump: 260x260 kuten muut. Jump sisältää oikean pystysuoran
    // hyppyliikkeen (koko malli nousee ilmaan) - kaapattu "seuraavalla"
    // kameralla joka keskittää JOKAISEN kehyksen erikseen hahmon nykyiseen
    // asentoon (ei uppoa maahan/karkaa kehyksestä), mutta zoom pysyy
    // vakiona samassa mittakaavassa muiden animaatioiden kanssa (Jarnon
    // huomiot "on jump it scales smaller" ja "cuts some part of fox when
    // jumps", 31.8.2026 - ks. test-hahmo-render.html:n kaappaaSeuraten()
    // ja muistio §27 kohta 8).
    this.load.spritesheet('kettu-jump', bust('assets/2d/sprites/fox-jump.png?v=3'), { frameWidth: 260, frameHeight: 260 });
    this.load.spritesheet('kettu-run', bust('assets/2d/sprites/fox-run.png?v=3'), { frameWidth: 260, frameHeight: 260 });

    // valittavat opashahmot (ks. esitys-2d-hahmovaihtoehdot.js) - kettu
    // ladataan edelleen omilla käsin kirjoitetuilla riveillä yllä (historia/
    // kommentit säilyvät koskemattomina), MUUT hahmot ladataan geneerisesti
    // tästä samasta HAHMOVAIHTOEHDOT-taulukosta jota myös luoHahmo()/
    // vaihdaHahmo() käyttävät (ks. alempana) - ei kaksinkertaista listaa
    // ylläpidettäväksi. avain+':'+klippi täsmää samaan '<avain>:<tiedosto>'
    // -konventioon kuin taustakerrosten 'kohtaus.nimi:tiedosto' -avaimet.
    HAHMOVAIHTOEHDOT.forEach(h => {
      if (h.avain === 'kettu') return; // jo ladattu yllä
      Object.entries(h.spritet).forEach(([klippi, polku]) => {
        this.load.spritesheet(h.avain + ':' + klippi, bust(polku), { frameWidth: 260, frameHeight: 260 });
      });
    });

    // maisemahahmot (ks. esitys-2d-hahmot.js) - kuva TAI video per hahmo.
    // Video: 'canplaythrough' odotusehtona (ei pelkkä 'loadeddata') - selain
    // lupaa tällä ettei toisto tule pätkimään, tarvitaan jotta video on
    // AIDOSTI valmis heti lavalla eikä "hyppää" myöhässä paikalleen (ks.
    // muistio §38 jatko 2 - tämä oli oikea korjaus samaan ongelmaan
    // test-video-alpha.html:ssä).
    HAHMOKERROKSET.forEach(h => {
      if (h.video) {
        this.load.video('hahmo-video:' + h.video, bust(h.video), 'canplaythrough', false, false);
        // Kaksi PNG-kaveria - AINA luotettavasti piirtyviä, ei koskaan
        // videospesifistä epävarmuutta (ks. esitys-2d-hahmot.js:n kommentti
        // "MIKSI KAKSI PNG:tä VIDEON LISÄKSI").
        if (h.ekaFrame) this.load.image('hahmo-eka:' + h.video, bust(h.ekaFrame));
        if (h.viimeinenFrame) this.load.image('hahmo-viimeinen:' + h.video, bust(h.viimeinenFrame));
      } else if (h.spritesheet) {
        // animoitu maailmassa-kelluva kerros (esim. savu, mainostaulu) -
        // Jarnon pyyntö 1.9.2026 "genuine animated sprite sheets, do it
        // all!". Sama idea kuin YLITYSHAHMOT-spritesheetit, mutta TÄMÄ
        // pysyy maailmakoordinaatissa/parallaksissa (ei ruutu-tilassa) ja
        // ANIMOI JATKUVASTI silmukassa - ei kävely-käynnistys/pysäytys.
        // kehysLeveys/kehysKorkeus (EI-neliömäinen kehys, esim. savu-
        // wisp-kuvien tiivis rajaus 61x101) - jos vain kehysKoko annettu,
        // käytetään sitä molemmilla (vanha neliö-käytös, taaksepäin
        // yhteensopiva).
        this.load.spritesheet('hahmo-sheet:' + h.spritesheet, bust(h.spritesheet), { frameWidth: h.kehysLeveys || h.kehysKoko, frameHeight: h.kehysKorkeus || h.kehysKoko });
      } else if (h.kuva) {
        this.load.image('hahmo:' + h.kuva, bust(h.kuva));
      } else if (h.saapuu) {
        // saapuu (UUSI 4.9.2026, x:13890 loppukiitos, Jarno: "could first
        // walk to next to fox, then wave and continue waving") - RUUTUUN
        // sidottu (kuten kiintea) mutta KAKSIVAIHEINEN: kävelee ruudun
        // reunasta kohdesijaintiin (h.saapuu.kavelyAika sekunnissa), sitten
        // VAIHTAA spritesheetin heiluttamis-silmukkaan ja jää paikalleen.
        // Kaksi ERI spritesheetiä (kävely = sivuprofiili, heilutus = edestä
        // kuvattu) ladataan omilla avaimillaan.
        this.load.spritesheet('saapuu-kavely:' + h.saapuu.kavely, bust(h.saapuu.kavely), { frameWidth: h.saapuu.kehysLeveys, frameHeight: h.saapuu.kehysKorkeus });
        this.load.spritesheet('saapuu-heilutus:' + h.saapuu.heilutus, bust(h.saapuu.heilutus), { frameWidth: h.saapuu.kehysLeveys, frameHeight: h.saapuu.kehysKorkeus });
      }
      // aaniraita on RIIPPUMATON kuva/video-valinnasta - voi olla kummankin
      // kanssa TAI ilman kuvaa/videota kokonaan (pelkkä ääni). Ks. esitys-2d-
      // hahmot.js:n kommentti - EI SAMA KENTTÄ kuin videon oma `aani`-boolean
      // (sen oman äänen mykistys), tämä on erillinen ääniraita mikä tahansa
      // hahmolla. EI enää esiladata Phaserin loaderilla (8.9.2026, ks. iso
      // selitys paivitaAanet():n yläpuolella create():ssa) - aaniraita-klipit
      // ovat nyt tavallisia HTML5 <audio>-elementtejä, jotka ladataan/
      // puskuroidaan itse create():ssa niiden omalla preload='auto':lla,
      // eikä Phaserin asset-putken kautta lainkaan.
    });

    // YLITYSHAHMOT (ks. esitys-2d-hahmot.js) - ruudun poikki kävelevät
    // hahmot. spritesheet (kävelysykli, ks. hahmot.js:n kommentti) TAI kuva
    // (yksi still-frame) - avain on TAULUKON INDEKSI, ei polku, koska sama
    // tiedosto voisi teoriassa esiintyä eri kehyskoolla eri alkiossa.
    YLITYSHAHMOT.forEach((h, i) => {
      if (h.spritesheet) {
        this.load.spritesheet('ylitys:' + i, bust(h.spritesheet + '?v=3'), { frameWidth: h.kehysLeveys, frameHeight: h.kehysKorkeus });
      } else if (h.kuva) {
        this.load.image('ylitys:' + i, bust(h.kuva));
      }
    });
  }

  create(){
    const { width, height } = this.scale;

    // --- taustakerrokset (TileSprite, pysyy kamerassa kiinni, siirretään
    //     itse tilePositionX:llä - ei koskaan lopu kesken vaikka kamera
    //     kulkee pitkän matkan, "Seamless"-pakkaus toistuu saumattomasti) ---
    // TÄRKEÄÄ: skaalataan pystysuunnassa niin että YKSI kuvakerta täyttää
    // koko ruudun korkeuden - muuten TileSprite toistaa kuvan myös
    // PYSTYSUUNNASSA aina kun ruutu on korkeampi kuin lähdekuva (928x793),
    // mikä näkyi rikkinäisenä sinisenä raitana keskellä ruutua (taivas
    // toistui kesken metsän). tilePositionY pidetään aina nollassa - vain
    // X liikkuu (parallaksi), Y-skaala venyttää yhden kuvan koko korkeudelle.
    // AIEMMIN aina KOHTAUKSET[0] riippumatta x:stä (prototyyppi, yksi
    // kohtaus koko matkalle) - nyt valitaan oikea kohtaus alku-x:n mukaan,
    // ks. valitseKohtaus()/vaihdaKohtaus() ja update():n rajantarkistus
    // (Jarnon pyyntö 31.8.2026: "fox moves to new scenery").
    this.kohtaus = this.valitseKohtaus(PYSAHDYKSET_2D[indeksi].x);
    const kohtaus = this.kohtaus;

    // --- proseduraalinen taivas (Phaser Graphics, ei kuvatiedosto) ---
    // Piirretään AINA ENSIN (kauimmaisena, taivas -1000 ja kuu -999) jos
    // kohtaus määrittää sellaisen. Kuu on TARKOITUKSELLA kuvakerrosten TAKANA
    // (ei edessä) - kuu joka piirtyy puun rungon päälle näyttää väärältä
    // ("liimattu puun eteen"), kun taas kuu joka jää osittain korkean puun
    // taakse näyttää oikealta/luonnolliselta (aivan kuin oikea kuu metsän
    // yllä). Ainoa mikä piti korjata oli kaksi kerrosta jotka olivat 100%
    // läpinäkymättömiä KOKO kankaalla (Layer_0011_0.png, Layer_0010_1.png -
    // täysi tasavärinen taivastaso, poistettu kerrokset-listalta alla) - ne
    // olisivat peittäneet kuun JOKA kamera-asemalla, eikä se ole sama asia
    // kuin luonnollinen osittainen peittyminen korkean puun taakse.
    this.taivasGrafiikka = this.add.graphics().setScrollFactor(0).setDepth(-1000);
    this.kuuGrafiikka = kohtaus.taivas?.kuu ? this.add.graphics().setScrollFactor(0).setDepth(-999) : null;
    if (kohtaus.taivas) this.piirraTaivas(kohtaus.taivas, width, height);
    this.piirraSiluetit(kohtaus.siluetit, width, height);
    this.piirraValokeila(kohtaus.valokeila, width, height);
    this.piirraAmbienssit(kohtaus.ambienssit, width, height);

    this.taustakerrokset = this.rakennaTausta(kohtaus, width, height);
    this.sovitaTaustatRuutuun(width, height);
    // poistuvatKerrokset: kohtausvaihdon ristikkohäivytyksestä poistumassa
    // olevat kerrossarjat (voi olla useampi yhtä aikaa jos vaihtoja tulee
    // nopeasti peräkkäin) - ks. vaihdaKohtaus() ja update():n tilePositionX-
    // päivitys, joka pitää nämäkin vielä liikkeessä häivytyksen ajan.
    this.poistuvatKerrokset = [];

    // ruutu voi vaihtaa kokoa/kuvasuhdetta milloin tahansa (F = koko näyttö,
    // eri näyttö/projektori/TV, ikkunan koon muutos) - Phaser.Scale.RESIZE
    // muuttaa canvasin kokoa automaattisesti, mutta TileSpritet ja ketun
    // sijainti pitää sovittaa käsin joka kerta, muuten osa ruudusta jää
    // tyhjäksi/mustaksi (ei koskaan sinistä/mustaa reunaa yli tai ali)
    this.scale.on('resize', gameSize => {
      this.sovitaTaustatRuutuun(gameSize.width, gameSize.height);
      if (this.kohtaus.taivas) this.piirraTaivas(this.kohtaus.taivas, gameSize.width, gameSize.height);
      this.piirraSiluetit(this.kohtaus.siluetit, gameSize.width, gameSize.height);
      this.piirraValokeila(this.kohtaus.valokeila, gameSize.width, gameSize.height);
      this.piirraAmbienssit(this.kohtaus.ambienssit, gameSize.width, gameSize.height);
      // videohahmot skaalautuvat korkeusProsentti-kentän mukaan (ei kiinteä
      // mittakaava kuten kuvahahmoilla) - täytyy siis laskea uudelleen kun
      // ruutu vaihtaa kokoa (F=koko näyttö, projektorin vaihto, ikkunan koko).
      // X UUDELLEEN KAIKILLE (video+kuva): laskeParallaksiX():n tulos riippuu
      // ruudun leveydestä (ks. sen kommentti) - ilman tätä hahmon "täsmällinen
      // keskitys saapumishetkellä" menisi pieleen heti kun ikkuna vaihtaa kokoa.
      (this.videohahmot || []).forEach(vh => {
        const sf = vh.h.scrollFactor != null ? vh.h.scrollFactor : 1;
        const x = this.laskeParallaksiX(vh.h.x + (vh.h.siirtymaX || 0), sf, gameSize.width);
        const y = gameSize.height * (vh.h.yProsentti != null ? vh.h.yProsentti : 0.82);
        vh.video.x = x; vh.video.y = y;
        vh.ekaKuva.x = x; vh.ekaKuva.y = y;
        vh.viimeinenKuva.x = x; vh.viimeinenKuva.y = y;
        this.sovitaVideoKokoon(vh, gameSize.width, gameSize.height);
      });
      (this.kuvahahmot || []).forEach(kh => {
        // lukitseKerrokseen: ks. laskeLukittuScrollFactor():n kommentti -
        // riippuu KORKEUDESTA, joten PITÄÄ laskea uudelleen täälläkin
        // (ei vain create():ssa) ja ASETTAA UUDELLEEN img:iin (scrollFactor
        // EI ollut ennen tätä mitään resize:n uudelleenlaskemaa arvoa).
        const omaKohtaus = this.valitseKohtaus(kh.h.x);
        const lukittuSf = kh.h.lukitseKerrokseen ? this.laskeLukittuScrollFactor(omaKohtaus, kh.h.lukitseKerrokseen, gameSize.height) : null;
        const sf = lukittuSf != null ? lukittuSf : (kh.h.scrollFactor != null ? kh.h.scrollFactor : 1);
        kh.img.setScrollFactor(sf);
        kh.img.x = this.laskeParallaksiX(kh.h.x + (kh.h.siirtymaX || 0), sf, gameSize.width);
        kh.img.y = gameSize.height * (kh.h.yProsentti != null ? kh.h.yProsentti : 0.82);
        // korkeusProsentti: skaala UUDELLEEN täälläkin (ks. create():n
        // kommentti) - muuten ikkunan koon muuttuessa kesken esityksen
        // koko jäisi ENSIMMÄISEN latauksen ruutukokoon jumiin.
        if (kh.h.korkeusProsentti != null && kh.img.height) {
          kh.img.setScale((Math.min(gameSize.width, gameSize.height) * kh.h.korkeusProsentti) / kh.img.height);
        }
      });
      // kiinteatKuvat: ruutuun sidottu sijainti riippuu myös leveydestä/
      // korkeudesta (6vw/6vh-marginaalit) - laskettava uudelleen samoin.
      (this.kiinteatKuvat || []).forEach(kk => {
        const sijainti = this.laskeKiinteaSijainti(kk.h, gameSize.width, gameSize.height);
        kk.img.x = sijainti.x; kk.img.y = sijainti.y;
        const kProsentti = kk.h.korkeusProsentti != null ? kk.h.korkeusProsentti : 0.18;
        kk.img.setScale((Math.min(gameSize.width, gameSize.height) * kProsentti) / kk.img.height);
      });
      (this.kiinteatVideot || []).forEach(kv => {
        const sijainti = this.laskeKiinteaSijainti(kv.h, gameSize.width, gameSize.height);
        kv.video.x = sijainti.x; kv.video.y = sijainti.y;
        this.sovitaKiinteaVideoKokoon(kv, gameSize.width, gameSize.height);
      });
    });

    if (kohtaus.attribuutio) creditEl.textContent = kohtaus.attribuutio;

    // --- maisemahahmot: kuvat JA videot (ks. esitys-2d-hahmot.js) ---
    // this.videohahmot: videotyyppisten hahmojen tila (play/pause-koneisto,
    // ks. paivitaVideot() alempana). this.kuvahahmot: pelkkä {h,img}-pari,
    // tarvitaan jotta resize-kuuntelija voi laskea worldX:n uudelleen
    // (ks. laskeParallaksiX():n kommentti - oikea worldX riippuu leveydestä).
    // this.kiinteatKuvat: RUUTUUN sidotut kuvat (kiintea:true) - EI
    // maailmakoordinaattia/parallaksia, sama näkyy/piiloutuu-mekanismi kuin
    // tekstillä (ks. paivitaKiinteatKuvat()). Jarnon oma erottelu 1.9.2026:
    // "some images should appear same way as text... some images are part
    // of parallax, like Terminator."
    this.videohahmot = [];
    this.kuvahahmot = [];
    this.kiinteatKuvat = [];
    this.kiinteatVideot = [];
    this.aanihahmot = [];
