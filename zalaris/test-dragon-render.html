<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Dragon sprite baking (test tool, ei osa esitystä)</title>
<style>
  body{ background:#2a2a2a; color:#eee; font-family:monospace; margin:0; padding:10px; }
  #status{ white-space:pre; font-size:12px; }
  canvas{ background:
    linear-gradient(45deg,#444 25%,transparent 25%),
    linear-gradient(-45deg,#444 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#444 75%),
    linear-gradient(-45deg,transparent 75%,#444 75%);
    background-size:16px 16px; background-position:0 0,0 8px,8px -8px,-8px 0px;
    border:1px solid #666; }
</style>
</head>
<body>
<div id="status">lataa...</div>
<canvas id="c" width="400" height="400"></canvas>
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './vendor/three/addons/loaders/GLTFLoader.js';

const statusEl = document.getElementById('status');
const canvas = document.getElementById('c');
const FRAME = 400; // yksi kehys, neliö
canvas.width = FRAME; canvas.height = FRAME;

const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, preserveDrawingBuffer: true });
renderer.setSize(FRAME, FRAME, false);
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
const ambient = new THREE.AmbientLight(0xffffff, 1.1);
scene.add(ambient);
const dir = new THREE.DirectionalLight(0xffffff, 2.0);
dir.position.set(2, 3, 4);
scene.add(dir);
const dir2 = new THREE.DirectionalLight(0xffffff, 0.6);
dir2.position.set(-2, 1, -3);
scene.add(dir2);

const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.01, 100);

let model, mixer, box, size, center;
let clipMap = {};

window.__ready = false;
window.__log = [];

const loader = new GLTFLoader();
loader.load('assets/2d/sprites/dragon.glb', (gltf) => {
  model = gltf.scene;
  scene.add(model);
  box = new THREE.Box3().setFromObject(model);
  size = box.getSize(new THREE.Vector3());
  center = box.getCenter(new THREE.Vector3());
  mixer = new THREE.AnimationMixer(model);
  gltf.animations.forEach(clip => { clipMap[clip.name] = clip; });
  window.__log.push('bbox size=' + JSON.stringify(size) + ' center=' + JSON.stringify(center));
  window.__log.push('clips=' + Object.keys(clipMap).join(','));
  window.__clipDurations = {};
  Object.keys(clipMap).forEach(n => window.__clipDurations[n] = clipMap[n].duration);
  statusEl.textContent = window.__log.join('\n');
  window.__ready = true;
  frameCameraSide(); // oletuskuvakulma
  renderer.render(scene, camera);
}, undefined, (err) => {
  window.__log.push('VIRHE: ' + err.message);
  statusEl.textContent = window.__log.join('\n');
});

// Kamera sivulta (profiili) - kokeillaan akselia parametrilla.
// axis: 'x' = katsotaan +X-akselilta kohti origoa (näkyy YZ-taso),
//       'z' = katsotaan +Z-akselilta (näkyy XY-taso, todennäköisin "sivusta"-kuva
//       useimmille malleille, koska Z on yleensä "eteenpäin"-akseli glTF:ssä).
window.frameCameraSide = function(axis = 'x', flip = false, pad = 1.15) {
  const maxDim = Math.max(size.x, size.y, size.z);
  const half = maxDim * pad / 2;
  camera.left = -half; camera.right = half; camera.top = half; camera.bottom = -half;
  const dist = maxDim * 3;
  const sign = flip ? -1 : 1;
  if (axis === 'x') camera.position.set(center.x + sign*dist, center.y, center.z);
  else if (axis === 'z') camera.position.set(center.x, center.y, center.z + sign*dist);
  else if (axis === 'y') camera.position.set(center.x, center.y + sign*dist, center.z + 0.001);
  camera.lookAt(center);
  camera.up.set(0, 1, 0);
  camera.updateProjectionMatrix();
  window.__log.push('camera axis=' + axis + ' flip=' + flip);
  statusEl.textContent = window.__log.join('\n');
};

window.renderOnce = function() {
  renderer.render(scene, camera);
  return canvas.toDataURL('image/png');
};

let currentAction = null;
window.setClipTime = function(name, t) {
  const clip = clipMap[name];
  if (!clip) return 'ei löydy: ' + name;
  if (!currentAction || currentAction.getClip() !== clip) {
    if (currentAction) currentAction.stop();
    currentAction = mixer.clipAction(clip);
    currentAction.play();
  }
  // Suora paikallisajan asetus action.time:iin + mixer.update(0) - LUOTETTAVA
  // tapa "scrubata" tarkkaan kohtaan, toisin kuin mixer.setTime() joka
  // käyttää mixerin GLOBAALIA kelloa (kertyi väärin peräkkäisillä kutsuilla,
  // näkyi eri poosina samalla t-arvolla flip=false/true-vertailussa).
  currentAction.time = t;
  mixer.update(0);
  renderer.render(scene, camera);
  return canvas.toDataURL('image/png');
};

window.__isReady = () => window.__ready;
</script>
</body>
</html>
