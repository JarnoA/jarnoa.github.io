<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Esittäjänäkymä</title>
<style>
  :root{
    --tausta:#14151a; --tausta2:#1c1e26; --reuna:#2c2f3a;
    --teksti:#eef0f6; --himmea:#8b8fa3; --korostus:#ffd166;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; height:100%; background:var(--tausta); color:var(--teksti);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  body{ display:flex; flex-direction:column; padding:20px 28px; gap:16px; }

  #ylapalkki{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:1px solid var(--reuna); padding-bottom:12px; flex-wrap:wrap; gap:10px 20px;
  }
  /* KELLONAIKA (6.9.2026, Jarno: "There could be added current time, clock",
     7.9.2026 "current time bigger, same as time, make it as yellow") -
     OIKEA kellonaika (HH:MM), eri asia kuin #kello (kulunut aika esityksen
     alusta) - molemmat rinnakkain, ks. #kelloryhma. Sama koko kuin #kello
     (2.4rem) ja keltainen (--korostus, sama sävy kuin muualla tässä
     tiedostossa esim. #nyt .lahde:llä) - AIEMMIN pienempi/himmeä, erottui
     liian vähän kulunut-aika-kellosta. */
  #kellonaika{ font-size:2.4rem; font-variant-numeric:tabular-nums; font-weight:600; color:var(--korostus); }
  #kelloryhma{ display:flex; align-items:baseline; gap:14px; }
  #kello{ font-size:2.4rem; font-variant-numeric:tabular-nums; font-weight:600; }
  /* TAVOITEAIKA (6.9.2026, "worst case" -pyyntö: näkyvä merkki jos ollaan
     jäljessä aikataulusta, JOTTA tietää milloin pitää alkaa "cut corners" -
     ks. #pikasiirto alempana). Kesto muokattavissa (oletus 45 min, ks.
     esitys-2d-kohtaukset.js:n "VARALLA 90 MIN" -kommentti - 45 min on
     TÄMÄN version oikea kesto), tallennetaan localStorageen niin ei tarvitse
     asettaa joka kerta uudelleen. Väri vaihtuu keltaiseksi/punaiseksi kun
     ollaan jäljessä (jäljellä-aika negatiivinen tai lähellä nollaa).
  */
  #tavoite{ font-size:1.05rem; font-variant-numeric:tabular-nums; display:flex; align-items:baseline; gap:6px; }
  #tavoite input{ width:7em; background:var(--tausta2); border:1px solid var(--reuna); color:var(--teksti); border-radius:5px; padding:2px 4px; font-size:0.9rem; font-variant-numeric:tabular-nums; }
  #tavoiteJaljella{ font-weight:700; }
  #tahti{ font-weight:800; font-size:1.25em; font-variant-numeric:tabular-nums; }
  #tahti.edella{ color:#7ee787; } #tahti.ajassa{ color:var(--teksti); } #tahti.jaljessa{ color:#f78166; }
  #tavoiteJaljella.ok{ color:#7ee787; }
  #tavoiteJaljella.varoitus{ color:var(--korostus); }
  #tavoiteJaljella.myohassa{ color:#f78166; }
  #laskuri{ font-size:1.3rem; color:var(--himmea); font-variant-numeric:tabular-nums; }
  #yhteys{ font-size:0.85rem; display:flex; align-items:center; gap:8px; }
  #yhteys.ok .tila{ color:#7ee787; }
  #yhteys.ei .tila{ color:#f78166; }
  #synkronoi{
    background:var(--tausta2); border:1px solid var(--reuna); color:var(--teksti);
    font-size:0.78rem; padding:4px 10px; border-radius:6px; cursor:pointer;
  }
  #synkronoi:hover{ border-color:var(--korostus); }

  /* ESIKATSELU-IFRAMET (7.9.2026, Jarno: "would it be impossible to see
     current slide as it is?... too much GPU?" sitten "Seuraavaksi. can it
     be there too") - upottaa TÄMÄN SAMAN esitys-2d.html:n pieneen
     <iframe>:iin ?esikatselu=1-parametrilla (ks. sen oman ESIKATSELU-
     vakion iso kommentti) sen sijaan että rakennettaisiin erillinen
     kevyempi renderöijä - sama koodi, ei kahta ylläpidettävää versiota.
     GPU-kustannus on pieni koska iframe on natiivisti pieni (220x124px,
     EI täysikokoinen canvas jota vain CSS pienentäisi visuaalisesti -
     silloin GPU piirtäisi täyttä kokoa turhaan). pointer-events:none -
     klikkaukset EIVÄT mene iframen sisään (se ei ole interaktiivinen
     kopio, vain elävä pikkukuva), sama periaate kuin #strippi-kohdan
     staattisilla kaappauskuvillakin (ks. alempi kommentti). */
  .esikatselu-kehys{
    width:220px; aspect-ratio:220/124; flex-shrink:0; border-radius:10px; overflow:hidden;
    border:1px solid var(--reuna); background:#0a0e14; pointer-events:none;
  }
  .esikatselu-kehys iframe{ width:100%; height:100%; border:0; display:block; }

  /* KAKSI PÄÄKOLUMNIA (7.9.2026, löytyi Taiteilijajärjestöt-deckistä, Jarno:
     "issue is my macbook screen, we should reposition this... MUISTIINPANOT
     should be much bigger, most important thing... columns with NOW, MEMOS,
     SEURAAVAKSI, like first column NOW/NEXT, then second tall MEMOS") -
     aiempi pystysuora pino (nyt -> muistiinpanot -> seuraava) ei mahtunut
     MacBookin näyttöön korkeussuunnassa hyvin. Nyt kaksi vierekkäistä
     saraketta täyttäen koko jäljellä olevan korkeuden (#paakolumnit flex:1
     body:n omassa pysty-flex-pinossa): VASEN = nyt+seuraava pinottuna
     (kapeampi, #vasenKolumni), OIKEA = pelkkä muistiinpanot (leveämpi JA
     koko sarakkeen korkuinen) - koska sovitaMuistiinpanotFontti() jo mittaa
     laatikon TODELLISEN korkeuden fonttikoon valintaan, pelkkä ison, korkean
     laatikon antaminen sille riittää tekemään tekstistä automaattisesti
     ISOMPAA, ei tarvinnut muuttaa itse sovitus-logiikkaa lainkaan. Ei
     sisältökohtainen, portattu Taiteilijajärjestöt-deckistä. */
  #paakolumnit{ display:flex; gap:16px; flex:1; min-height:0; }
  /* Kavennettu 38%->kiinteä 260px (9.9.2026, Jarno: MacBookia toisena
     näyttönä käytettäessä muistiinpanot pitää saada isommaksi - "take text
     away from current and next, relay only thumbnail") - nyt/seuraava
     näyttävät enää PELKÄN esikatselukuvan (ks. #nyt-sisalto/#seuraava-
     sisalto display:none alempana), joten sarake ei enää tarvitse tilaa
     otsikko/teksti/lahde-sisällölle. 260px = 220px-levyinen esikatselukehys
     + reunusten/paddingin verran tilaa. Jäljelle jäävä leveys menee
     kokonaan #muistiinpanotille (flex:1 sen omassa säännössä), ja koska
     sovitaMuistiinpanotFontti() mittaa laatikon TODELLISEN leveyden joka
     kerta, teksti kasvaa automaattisesti isommaksi - ei tarvinnut muuttaa
     fonttisovituslogiikkaa lainkaan. */
  #vasenKolumni{ display:flex; flex-direction:column; gap:16px; flex:0 0 260px; min-width:260px; min-height:0; }
  /* RUUTUTEKSTI NÄKYVIIN (7.10.2026, Jarno Hämeenlinnan jälkeen: "en nähnyt
     kunnolla itse esitystä, joten en nähnyt mitä ruudulla lukee. Olennaista
     että näen kaiken tekstin" + "muistiinpanot suurena, mutta myös nykyinen
     ... seuraava kohta alariville, sen oikealla sitten seuraavat").
     Vasen sarake leveämmäksi: nykyinen esikatselukuva + KOKO ruututeksti
     (otsikko, kaikki rivit myös myöhemmin paljastuvat, vertailu, lähde),
     fontti sovitetaan automaattisesti kuten muistiinpanoissa. Seuraava kohta
     siirretty alariville (#alarivi) ensimmäiseksi omalla elävällä
     esikatselullaan; strippi jatkuu sen oikealla. Klikkeri riittää, ei
     näppäinkomentoja. */
  #vasenKolumni{ flex:0 0 33%; min-width:320px; }
  #vasenKolumni #nyt{ flex:1; flex-direction:column; align-items:stretch; justify-content:flex-start; gap:12px; padding:14px 18px; overflow:hidden; }
  #vasenKolumni #nyt .esikatselu-kehys{ width:min(100%, 300px); align-self:center; }
  #nyt-sisalto{ display:block !important; flex:1; min-height:0; overflow:hidden; font-size:2.2rem; line-height:1.3; }
  #nytOtsikko{ font-weight:700; color:var(--korostus); }
  #nytTeksti{ white-space:pre-wrap; margin-top:0.35em; }
  #nytLahde{ color:var(--himmea); margin-top:0.35em; font-size:0.8em; }
  #nyt-sisalto .tyhja{ color:var(--himmea); font-style:italic; font-size:0.6em; font-weight:400; }
  #alarivi{ display:flex; gap:10px; align-items:stretch; }
  #alarivi #seuraava{ flex:0 0 250px; opacity:1; flex-direction:column; align-items:stretch; justify-content:flex-start;
    padding:8px 10px; gap:6px; cursor:pointer; border-color:var(--korostus); overflow:hidden; }
  #alarivi #seuraava .label{ margin-bottom:0; }
  #alarivi #seuraava .esikatselu-kehys{ width:100%; }
  #seuraava-sisalto{ display:block !important; font-size:0.8rem; line-height:1.25; }
  #seuraavaOtsikko{ font-weight:700; }
  #seuraavaTeksti{ color:var(--himmea); margin-top:3px; max-height:3.8em; overflow:hidden; }
  #alarivi #strippi{ flex:1; min-width:0; }

  #nyt{
    background:var(--tausta2); border:1px solid var(--reuna); border-radius:14px;
    padding:20px 24px; min-height:120px; display:flex; justify-content:center; align-items:flex-start;
    flex:1.3; min-height:0; overflow-y:auto;
  }
  #nyt .label, #muistiinpanot .label, #seuraava .label{
    text-transform:uppercase; letter-spacing:0.08em; font-size:0.72rem;
    color:var(--himmea); margin-bottom:8px; font-weight:600;
  }
  /* Otsikko/teksti/lahde piilotettu (9.9.2026, Jarno: "take text away from
     current and next, relay only thumbnail") - elementit ja niitä
     päivittävä JS jätetty koskemattomaksi (ks. piirra()), pelkkä display:
     none tässä. Nyt/seuraava näyttävät VAIN esikatselukehyksen (thumbnail),
     keskitettynä (#nyt/#seuraava justify-content:center) koska se on ainoa
     jäljellä oleva sisältö. */
  #nyt-sisalto, #seuraava-sisalto{ display:none; }

  #muistiinpanot{
    flex:1.6; background:var(--tausta2); border:1px solid var(--reuna); border-radius:14px;
    padding:24px 28px; overflow-y:auto; min-height:0;
  }
  /* 3x isompi (6.9.2026, Jarno: "Muistiinanot should be 3x bigger maybe"),
     MUTTA 7.9.2026 Jarno: "MUISTIINPANOT is now too big, does not fit. Or
     can it be scalable, fit always based on text?" - kiinteä 4.8rem oli
     hyvä lyhyille muistiinpanoille mutta ylivuoti pitkillä. font-size ei
     enää kiinteä CSS-arvo vaan JS asettaa sen JOKA pysähdykselle erikseen
     (ks. sovitaMuistiinpanotFontti()) - 4.8rem on vain YLÄRAJA/oletus,
     pienenee automaattisesti kunnes teksti mahtuu ilman vieritystä (tai
     saavuttaa alarajan, jolloin vieritys astuu kuvaan kuten ennenkin).
  */
  #muistiinpanot .sisalto{
    font-size:4.8rem; line-height:1.4; white-space:pre-wrap;
  }
  #muistiinpanot .tyhja{ color:var(--himmea); font-size:1.6rem; font-style:italic; }

  #seuraava{
    background:var(--tausta2); border:1px solid var(--reuna); border-radius:14px;
    padding:14px 20px; opacity:0.7; display:flex; justify-content:center; align-items:flex-start;
    flex:1; min-height:0; overflow-y:auto;
  }

  /* STRIPPI (7.9.2026, Jarno: "+10 -10 does not tell enything can there be
     small thumbmails of next 10? maybe scrollable" -> sitten "no need for
     preview, same kind of thumbnails, but just with text on presentation")
     - korvaa entiset sokeat ±10-napit vaakasuunnassa vieritettävällä
     rivillä TEKSTIKORTTEJA (EI kuvia - kokeiltiin ensin staattisia canvas-
     kaappauksia piilotetusta iframesta, ks. git-historia/muistio jos joskus
     tarvitaan uudelleen, mutta Jarno päätti tekstin riittävän) seuraavista
     ~10 pysähdyksestä. Jokainen kortti klikattavissa, vie suoraan siihen
     pysähdykseen. */
  #strippi{
    display:flex; gap:10px; overflow-x:auto; padding:4px 2px 8px; scrollbar-width:thin;
    cursor:grab; user-select:none;
  }
  #strippi:active{ cursor:grabbing; }
  .strippi-kohta{
    flex-shrink:0; width:150px; cursor:pointer; border-radius:9px;
    border:1px solid var(--reuna); background:var(--tausta2); padding:10px 12px;
    transition:border-color .15s ease;
  }
  .strippi-kohta:hover{ border-color:var(--korostus); }
  /* OHITETTAVA (8.10.2026, Jarno: "selkeä punainen kehys sivuihin, jotka voisi skipata")
     - data: `ohitettava: true`. Kehys nyt-, seuraava- ja strippikorteissa. */
  .ohitettava{ outline:4px solid #ff3b3b !important; outline-offset:-4px; }
  .ohitettava-merkki{ display:inline-block; margin-left:6px; padding:0 5px; border-radius:4px; background:#ff3b3b; color:#fff; font-size:0.62rem; font-weight:800; letter-spacing:0.05em; }
  .strippi-idx{ font-size:0.68rem; color:var(--himmea); font-weight:600; letter-spacing:0.04em; }
  .strippi-otsikko{
    font-size:0.85rem; font-weight:700; line-height:1.25; color:var(--teksti); margin-top:3px;
  }
  .strippi-teksti{
    font-size:0.72rem; color:var(--himmea); margin-top:4px; line-height:1.3;
  }

  /* Siirretty #ylapalkkiin 9.9.2026 (Jarno: "to save space, can these just
     ne on top with <-- --> buttons, next to 01/96") - oma rivi diaselaimen
     alla vei turhaan pystytilaa, joka annetaan nyt #muistiinpanotille
     (sama periaate kuin #pikasiirron poistolla). Pienemmät napit ja
     align-self:center koska #ylapalkin oma align-items on baseline
     (sopii tekstirivelle, ei napeille). */
  #ohjaimet{ display:flex; gap:8px; align-items:center; align-self:center; flex-wrap:wrap; }
  #ohjaimet button{
    background:var(--tausta2); border:1px solid var(--reuna); color:var(--teksti);
    font-size:0.85rem; padding:6px 14px; border-radius:7px; cursor:pointer;
  }
  #ohjaimet button:hover{ border-color:var(--korostus); }
  #ohjaimet .vihje{ display:none; }

  /* PIKASIIRTO poistettu (9.9.2026, Jarno: "i dont use mene pysähdykseen at
     all... I use slider to go and skip slides" - #strippi hoitaa saman
     tarpeen, ks. sen oma kommentti). Rivi vei tilaa pohjalta, jonka voi
     antaa #paakolumnit:lle (flex:1 body:n pystypinossa - vapautuva korkeus
     menee automaattisesti sille, sama periaate kuin leveyden kavennuksella
     #vasenKolumnissa). */
</style>
</head>
<body>

<div id="ylapalkki">
  <div id="kelloryhma">
    <div id="kellonaika">--:--</div>
    <div id="kello">00:00</div>
    <div id="tavoite">
      loppu klo <input type="time" id="tavoiteMinuutit" value="11:28">
      &middot; jäljellä <span id="tavoiteJaljella">--:--</span>
      &middot; <span id="tahti">--</span>
    </div>
  </div>
  <div id="yhteys" class="ei"><span class="tila">ei yhteyttä päänäyttöön</span><button id="synkronoi" title="Pyydä päänäytöltä nykyinen tila uudelleen">🔄 Synkronoi</button></div>
  <div id="ohjaimet">
    <button id="edellinen">&larr;</button>
    <button id="seuraavaNappi">&rarr;</button>
    <span class="vihje">nuolinäppäimet toimivat myös, ohjaa kumpaa tahansa näyttöä</span>
  </div>
  <div id="laskuri">01 / 96</div>
</div>

<div id="paakolumnit">
  <div id="vasenKolumni">
    <div id="nyt">
      <div class="esikatselu-kehys"><iframe id="esikatseluNyt"></iframe></div>
      <div id="nyt-sisalto">
        <div class="otsikko" id="nytOtsikko"></div>
        <div class="teksti" id="nytTeksti"></div>
        <div class="lahde" id="nytLahde"></div>
      </div>
    </div>

  </div>

  <div id="muistiinpanot">
    <div class="sisalto" id="muistiinpanotSisalto"></div>
  </div>
</div>

<div id="alarivi">
  <div id="seuraava" title="Siirry seuraavaan">
    <div class="label">Seuraavaksi</div>
    <div class="esikatselu-kehys"><iframe id="esikatseluSeuraava"></iframe></div>
    <div id="seuraava-sisalto">
      <div class="otsikko" id="seuraavaOtsikko"></div>
      <div class="teksti" id="seuraavaTeksti"></div>
    </div>
  </div>
  <div id="strippi"></div>
</div>

<script src="esitys-data.js"></script>
<script>
let indeksi = 0;
let alkuaika = Date.now();
let yhteydessa = false;

const kanava = new BroadcastChannel('tekoalykahvit-esitys');

function laheta(uusiIndeksi){
  kanava.postMessage({ tyyppi:'siirry', indeksi: uusiIndeksi, alkuaika });
}

kanava.onmessage = e => {
  const d = e.data;
  if (!d) return;
  if (d.tyyppi === 'siirry'){
    yhteydessa = true;
    paivitaYhteys();
    if (typeof d.alkuaika === 'number') alkuaika = d.alkuaika;
    indeksi = Math.max(0, Math.min(PYSAHDYKSET.length - 1, d.indeksi));
    piirra();
  }
};

function paivitaYhteys(){
  const el = document.getElementById('yhteys');
  // HUOM: el.textContent = ... korvaisi #synkronoi-napin kokonaan (se on
  // #yhteys:n lapsi) - päivitetään sen sijaan VAIN .tila-span, nappi
  // koskematon. (Myös korjattu vanhentunut "avaa esitys-3d.html" -viite,
  // päänäyttö on nykyään esitys-2d.html.)
  el.querySelector('.tila').textContent = yhteydessa ? 'yhteydessä päänäyttöön' : 'ei yhteyttä päänäyttöön — avaa esitys-2d.html samalta palvelimelta';
  el.className = yhteydessa ? 'ok' : 'ei';
}

function siirry(uusi){
  uusi = Math.max(0, Math.min(PYSAHDYKSET.length - 1, uusi));
  if (uusi === indeksi) return;
  indeksi = uusi;
  piirra();
  laheta(indeksi);
}

// ============================================================
// ESIKATSELU-IFRAMET + STRIPPI (7.9.2026, Jarno: "would it be impossible to
// see current slide as it is? too much GPU?" -> "option 1 i go with that.
// and to that. Seuraavaksi. can it be there too. and +10 -10 does not tell
// enything can there be small thumbmails of next 10? maybe scrollable")
//
// Kolme osaa, kaikki upottavat SAMAN esitys-2d.html:n ?esikatselu=1-tilassa
// (ks. sen oman ESIKATSELU-vakion kommentti - BroadcastChannel/session-
// Storage/opasvalinta/ääni/HUD kaikki pois päältä siellä, jotta iframe ei
// koskaan sotke oikeaa esitys<->esittäjänäkymä-synkronointia):
//
//   1. #esikatseluNyt  - ELÄVÄ iframe, seuraa nykyistä pysähdystä
//   2. #esikatseluSeuraava - ELÄVÄ iframe, seuraa seuraavaa pysähdystä
//   3. #kaappausIframe - PIILOTETTU, käytetään VAIN #strippi:n staattisten
//      kaappauskuvien generointiin, yksi pysähdys kerrallaan jonossa -
//      GPU-syy (Jarnon alkuperäinen huoli) miksi strippi EI ole 10 elävää
//      iframea: kaksi elävää WebGL-kontekstia (nyt+seuraava) on ok, mutta
//      10+ samanaikaista ei.
//
// Kaikkien kolmen `src` asetetaan VAIN KERRAN (ei koskaan uudelleenladata -
// se lataisi koko Phaserin+assetit joka pysähdyksellä) - kohdepysähdystä
// vaihdetaan sen jälkeen kutsumalla iframen SISÄLLÄ olevaa globaalia
// window.__esikatseluSiirry(x)-funktiota suoraan.
// ============================================================

const esikatseluNytEl = document.getElementById('esikatseluNyt');
const esikatseluSeuraavaEl = document.getElementById('esikatseluSeuraava');
esikatseluNytEl.src = 'esitys-2d.html?esikatselu=1';
esikatseluSeuraavaEl.src = 'esitys-2d.html?esikatselu=1';

// yrityEsikatselu: __esikatseluSiirry ei ole olemassa iframen sisällä ennen
// kuin SEN OMA Phaser create() on ehtinyt ajaa - siksi pieni uudelleenyritys-
// silmukka (50ms x enintään 100 = 5s kattaa reilusti hitaankin ensilatauksen),
// eikä kertaluontoinen "load"-tapahtuma riitä (se laukeaa ennen Phaser-scenen
// omaa valmistumista).
function yrityEsikatselu(iframe, yritys){
  yritys = yritys || 0;
  const x = Number(iframe.dataset.kohdeX);
  if (isNaN(x)) return;
  try {
    if (iframe.contentWindow && iframe.contentWindow.__esikatseluSiirry) {
      iframe.contentWindow.__esikatseluSiirry(x);
      return;
    }
  } catch (e) {}
  if (yritys < 100) setTimeout(() => yrityEsikatselu(iframe, yritys + 1), 50);
}
function asetaEsikatselu(iframe, x){
  if (x == null) return;
  iframe.dataset.kohdeX = x;
  yrityEsikatselu(iframe);
}

// paivitaStrippi: näyttää KAIKKI jäljellä olevat pysähdykset (indeksi+1 ...
// loppuun) TEKSTIKORTTEINA (7.9.2026, Jarno ensin "next 10... maybe
// scrollable", sitten "can there be slider of those 10? mean more when
// sliding?" - koska kortit ovat pelkkää tekstiä eikä kuvia/live-iframeja,
// koko lopputalousuuden renderöinti kerralla (max ~100 kpl) on täysin
// halpaa - ei tarvita liukuvaa/lazy-latausta, DOM-määrä on niin pieni ettei
// virtualisointia tarvita). Jokainen kortti klikattavissa -> oikea siirry().
function lyhennaTeksti(t, maxPit){
  if (!t) return '';
  const s = tekstiRiveina(t).replace(/\s+/g, ' ').trim();
  return s.length > maxPit ? s.slice(0, maxPit - 1) + '…' : s;
}
function paivitaStrippi(){
  const strippi = document.getElementById('strippi');
  strippi.innerHTML = '';
  for (let idx = indeksi + 2; idx < PYSAHDYKSET.length; idx++) {   // indeksi+1 näkyy #seuraava-kortissa alarivin alussa
    const p = PYSAHDYKSET[idx];
    const kortti = document.createElement('div');
    kortti.className = 'strippi-kohta' + (p.ohitettava ? ' ohitettava' : '');
    // vedon (raahauksen) jälkeinen klikkaus ei saa navigoida - ks.
    // strippi-raahaus-lohko alempana, joka asettaa strippi.dataset.raahattiin
    kortti.addEventListener('click', () => { if (strippi.dataset.raahattiin !== '1') siirry(idx); });

    const idxEl = document.createElement('div');
    idxEl.className = 'strippi-idx';
    idxEl.textContent = '#' + (idx + 1);
    if (p.ohitettava) idxEl.insertAdjacentHTML('beforeend', '<span class="ohitettava-merkki">OHITA?</span>');
    kortti.appendChild(idxEl);

    if (p.otsikko) {
      const otsikkoEl = document.createElement('div');
      otsikkoEl.className = 'strippi-otsikko';
      otsikkoEl.textContent = lyhennaTeksti(p.otsikko, 44);
      kortti.appendChild(otsikkoEl);
    }

    if (p.teksti) {
      const tekstiEl = document.createElement('div');
      tekstiEl.className = 'strippi-teksti';
      tekstiEl.textContent = lyhennaTeksti(p.teksti, p.otsikko ? 60 : 90);
      kortti.appendChild(tekstiEl);
    }

    strippi.appendChild(kortti);
  }
}

// STRIPPI-RAAHAUS (7.9.2026, Jarno: "too hard for Mac?") - kahden
// sormen trackpad-vieritys vierittää #strippi:n vaakasuunnassa jo
// natiivisti (overflow-x:auto), mutta lisätään tähän päälle vielä 1)
// hiiren rullan pystyliike -> vaakavieritys (kannettavan ulkoinen hiiri
// ilman vaakarullaa) ja 2) raahaus hiiren/kosketuksen painikkeella
// (drag-to-scroll), jotta vieritys tuntuu luontevalta millä tahansa
// laitteella. Raahauksen aikana `raahattiin`-lippu estää raahauksen
// päättävän hiiren-ylös-tapahtuman laukaisemasta vahingossa kortin
// klikkausta (muuten jokainen raahaus samalla "hyppäisi" siihen kohtaan).
const strippiEl = document.getElementById('strippi');
strippiEl.addEventListener('wheel', e => {
  if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return; // aito vaakavieritys (trackpad) - anna selaimen hoitaa itse
  e.preventDefault();
  strippiEl.scrollLeft += e.deltaY;
}, { passive: false });

let raahausAlkuX = 0, raahausAlkuScroll = 0, raahaamassa = false;
strippiEl.addEventListener('pointerdown', e => {
  raahaamassa = true;
  raahausAlkuX = e.clientX;
  raahausAlkuScroll = strippiEl.scrollLeft;
  strippiEl.dataset.raahattiin = '0';
});
strippiEl.addEventListener('pointermove', e => {
  if (!raahaamassa) return;
  const ero = e.clientX - raahausAlkuX;
  if (Math.abs(ero) > 4) strippiEl.dataset.raahattiin = '1'; // yli 4px liike = raahaus, ei klikkaus
  strippiEl.scrollLeft = raahausAlkuScroll - ero;
});
addEventListener('pointerup', () => { raahaamassa = false; });

// tekstiRiveina: `teksti` on YLEENSÄ pelkkä merkkijono, MUTTA joskus
// { rivi: '...' }-taulukko (ks. esitys-2d.html:n Array.isArray(p.teksti)
// -haara, "bullet-lista"-tyyppinen pysähdys, esim. x:11485 "Tekoäly HR:n
// sivuaivoina") - löydetty 6.9.2026 tätä muokatessa: presenter-näkymä
// näytti silloin raakaa "[object Object],[object Object]" -tekstiä, koska
// .textContent = array kutsuu hiljaa Array.prototype.toString()-metodia.
// Tämä auttaja palauttaa AINA tavallisen, ihmisen luettavan merkkijonon
// riippumatta kummasta muodosta on kyse.
function tekstiRiveina(teksti){
  if (!teksti) return '';
  if (Array.isArray(teksti)) return teksti.map(r => '• ' + siivoaHtml(r.rivi || '')).join('\n');
  return siivoaHtml(teksti);
}

// siivoaHtml: monilla otsikko/teksti-kentillä on HTML-merkkausta (esim.
// <span style="color:#B0CB40">...</span>), tarkoitettu VAIN esitys-2d.html:n
// omalle innerHTML-renderöinnille (siellä värit näkyvät oikein). Tämä sivu
// käyttää kaikkialla .textContent:ia (turvallisempi, ei koskaan suorita
// mitään), mutta se näyttää HTML-tagit RAAKANA näkyvänä tekstinä (7.9.2026,
// löytyi Taiteilijajärjestöt-deckistä, Jarno: "<span> classes break the
// textext on notes, nyt ja seuraavaksi"). Korjaus: puretaan tagit pois VAIN
// täällä (ei kosketa esitys-2d.html:ää) käyttämällä selaimen omaa HTML-
// jäsentäjää tilapäisessä <div>:ssä - näin myös HTML-entiteetit (&amp; jne.)
// puretaan oikein, ei vain regexillä. Ei sisältökohtainen, portattu
// Taiteilijajärjestöt-deckistä.
function siivoaHtml(s){
  if (!s) return '';
  const tmp = document.createElement('div');
  tmp.innerHTML = s;
  return tmp.textContent || '';
}

// MUISTIINPANOJEN AUTOMAATTINEN FONTTIKOKO (7.9.2026, Jarno: "MUISTIINPANOT
// is now too big, does not fit. Or can it be scalable, fit always based on
// text? it can be big if only couple word, if lot then fit.") - aloitetaan
// suurimmasta sallitusta koosta (MAX, sama 4.8rem kuin aiempi kiinteä arvo)
// ja pienennetään askel kerrallaan NIIN KAUAN kuin #muistiinpanot-laatikko
// ylivuotaa (scrollHeight > clientHeight - todellinen mitattu ylivuoto, ei
// arvattu merkkimäärä-raja) - pysähtyy joko kun teksti mahtuu tai kun
// MIN-alaraja saavutetaan (jolloin jäljelle jäävä ylivuoto vierittyy
// normaalisti, sama #muistiinpanot:n overflow-y:auto kuin ennenkin).
// Kutsutaan joka kerta kun muistiinpanot vaihtuvat (piirra()) JA ikkunan
// koon muuttuessa (koska sopiva fonttikoko riippuu laatikon todellisesta
// pikselikoosta).
const MUISTIINPANOT_MAX_REM = 4.8, MUISTIINPANOT_MIN_REM = 1.1, MUISTIINPANOT_ASKEL_REM = 0.15;
function sovitaMuistiinpanotFontti(){
  const kontti = document.getElementById('muistiinpanot');
  const ms = document.getElementById('muistiinpanotSisalto');
  let koko = MUISTIINPANOT_MAX_REM;
  ms.style.fontSize = koko + 'rem';
  while (koko > MUISTIINPANOT_MIN_REM && kontti.scrollHeight > kontti.clientHeight + 1) {
    koko -= MUISTIINPANOT_ASKEL_REM;
    ms.style.fontSize = koko.toFixed(2) + 'rem';
  }
}
// Ruututekstin fontti sovitetaan samalla periaatteella kuin muistiinpanot.
const NYT_MAX_REM = 2.4, NYT_MIN_REM = 0.9;
function sovitaNytFontti(){
  const el = document.getElementById('nyt-sisalto');
  let koko = NYT_MAX_REM;
  el.style.fontSize = koko + 'rem';
  while (koko > NYT_MIN_REM && el.scrollHeight > el.clientHeight + 1) {
    koko -= 0.1;
    el.style.fontSize = koko.toFixed(2) + 'rem';
  }
}
addEventListener('resize', sovitaNytFontti);
addEventListener('resize', () => {
  if (!document.getElementById('muistiinpanotSisalto').classList.contains('tyhja')) sovitaMuistiinpanotFontti();
});

function piirra(){
  const p = PYSAHDYKSET[indeksi];
  const seur = PYSAHDYKSET[indeksi + 1];

  document.getElementById('nyt').classList.toggle('ohitettava', !!p.ohitettava);
  document.getElementById('seuraava').classList.toggle('ohitettava', !!(seur && seur.ohitettava));
  document.getElementById('laskuri').textContent =
    String(indeksi + 1).padStart(2, '0') + ' / ' + PYSAHDYKSET.length;

  // Ruututeksti kokonaan: otsikko, teksti/rivit, vertailun palstat, lähde.
  let ruutu = tekstiRiveina(p.teksti);
  if (p.vertailu) {
    const v = p.vertailu, rivit = [];
    if (v.otsikot) rivit.push(v.otsikot.map(siivoaHtml).join('  |  '));
    (v.rivit || []).forEach(r => rivit.push(siivoaHtml(r.vasen) + '  |  ' + siivoaHtml(r.oikea)));
    ruutu = (ruutu ? ruutu + '\n' : '') + rivit.join('\n');
  }
  const nytOtsikkoEl = document.getElementById('nytOtsikko');
  nytOtsikkoEl.textContent = siivoaHtml(p.otsikko);
  if (!nytOtsikkoEl.textContent.trim() && !ruutu.trim()) nytOtsikkoEl.innerHTML = '<span class="tyhja">(ei tekstiä ruudulla)</span>';
  document.getElementById('nytTeksti').textContent = ruutu;
  document.getElementById('nytLahde').textContent = p.lahde ? '– ' + siivoaHtml(p.lahde) : '';
  requestAnimationFrame(() => requestAnimationFrame(sovitaNytFontti));

  const ms = document.getElementById('muistiinpanotSisalto');
  if (p.muistiinpanot){
    ms.textContent = siivoaHtml(p.muistiinpanot);
    ms.classList.remove('tyhja');
    // KORJAUS (7.9.2026): synkroninen kutsu heti textContent-asetuksen
    // jälkeen pysäytti kutistuksen liian aikaisin (scrollHeight mitattu
    // ennen kuin selain oli ehtinyt asetella uuden tekstin rivitystä
    // täysin - sama "layout ei ole vielä asettunut" -ongelmaluokka kuin
    // esim. lukukortin/tamagotchin nakyy-luokan double-rAF-korjauksissa
    // esitys-2d.html:ssä) - pakotetaan odottamaan kaksi requestAnimationFrame-
    // kierrosta ennen mittausta, sama vakiokäytäntö.
    requestAnimationFrame(() => requestAnimationFrame(sovitaMuistiinpanotFontti));
  } else {
    ms.textContent = '(ei muistiinpanoja tälle kohdalle)';
    ms.classList.add('tyhja');
    ms.style.fontSize = ''; // tyhjä-tila käyttää oman CSS-luokkansa kokoa (1.6rem), ei jää edellisen pysähdyksen sovitettua kokoa päälle
  }

  document.getElementById('seuraavaOtsikko').textContent = seur ? siivoaHtml(seur.otsikko) : '— esityksen loppu —';
  document.getElementById('seuraavaTeksti').textContent = seur ? tekstiRiveina(seur.teksti) : '';

  asetaEsikatselu(esikatseluNytEl, p.x);
  if (seur) asetaEsikatselu(esikatseluSeuraavaEl, seur.x);
  paivitaStrippi();
}

function paivitaKello(){
  const s = Math.max(0, Math.floor((Date.now() - alkuaika) / 1000));
  const mm = String(Math.floor(s / 60)).padStart(2, '0');
  const ss = String(s % 60).padStart(2, '0');
  document.getElementById('kello').textContent = mm + ':' + ss;
  paivitaTavoite(s);
}

// KELLONAIKA (6.9.2026, Jarno: "There could be added current time, clock")
// - tavallinen HH:MM seinäkello, eri asia kuin yllä oleva kulunut-aika-
// kello. Päivitetään samassa 1s-tahdissa, ei omaa erillistä ajastinta.
function paivitaKellonaika(){
  const nyt = new Date();
  const hh = String(nyt.getHours()).padStart(2, '0');
  const mm = String(nyt.getMinutes()).padStart(2, '0');
  document.getElementById('kellonaika').textContent = hh + ':' + mm;
}

// LOPETUSKELLONAIKA + TAHTIMITTARI (8.10.2026, Jarno: "näen kellosta paremmin
// että nyt tulee skipata"). Kenttään lopetuksen kellonaika (esim. 11:28).
// Jäljellä = lopetus - seinäkello. Tahti: alkuaika (oppaan valinta) ->
// lopetus on suunniteltu kesto; pysähdyksillä paino 1, tekstittömillä
// (pelkkä kuva/animaatio) 0.4. Verrataan kuinka suuri osa painoista on
// takana vs. kuinka suuri osa ajasta on kulunut -> "+2:30 jäljessä".
const TAVOITE_AVAIN = 'esittajanakyma-loppu-klo';
const tavoiteInput = document.getElementById('tavoiteMinuutit');
try {
  const tallennettu = localStorage.getItem(TAVOITE_AVAIN);
  if (tallennettu) tavoiteInput.value = tallennettu;
} catch (e) {}
tavoiteInput.addEventListener('change', () => {
  try { localStorage.setItem(TAVOITE_AVAIN, tavoiteInput.value); } catch (e) {}
  paivitaKello();
});
function loppuHetki(){
  const [h, m] = (tavoiteInput.value || '').split(':').map(Number);
  if (isNaN(h) || isNaN(m)) return null;
  const d = new Date(); d.setHours(h, m, 0, 0); return d.getTime();
}
const paino = p => (p.otsikko || p.teksti || p.lahde) ? 1 : 0.4;
const mmss = s => { s = Math.round(Math.abs(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
function paivitaTavoite(){
  const el = document.getElementById('tavoiteJaljella'), tahti = document.getElementById('tahti');
  const loppu = loppuHetki();
  if (loppu == null) { el.textContent = '--:--'; tahti.textContent = '--'; return; }
  const jaljellaS = Math.round((loppu - Date.now()) / 1000);
  el.textContent = (jaljellaS < 0 ? '-' : '') + mmss(jaljellaS).padStart(5, '0');
  el.className = jaljellaS < 0 ? 'myohassa' : (jaljellaS < 300 ? 'varoitus' : 'ok');
  const suunniteltu = (loppu - alkuaika) / 1000;
  if (suunniteltu <= 60) { tahti.textContent = '--'; tahti.className = ''; return; }
  let yht = 0, takana = 0;
  PYSAHDYKSET.forEach((p, i) => { const w = paino(p); yht += w; if (i < indeksi) takana += w; else if (i === indeksi) takana += w / 2; });
  const ero = ((Date.now() - alkuaika) / 1000 / suunniteltu - takana / yht) * suunniteltu;   // + = jäljessä
  if (Math.abs(ero) < 60) { tahti.textContent = 'aikataulussa'; tahti.className = 'ajassa'; }
  else if (ero > 0) { tahti.textContent = '+' + mmss(ero) + ' jäljessä'; tahti.className = 'jaljessa'; }
  else { tahti.textContent = mmss(ero) + ' edellä'; tahti.className = 'edella'; }
}
setInterval(() => { paivitaKello(); paivitaKellonaika(); }, 1000);
paivitaKello();
paivitaKellonaika();

document.getElementById('edellinen').addEventListener('click', () => siirry(indeksi - 1));
document.getElementById('seuraavaNappi').addEventListener('click', () => siirry(indeksi + 1));
document.getElementById('seuraava').addEventListener('click', () => siirry(indeksi + 1));

// SYNKRONOI-nappi (6.9.2026, "worst case" -pyyntö: jos yhteys näyttää
// katkenneelta/vanhentuneelta - esim. päänäyttö ladattiin uudelleen kesken
// esityksen JA molemmat olivat jo auki, ks. esitys-2d.html:n uusi
// latauksenaikainen broadcast tälle samalle tapaukselle - tämä on silti
// hyvä olla manuaalisena varmistuksena) - kysyy tilan uudelleen käsin,
// sama viesti kuin sivun omalla latautumishetkellä.
document.getElementById('synkronoi').addEventListener('click', () => {
  kanava.postMessage({ tyyppi:'kysy' });
});

addEventListener('keydown', e => {
  // ei kaapata nuolinäppäimiä/väliä kun kirjoitetaan tavoiteaika-kenttään
  // (muuten kenttään ei voisi kirjoittaa numeroa käyttämättä nuolinäppäimiä
  // arvon säätöön).
  if (e.target === tavoiteInput) return;
  switch (e.key){
    case 'ArrowRight': case 'PageDown': case ' ': case 'Enter': case 'ArrowDown':
      e.preventDefault(); siirry(indeksi + 1); break;
    case 'ArrowLeft': case 'PageUp': case 'ArrowUp': case 'Backspace':
      e.preventDefault(); siirry(indeksi - 1); break;
    // G = oppaan valintaruutu, 1-4 = valitse opas: välitetään päänäytölle
    // (7.10.2026, Jarno: "toimiiko jos olen esiintyjänäkymässä, painan G ja numeroa")
    case 'g': case 'G': case '1': case '2': case '3': case '4':
      kanava.postMessage({ tyyppi:'nappain', key: e.key }); break;
  }
});

// kysy nykyinen tila päänäytöltä heti kun tämä ikkuna avataan (jos
// päänäyttö on jo edennyt pidemmälle kuin alkuun)
kanava.postMessage({ tyyppi:'kysy' });
paivitaYhteys();
piirra();
</script>
